<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Your decision rooms: open, ongoing and finished.">
<title>Your rooms · Decision Rooms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,300..600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/rooms/rooms.css">
<style>
/* Dashboard (from the paper sketch, in the editorial style of the reference): numbers row, your open rooms
   as cards with Invite, then Ongoing and Old lists. Flat white cards on the yellow ground, thin dividers. */
main{--content:none}
.db-title{margin:24px 0 8px;max-width:14ch}
.db-hello{margin:24px 0 18px}
.db-hello .eyebrow{display:block;font-size:14px;color:var(--dim)}
.db-hello .db-title{margin:6px 0 8px;max-width:22ch}
.db-hello .db-line{margin:0;font-size:var(--t-h5);max-width:46ch}
.db-sec{display:flex;flex-direction:column;gap:12px;margin-top:40px}
.db-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.db-head h2{margin:0;font-size:var(--t-h4);font-weight:400;letter-spacing:-.02em}
.db-head .n{font-size:var(--t-ui);color:var(--dim)}
/* Number cards: title, divider, big figure beside a short label, one sentence at the foot */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:28px;padding-block:28px}
.stat{display:flex;flex-direction:column;background:#fff;padding:20px 20px 22px;min-height:300px;color:var(--fg);text-decoration:none}
.stat h3{margin:0 0 16px;font-size:var(--t-h5);font-weight:400;letter-spacing:-.01em;color:var(--fg);padding-bottom:16px;border-bottom:1px solid var(--line)}
.stat .fig{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.stat .num{font-size:var(--t-display);line-height:1;font-weight:400;letter-spacing:-.04em;padding:22px 0 14px;border-inline-end:1px solid var(--line)}
.stat .cap{align-self:end;font-size:var(--t-ui);line-height:1.25;padding:0 0 14px 12px}
[dir=rtl] .stat .cap{padding:0 12px 14px 0}
.stat .foot{margin-top:auto;padding-top:24px;font-size:var(--t-ui);line-height:1.4}
.stat.go .num{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.rcard{display:flex;flex-direction:column;gap:14px;background:#fff;padding:20px}
.rcard a.open{display:flex;flex-direction:column;gap:8px;color:var(--fg);text-decoration:none;flex:1}
.rcard a.open .meta{padding-bottom:12px;border-bottom:1px solid var(--line)}
.rcard a.open:hover .q{text-decoration:underline;text-underline-offset:3px}
.rcard .q{font-size:var(--t-h5);font-weight:400;line-height:1.3;letter-spacing:-.01em}
.rcard .st{font-size:14px;color:var(--dim)}
.rcard .st.go{color:var(--fg);font-weight:600}
.rcard .invite{width:100%}
.panel{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.panel .share{grid-template-columns:1fr 1fr}
.addcard{display:flex;align-items:center;justify-content:center;gap:10px;min-height:160px;border:1.5px dashed rgba(20,20,20,.35);
  color:var(--fg);text-decoration:none;font-size:16px;font-weight:500}
.addcard:hover{background:#fff;border-style:solid}
.addcard b{font-size:26px;font-weight:300;line-height:1}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;background:var(--line)}
.rrow a{display:grid;grid-template-columns:1fr auto;gap:6px 24px;align-items:start;background:#fff;padding:18px 20px;color:var(--fg);text-decoration:none}
.rrow a:hover .q{text-decoration:underline;text-underline-offset:3px}
.rrow.old a{background:#FFF8D6}
.rrow .q{font-size:var(--t-h5);font-weight:400;line-height:1.35;letter-spacing:-.01em}
.rrow .when{font-size:14px;color:var(--dim);white-space:nowrap}
.rrow .who{grid-column:1/-1;font-size:14px;color:var(--dim)}
.rrow .who b{font-weight:500;color:var(--fg)}
.rrow .st{grid-column:1/-1;font-size:14px;color:var(--dim)}
.rrow .st.go{color:var(--fg);font-weight:600}
.search{display:flex;gap:10px;align-items:center;margin:8px 0 28px}
.search input{flex:1;font-size:16px}
.attention{display:flex;flex-direction:column;gap:1px;background:var(--line);list-style:none;margin:0 0 8px;padding:0}
.attention li{display:grid;grid-template-columns:1fr auto;gap:6px 18px;align-items:center;background:var(--yellow);padding:16px 20px}
.attention .q{font-size:16px;line-height:1.35}
.attention .why{grid-column:1;font-size:14px}
.attention .act{grid-row:1/3;grid-column:2;white-space:nowrap}
@media (max-width:560px){.attention li{grid-template-columns:1fr}.attention .act{grid-row:auto;grid-column:1}}
.empty{margin:0;font-size:15px;color:var(--dim);padding:6px 0}
@media (max-width:560px){.rrow a{grid-template-columns:1fr}.rrow .when{white-space:normal}.addcard{min-height:72px}.stat{min-height:0}.stat .num{font-size:56px}}
</style>
</head>
<body>
<main>
  <header class="top">
    <a class="wm" href="/">Decision Rooms</a>
    <div class="top-acts"><button class="lang" type="button" id="langBtn"></button></div>
  </header>
  <div id="view" aria-live="polite"><article class="msg"><p class="text thinking">One moment</p></article></div>
  <p class="small" id="demoNote" data-t="demo_note" hidden style="text-align:center;padding-top:16px"></p>
</main>

<script src="/rooms/rooms.js"></script>
<script>
(() => {
const { $, el, t } = Rooms;
const demo = new URLSearchParams(location.search).get("demo");
const view = $("view");
let rooms = null, myName = "", helping = [];   // helping: rooms you run for someone else, as their assistant

// Demo data mirrors the sketch: two open rooms of yours, one ongoing, one old.
const DEMO = [
  { id: "r1", type: "business", question: "Room 1: open a second location in Jeddah?", status: "open", role: "owner", created_at: "2026-10-12", quorum: 2, members: 1, submitted: 0, i_submitted: false, has_verdict: false, names: [], decide_by: "2026-10-19", invited: 3, options: [{ label: "Open this year" }, { label: "Wait until spring" }] },
  { id: "r2", type: "trip", question: "Room 2: where should the six of us go in March?", status: "open", role: "owner", created_at: "2026-10-14", quorum: 2, members: 3, submitted: 2, i_submitted: true, has_verdict: false, names: ["Lina", "Omar"], last_input: "2026-10-15T10:00:00Z", options: [{ label: "Lisbon" }, { label: "Tbilisi" }] },
  { id: "r3", type: "politics", question: "Political briefing: do we speak on the new data law?", status: "deciding", role: "member", created_at: "2026-10-08", quorum: 2, members: 4, submitted: 4, i_submitted: true, has_verdict: true, names: ["Ramy", "Ahmed", "Chris"] },
  { id: "r4", type: "finance", question: "Egyptian economy: hold, hedge or exit our EGP position?", status: "decided", role: "member", created_at: "2026-09-21", quorum: 2, members: 3, submitted: 3, i_submitted: true, has_verdict: true, names: ["Chris", "Neon"], final_label: "Hedge half", options: [{ label: "Hold" }, { label: "Hedge half" }, { label: "Exit" }] },
  { id: "r5", type: "business", question: "Do we move the regional office to Dubai?", status: "decided", role: "owner", created_at: "2026-09-30", quorum: 2, members: 5, submitted: 5, i_submitted: true, has_verdict: true, names: ["Kenji", "Amara", "Sara", "Omar"], decided_at: "2026-10-10T09:00:00Z", signed: 2, final_label: "Move in Q2", options: [{ label: "Move now" }, { label: "Move in Q2" }, { label: "Stay" }] }
];

/* ---------- Helpers ---------- */
// "Ramy, Ahmed and Chris" / "Ramy, Ahmed and 3 more"
function names(list) {
  if (!list.length) return t("db_only_you");
  if (list.length === 1) return list[0];
  if (list.length <= 3) return t("names_and", { a: list.slice(0, -1).join(", "), b: list[list.length - 1] });
  return t("names_more", { list: list.slice(0, 2).join(", "), n: list.length - 2 });
}
// One plain line on where a room stands, with what you need to do first.
function statusLine(r) {
  if (r.status === "open" && !r.i_submitted && r.role !== "observer") return { text: t("st_input"), go: true };
  if (r.status === "open") return { text: t("st_waiting", { n: r.submitted, total: r.members }), go: r.role === "owner" && r.submitted >= r.quorum };
  if (r.status === "deciding") return r.has_verdict ? { text: t("st_verdict"), go: r.role === "owner" } : { text: t("st_deciding") };
  return { text: t(r.status === "reviewed" ? "st_reviewed" : "st_decided") };
}
const roomHref = r => demo ? "/room.html?demo=" + (r.role === "owner" ? "owner" : "1") : "/room.html?room=" + r.id;
function q(r, cls = "q") { const s = el("span", cls, r.question); s.lang = r.language || "en"; s.dir = r.language === "ar" ? "rtl" : "ltr"; return s; }
function section(title, count) {
  const sec = el("section", "db-sec");
  const h = el("div", "db-head"); h.append(el("h2", null, title), el("span", "n", count != null ? String(count) : ""));
  sec.append(h);
  return sec;
}

/* ---------- Invite (owner) ---------- */
async function inviteToken(roomId) {
  if (demo) return "demo-" + roomId;
  const sb = Rooms.sb;
  const { data } = await sb.from("invites").select("token").eq("room_id", roomId).eq("revoked", false).is("person_name", null)
    .gt("expires_at", new Date().toISOString()).order("created_at", { ascending: false }).limit(1).maybeSingle();
  if (data) return data.token;
  const { data: made, error } = await sb.from("invites").insert({ room_id: roomId, created_by: Rooms.user.id }).select("token").single();
  if (error) throw error;
  return made.token;
}
async function togglePanel(r, card, btn) {
  const open = card.querySelector(".panel");
  if (open) { open.remove(); btn.setAttribute("aria-expanded", "false"); return; }
  btn.disabled = true;
  try {
    const link = `${location.origin}/room.html?join=${encodeURIComponent(await inviteToken(r.id))}`;
    const msg = myName ? t("invite_msg", { name: myName, question: r.question, link }) : t("invite_msg_anon", { question: r.question, link });
    const links = Rooms.shareLinks(msg, t("invite_subject", { question: r.question }));
    const panel = el("div", "panel");
    const box = el("div", "linkbox");
    const inp = el("input", "line"); inp.readOnly = true; inp.value = link; inp.setAttribute("aria-label", t("share_title"));
    const copy = el("button", "btn soft", t("copy")); copy.type = "button";
    copy.onclick = async () => { await Rooms.copyText(link); copy.textContent = t("copied"); setTimeout(() => { copy.textContent = t("copy"); }, 1600); };
    box.append(inp, copy);
    const row = el("div", "share");
    const wa = el("a", "btn ghost", t("whatsapp")); wa.href = links.whatsapp; wa.target = "_blank"; wa.rel = "noopener";
    const em = el("a", "btn ghost", t("email_btn")); em.href = links.email;
    row.append(wa, em);
    panel.append(el("p", "small", t("share_hint")), box, row);
    card.append(panel);
    btn.setAttribute("aria-expanded", "true");
  } catch (err) {
    console.error(err);
    card.append(el("p", "status err panel", t("err_generic")));
  } finally { btn.disabled = false; }
}

/* ---------- Needs attention (owner) ---------- */
// Rooms that are stuck, each with one action. Reminders go out from the owner's own WhatsApp or email,
// and never say who hasn't answered: the owner sees the count only.
const daysSince = ts => ts ? (Date.now() - new Date(ts).getTime()) / 864e5 : 0;
function stuck(r) {
  if (r.review_due && r.role !== "observer") return { why: t(r.role === "owner" ? "na_review" : "na_review_member"), act: "open" };
  if (r.role !== "owner") return null;
  const today = new Date().toISOString().slice(0, 10);
  if (r.decide_error) return { why: t("na_failed"), act: "open" };
  if (r.status === "open" && r.decide_by && r.decide_by < today && r.submitted < r.members) return { why: t("na_late", { date: Rooms.fmtDate(r.decide_by), n: r.members - r.submitted }), act: "remind" };
  // An earlier warning: the deadline is close and people are still missing.
  const soon = new Date(Date.now() + 2 * 864e5).toISOString().slice(0, 10);
  if (r.status === "open" && r.decide_by && r.decide_by >= today && r.decide_by <= soon && r.submitted < r.members)
    return { why: t("na_soon", { n: r.submitted, total: r.members, date: Rooms.fmtDate(r.decide_by) }), act: "remind" };
  if (r.status === "open" && r.submitted >= r.quorum && daysSince(r.last_input) > 2) return { why: t("na_ready", { n: r.submitted }), act: "open" };
  if (r.status === "decided" && daysSince(r.decided_at) > 3 && Number(r.signed) < r.members) return { why: t("na_signoff", { n: Number(r.signed), total: r.members }), act: "signoff" };
  return null;
}
function attention() {
  const items = rooms.map(r => [r, stuck(r)]).filter(([, x]) => x);
  if (!items.length) return null;
  const sec = section(t("na_title"), items.length);
  const ul = el("ul", "attention");
  items.forEach(([r, x]) => {
    const li = el("li");
    li.append(q(r), el("span", "why", x.why));
    const link = `${location.origin}/room.html?room=${encodeURIComponent(r.id)}`;
    let a;
    if (x.act === "open") { a = el("a", "btn act", t("na_open")); a.href = roomHref(r); }
    else {
      const msg = t(x.act === "signoff" ? "so_reminder_msg" : "reminder_msg", { question: r.question, link });
      a = el("a", "btn act", t("nudge")); a.href = Rooms.shareLinks(msg, "").whatsapp; a.target = "_blank"; a.rel = "noopener";
    }
    li.append(a);
    ul.append(li);
  });
  sec.append(ul);
  return sec;
}

/* ---------- Search ---------- */
// Finds rooms you're in by question, options or the call.
let query = "";
const searchIn = el("input", "line"); Object.assign(searchIn, { type: "search", maxLength: 80, autocomplete: "off" });
searchIn.oninput = () => { query = searchIn.value.trim().toLowerCase(); drawResults(); };
const matches = r => !query || [r.question, r.final_label, ...(r.options || []).map(o => o?.label)].filter(Boolean).some(x => String(x).toLowerCase().includes(query));
const results = el("div");

/* ---------- Page ---------- */
function render() {
  searchIn.placeholder = t("db_search_ph"); searchIn.setAttribute("aria-label", t("db_search_ph"));
  // A greeting by first name and time of day, then one line on what needs them now.
  const first = String(myName || "").trim().split(/\s+/)[0];
  const hour = new Date().getHours();
  const part = hour < 5 ? "evening" : hour < 12 ? "morning" : hour < 17 ? "afternoon" : "evening";
  const title = el("div", "db-hello");
  const needs = rooms.filter(r => r.status === "open" && !r.i_submitted && r.role !== "observer").length;
  const ready = rooms.filter(r => r.status === "deciding" && r.has_verdict).length;
  const stuckN = rooms.filter(r => stuck(r)).length;
  const line = !rooms.length ? t("hi_new")
    : needs ? t(needs === 1 ? "hi_need_1" : "hi_need_n", { n: needs })
    : ready ? t(ready === 1 ? "hi_ready_1" : "hi_ready_n", { n: ready })
    : stuckN ? t(stuckN === 1 ? "hi_stuck_1" : "hi_stuck_n", { n: stuckN })
    : t("hi_quiet");
  title.append(el("span", "eyebrow", t("db_title")), el("h1", "db-title", first ? t("hi_" + part, { name: first }) : t("hi_" + part + "_noname")), el("p", "db-line", line), Object.assign(el("a", "linkbtn", "✎ " + t("nt_draft")), { href: demo ? "/notes.html?demo=1" : "/notes.html?new=1" }));
  // Numbers row: what needs you, at a glance.
  const finished = r => ["decided", "reviewed"].includes(r.status);
  const needMe = rooms.filter(r => r.status === "open" && !r.i_submitted && r.role !== "observer");
  const waiting = rooms.filter(r => r.status === "open" && r.i_submitted);
  const verdicts = rooms.filter(r => r.status === "deciding" && r.has_verdict);
  const stats = el("div", "stats band");
  const stat = (title, n, cap, foot, go) => {
    const c = el("div", "stat" + (go && n ? " go" : ""));
    const fig = el("div", "fig"); fig.append(el("span", "num", String(n)), el("span", "cap", cap));
    c.append(el("h3", null, title), fig, el("p", "foot", foot));
    return c;
  };
  stats.append(
    stat(t("ds_need_t"), needMe.length, t("ds_need_c"), t("ds_need_f"), true),
    stat(t("ds_wait_t"), waiting.length, t("ds_wait_c"), t("ds_wait_f")),
    stat(t("ds_verdict_t"), verdicts.length, t("ds_verdict_c"), t("ds_verdict_f"), true),
    stat(t("ds_done_t"), rooms.filter(finished).length, t("ds_done_c"), t("ds_done_f")));
  const search = el("div", "search"); search.append(searchIn);
  view.replaceChildren(...[title, stats, attention(), rooms.length > 3 ? search : null, results].filter(Boolean));
  drawResults();
}
function drawResults() {
  document.title = t("my_rooms") + " · " + t("product");
  const finished = r => ["decided", "reviewed"].includes(r.status);
  const shown = rooms.filter(matches);
  const yours = shown.filter(r => r.role === "owner" && r.status === "open");
  const ongoing = shown.filter(r => !finished(r) && !yours.includes(r));
  const old = shown.filter(finished);

  // 1. Your open rooms, each with Invite + people; then + Add a room.
  const s1 = section(t("db_yours"), yours.length || null);
  const grid = el("div", "cards");
  yours.forEach(r => {
    const card = el("article", "rcard");
    const a = el("a", "open"); a.href = roomHref(r);
    const s = statusLine(r);
    a.append(el("span", "meta", Rooms.typeName(r)), q(r), el("span", "st" + (s.go ? " go" : ""), s.text));
    if (Number(r.invited) > 0) {
      // People were invited one by one: their links live in the room.
      const ppl = el("a", "btn invite", t("db_people", { n: r.invited })); ppl.href = roomHref(r);
      card.append(a, ppl);
    } else {
      const inv = el("button", "btn invite", "+ " + t("db_invite")); inv.type = "button"; inv.setAttribute("aria-expanded", "false");
      inv.onclick = () => togglePanel(r, card, inv);
      card.append(a, inv);
    }
    grid.append(card);
  });
  const add = el("a", "addcard"); add.href = demo ? "/new.html?demo=1" : "/new.html";
  add.append(el("b", null, "+"), el("span", null, t("db_add")));
  grid.append(add);
  s1.append(grid);
  if (!yours.length) s1.append(el("p", "empty", t(query ? "db_no_match" : "db_none_yet")));

  // 2. Ongoing and 3. Old: room, date, members.
  const list = (title, items, emptyText, isOld) => {
    const sec = section(title, items.length || null);
    if (!items.length) { sec.append(el("p", "empty", emptyText)); return sec; }
    const ul = el("ul", "rows");
    items.forEach(r => {
      const li = el("li", "rrow" + (isOld ? " old" : ""));
      const a = el("a"); a.href = roomHref(r);
      const who = el("span", "who"); who.append(el("b", null, t("db_members") + ": "), document.createTextNode(names(r.names)));
      const s = statusLine(r);
      a.append(q(r), el("span", "when", t("db_started", { date: Rooms.fmtDate(String(r.created_at).slice(0, 10)) })), who,
        el("span", "st" + (s.go ? " go" : ""), (r.role === "owner" ? t("role_owner") + " · " : "") + s.text));
      li.append(a);
      ul.append(li);
    });
    sec.append(ul);
    return sec;
  };
  // Rooms you help someone else with, as their assistant.
  const help = helping.filter(matches);
  let s4 = null;
  if (help.length) {
    s4 = section(t("db_helping"), help.length);
    const ul = el("ul", "rows");
    help.forEach(r => {
      const li = el("li", "rrow"), a = el("a"); a.href = "/room.html?room=" + encodeURIComponent(r.id);
      a.append(q(r), el("span", "when", t("db_helping_for", { owner: r.owner_name || "" })),
        el("span", "st", r.status === "open" ? t("og_answered", { n: r.submitted, total: r.members }) : t("st_" + (r.status === "deciding" ? "deciding" : r.status))));
      li.append(a); ul.append(li);
    });
    s4.append(ul);
  }
  results.replaceChildren(...[s1, s4,
    list(t("db_ongoing"), ongoing, t(query ? "db_no_match" : "db_empty_ongoing"), false),
    list(t("db_old"), old, t(query ? "db_no_match" : "db_empty_old"), true)].filter(Boolean));
}

// No account in this browser yet (trial accounts live in the browser that made them).
// Not signed in: sign in or sign up (Google, Microsoft or an email code), then the short profile.
function noRooms() {
  const c = el("article", "msg you");
  const box = el("div", "stack-sm");
  c.append(el("p", "text sm", t("si_title")), el("p", "small", t("si_hint")), box, Rooms.agreeNote());
  view.replaceChildren(el("h1", "db-title", t("db_title")), c);
  Rooms.ensureAccount(box, { onDone: () => { Rooms.showMyRooms(); load(); } });
}

async function load() {
  if (demo) { rooms = DEMO; myName = "Islam"; return render(); }
  const sb = Rooms.sb;
  // Join any organisation that invited this email (or matches its domain), then link to it.
  await sb.rpc("claim_org_invites").then(() => {}, () => {});
  sb.rpc("my_orgs").then(({ data: os }) => {
    if (!os?.length || $("orgLink")) return;
    const a = el("a", "navlink", os.length === 1 ? os[0].name : t("og_link")); a.id = "orgLink"; a.href = "/org.html";
    document.querySelector(".top-acts").prepend(a);
  }, () => {});
  const [{ data, error }, p, { data: helps }] = await Promise.all([sb.rpc("my_rooms"), Rooms.profile(), sb.rpc("assisted_rooms")]);
  helping = helps || [];
  if (error) { const c = el("article", "msg"); c.append(el("p", "text", t("err_generic"))); return view.replaceChildren(c); }
  myName = p?.name || "";
  // Member names come from each room's roster (names and ticks only, never answers).
  rooms = await Promise.all((data || []).map(async r => {
    const { data: roster } = await sb.rpc("room_roster", { rid: r.id });
    return { ...r, names: (roster || []).filter(m => m.user_id !== Rooms.user.id && m.name).map(m => m.name) };
  }));
  render();
}

Rooms.langToggle(() => { if (rooms) render(); else if (Rooms.sb && !Rooms.hasAccount()) noRooms(); });
(async () => {
  await Rooms.loadLang(Rooms.firstLang());
  $("demoNote").hidden = !demo;
  if (demo) return load();
  if (!(await Rooms.connect())) { const c = el("article", "msg"); c.append(el("p", "text", t("not_setup"))); return view.replaceChildren(c); }
  if (!Rooms.hasAccount()) return noRooms();
  // Signed in but the profile isn't finished: finish it first.
  const me = await Rooms.myProfile();
  if (!me?.completed_at) return noRooms();
  load();
})();
})();
</script>
</body>
</html>
