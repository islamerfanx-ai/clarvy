<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Your decision rooms: open, ongoing and finished.">
<title>My rooms · Decision Rooms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,300..600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/rooms/rooms.css">
<style>
/* Dashboard (from the paper sketch, in the editorial style of the reference): numbers row, your open rooms
   as cards with Invite, then Ongoing and Old lists. Flat white cards on the yellow ground, thin dividers. */
main{max-width:1040px}
.db-title{margin:8px 0 4px;font-size:clamp(34px,5.4vw,56px);line-height:1.05;font-weight:500;letter-spacing:-.03em;max-width:14ch}
.db-sec{display:flex;flex-direction:column;gap:12px;margin-top:40px}
.db-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.db-head h2{margin:0;font-size:22px;font-weight:500;letter-spacing:-.015em}
.db-head .n{font-size:14px;color:var(--dim)}
/* Number cards: title, divider, big figure beside a short label, one sentence at the foot */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:32px}
.stat{display:flex;flex-direction:column;background:#fff;padding:20px 20px 22px;min-height:300px;color:var(--fg);text-decoration:none}
.stat h3{margin:0 0 16px;font-size:20px;font-weight:500;letter-spacing:-.01em;color:var(--fg);padding-bottom:16px;border-bottom:1px solid var(--line)}
.stat .fig{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.stat .num{font-size:72px;line-height:1;font-weight:400;letter-spacing:-.04em;padding:22px 0 14px;border-inline-end:1px solid var(--line)}
.stat .cap{align-self:end;font-size:13px;line-height:1.25;padding:0 0 14px 12px}
[dir=rtl] .stat .cap{padding:0 12px 14px 0}
.stat .foot{margin-top:auto;padding-top:24px;font-size:15px;line-height:1.4}
.stat.go .num{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.rcard{display:flex;flex-direction:column;gap:14px;background:#fff;padding:20px}
.rcard a.open{display:flex;flex-direction:column;gap:8px;color:var(--fg);text-decoration:none;flex:1}
.rcard a.open .meta{padding-bottom:12px;border-bottom:1px solid var(--line)}
.rcard a.open:hover .q{text-decoration:underline;text-underline-offset:3px}
.rcard .q{font-size:18px;font-weight:500;line-height:1.3;letter-spacing:-.01em}
.rcard .st{font-size:14px;color:var(--dim)}
.rcard .st.go{color:var(--fg);font-weight:600}
.rcard .invite{width:100%}
.panel{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--line)}
.panel .share{grid-template-columns:1fr 1fr}
.addcard{display:flex;align-items:center;justify-content:center;gap:10px;min-height:160px;border:1.5px dashed rgba(20,20,20,.35);
  color:var(--fg);text-decoration:none;font-size:16px;font-weight:500}
.addcard:hover{background:#fff;border-style:solid}
.addcard b{font-size:26px;font-weight:300;line-height:1}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;background:var(--line)}
.rrow a{display:grid;grid-template-columns:1fr auto;gap:6px 24px;align-items:start;background:#fff;padding:18px 20px;color:var(--fg);text-decoration:none}
.rrow a:hover .q{text-decoration:underline;text-underline-offset:3px}
.rrow.old a{background:#FFF8D6}
.rrow .q{font-size:17px;font-weight:500;line-height:1.35;letter-spacing:-.01em}
.rrow .when{font-size:14px;color:var(--dim);white-space:nowrap}
.rrow .who{grid-column:1/-1;font-size:14px;color:var(--dim)}
.rrow .who b{font-weight:500;color:var(--fg)}
.rrow .st{grid-column:1/-1;font-size:14px;color:var(--dim)}
.rrow .st.go{color:var(--fg);font-weight:600}
.empty{margin:0;font-size:15px;color:var(--dim);padding:6px 0}
@media (max-width:560px){.rrow a{grid-template-columns:1fr}.rrow .when{white-space:normal}.addcard{min-height:72px}.stat{min-height:0}.stat .num{font-size:56px}}
</style>
</head>
<body>
<main>
  <header class="top">
    <a class="wm" href="/">Decision Rooms</a>
    <div class="top-acts"><button class="lang" type="button" id="langBtn"></button></div>
  </header>
  <div id="view" aria-live="polite"><article class="msg"><p class="text thinking">One moment</p></article></div>
  <p class="small" id="demoNote" data-t="demo_note" hidden style="text-align:center;padding-top:16px"></p>
</main>

<script src="/rooms/rooms.js"></script>
<script>
(() => {
const { $, el, t } = Rooms;
const demo = new URLSearchParams(location.search).get("demo");
const view = $("view");
let rooms = null, myName = "";

// Demo data mirrors the sketch: two open rooms of yours, one ongoing, one old.
const DEMO = [
  { id: "r1", type: "business", question: "Room 1: open a second location in Jeddah?", status: "open", role: "owner", created_at: "2026-10-12", quorum: 2, members: 1, submitted: 0, i_submitted: false, has_verdict: false, names: [] },
  { id: "r2", type: "trip", question: "Room 2: where should the six of us go in March?", status: "open", role: "owner", created_at: "2026-10-14", quorum: 2, members: 3, submitted: 1, i_submitted: true, has_verdict: false, names: ["Lina", "Omar"] },
  { id: "r3", type: "politics", question: "Political briefing: do we speak on the new data law?", status: "deciding", role: "member", created_at: "2026-10-08", quorum: 2, members: 4, submitted: 4, i_submitted: true, has_verdict: true, names: ["Ramy", "Ahmed", "Chris"] },
  { id: "r4", type: "finance", question: "Egyptian economy: hold, hedge or exit our EGP position?", status: "decided", role: "member", created_at: "2026-09-21", quorum: 2, members: 3, submitted: 3, i_submitted: true, has_verdict: true, names: ["Chris", "Neon"] }
];

/* ---------- Helpers ---------- */
// "Ramy, Ahmed and Chris" / "Ramy, Ahmed and 3 more"
function names(list) {
  if (!list.length) return t("db_only_you");
  if (list.length === 1) return list[0];
  if (list.length <= 3) return t("names_and", { a: list.slice(0, -1).join(", "), b: list[list.length - 1] });
  return t("names_more", { list: list.slice(0, 2).join(", "), n: list.length - 2 });
}
// One plain line on where a room stands, with what you need to do first.
function statusLine(r) {
  if (r.status === "open" && !r.i_submitted && r.role !== "observer") return { text: t("st_input"), go: true };
  if (r.status === "open") return { text: t("st_waiting", { n: r.submitted, total: r.members }), go: r.role === "owner" && r.submitted >= r.quorum };
  if (r.status === "deciding") return r.has_verdict ? { text: t("st_verdict"), go: r.role === "owner" } : { text: t("st_deciding") };
  return { text: t(r.status === "reviewed" ? "st_reviewed" : "st_decided") };
}
const roomHref = r => demo ? "/room.html?demo=" + (r.role === "owner" ? "owner" : "1") : "/room.html?room=" + r.id;
function q(r, cls = "q") { const s = el("span", cls, r.question); s.lang = r.language || "en"; s.dir = r.language === "ar" ? "rtl" : "ltr"; return s; }
function section(title, count) {
  const sec = el("section", "db-sec");
  const h = el("div", "db-head"); h.append(el("h2", null, title), el("span", "n", count != null ? String(count) : ""));
  sec.append(h);
  return sec;
}

/* ---------- Invite (owner) ---------- */
async function inviteToken(roomId) {
  if (demo) return "demo-" + roomId;
  const sb = Rooms.sb;
  const { data } = await sb.from("invites").select("token").eq("room_id", roomId).eq("revoked", false)
    .gt("expires_at", new Date().toISOString()).order("created_at", { ascending: false }).limit(1).maybeSingle();
  if (data) return data.token;
  const { data: made, error } = await sb.from("invites").insert({ room_id: roomId, created_by: Rooms.user.id }).select("token").single();
  if (error) throw error;
  return made.token;
}
async function togglePanel(r, card, btn) {
  const open = card.querySelector(".panel");
  if (open) { open.remove(); btn.setAttribute("aria-expanded", "false"); return; }
  btn.disabled = true;
  try {
    const link = `${location.origin}/room.html?join=${encodeURIComponent(await inviteToken(r.id))}`;
    const msg = myName ? t("invite_msg", { name: myName, question: r.question, link }) : t("invite_msg_anon", { question: r.question, link });
    const links = Rooms.shareLinks(msg, t("invite_subject", { question: r.question }));
    const panel = el("div", "panel");
    const box = el("div", "linkbox");
    const inp = el("input", "line"); inp.readOnly = true; inp.value = link; inp.setAttribute("aria-label", t("share_title"));
    const copy = el("button", "btn soft", t("copy")); copy.type = "button";
    copy.onclick = async () => { await Rooms.copyText(link); copy.textContent = t("copied"); setTimeout(() => { copy.textContent = t("copy"); }, 1600); };
    box.append(inp, copy);
    const row = el("div", "share");
    const wa = el("a", "btn ghost", t("whatsapp")); wa.href = links.whatsapp; wa.target = "_blank"; wa.rel = "noopener";
    const em = el("a", "btn ghost", t("email_btn")); em.href = links.email;
    row.append(wa, em);
    panel.append(el("p", "small", t("share_hint")), box, row);
    card.append(panel);
    btn.setAttribute("aria-expanded", "true");
  } catch (err) {
    console.error(err);
    card.append(el("p", "status err panel", t("err_generic")));
  } finally { btn.disabled = false; }
}

/* ---------- Page ---------- */
function render() {
  document.title = t("my_rooms") + " · " + t("product");
  const finished = r => ["decided", "reviewed"].includes(r.status);
  const yours = rooms.filter(r => r.role === "owner" && r.status === "open");
  const ongoing = rooms.filter(r => !finished(r) && !yours.includes(r));
  const old = rooms.filter(finished);

  const title = el("h1", "db-title", t("db_title"));

  // Numbers row: what needs you, at a glance.
  const needMe = rooms.filter(r => r.status === "open" && !r.i_submitted && r.role !== "observer");
  const waiting = rooms.filter(r => r.status === "open" && r.i_submitted);
  const verdicts = rooms.filter(r => r.status === "deciding" && r.has_verdict);
  const stats = el("div", "stats");
  const stat = (title, n, cap, foot, go) => {
    const c = el("div", "stat" + (go && n ? " go" : ""));
    const fig = el("div", "fig"); fig.append(el("span", "num", String(n)), el("span", "cap", cap));
    c.append(el("h3", null, title), fig, el("p", "foot", foot));
    return c;
  };
  stats.append(
    stat(t("ds_need_t"), needMe.length, t("ds_need_c"), t("ds_need_f"), true),
    stat(t("ds_wait_t"), waiting.length, t("ds_wait_c"), t("ds_wait_f")),
    stat(t("ds_verdict_t"), verdicts.length, t("ds_verdict_c"), t("ds_verdict_f"), true),
    stat(t("ds_done_t"), old.length, t("ds_done_c"), t("ds_done_f")));

  // 1. Your open rooms, each with Invite + people; then + Add a room.
  const s1 = section(t("db_yours"), yours.length || null);
  const grid = el("div", "cards");
  yours.forEach(r => {
    const card = el("article", "rcard");
    const a = el("a", "open"); a.href = roomHref(r);
    const s = statusLine(r);
    a.append(el("span", "meta", Rooms.typeName(r)), q(r), el("span", "st" + (s.go ? " go" : ""), s.text));
    const inv = el("button", "btn invite", "+ " + t("db_invite")); inv.type = "button"; inv.setAttribute("aria-expanded", "false");
    inv.onclick = () => togglePanel(r, card, inv);
    card.append(a, inv);
    grid.append(card);
  });
  const add = el("a", "addcard"); add.href = demo ? "/new.html?demo=1" : "/new.html";
  add.append(el("b", null, "+"), el("span", null, t("db_add")));
  grid.append(add);
  s1.append(grid);
  if (!yours.length) s1.append(el("p", "empty", t("db_none_yet")));

  // 2. Ongoing and 3. Old: room, date, members.
  const list = (title, items, emptyText, isOld) => {
    const sec = section(title, items.length || null);
    if (!items.length) { sec.append(el("p", "empty", emptyText)); return sec; }
    const ul = el("ul", "rows");
    items.forEach(r => {
      const li = el("li", "rrow" + (isOld ? " old" : ""));
      const a = el("a"); a.href = roomHref(r);
      const who = el("span", "who"); who.append(el("b", null, t("db_members") + ": "), document.createTextNode(names(r.names)));
      const s = statusLine(r);
      a.append(q(r), el("span", "when", t("db_started", { date: Rooms.fmtDate(String(r.created_at).slice(0, 10)) })), who,
        el("span", "st" + (s.go ? " go" : ""), (r.role === "owner" ? t("role_owner") + " · " : "") + s.text));
      li.append(a);
      ul.append(li);
    });
    sec.append(ul);
    return sec;
  };
  view.replaceChildren(title, stats, s1,
    list(t("db_ongoing"), ongoing, t("db_empty_ongoing"), false),
    list(t("db_old"), old, t("db_empty_old"), true));
}

// No account in this browser yet (trial accounts live in the browser that made them).
function noRooms() {
  const c = el("article", "msg you");
  const go = el("a", "btn", t("mr_open_new")); go.href = demo ? "/new.html?demo=1" : "/new.html";
  c.append(el("p", "text sm", t("db_trial_note")), el("p", "small", t("db_none_yet")), go);
  view.replaceChildren(el("h1", "db-title", t("db_title")), c);
}

async function load() {
  if (demo) { rooms = DEMO; myName = "Islam"; return render(); }
  const sb = Rooms.sb;
  const [{ data, error }, p] = await Promise.all([sb.rpc("my_rooms"), Rooms.profile()]);
  if (error) { const c = el("article", "msg"); c.append(el("p", "text", t("err_generic"))); return view.replaceChildren(c); }
  myName = p?.name || "";
  // Member names come from each room's roster (names and ticks only, never answers).
  rooms = await Promise.all((data || []).map(async r => {
    const { data: roster } = await sb.rpc("room_roster", { rid: r.id });
    return { ...r, names: (roster || []).filter(m => m.user_id !== Rooms.user.id && m.name).map(m => m.name) };
  }));
  render();
}

Rooms.langToggle(() => { if (rooms) render(); else if (Rooms.sb && !Rooms.user) noRooms(); });
(async () => {
  await Rooms.loadLang(Rooms.firstLang());
  $("demoNote").hidden = !demo;
  if (demo) return load();
  if (!(await Rooms.connect())) { const c = el("article", "msg"); c.append(el("p", "text", t("not_setup"))); return view.replaceChildren(c); }
  if (!Rooms.user) return noRooms();
  load();
})();
})();
</script>
</body>
</html>
