<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Open a decision room and invite the people who should have a say.">
<title>New room · Decision Rooms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,300..600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/rooms/rooms.css">
</head>
<body>
<main>
  <header class="top">
    <a class="wm" href="/">Decision Rooms</a>
    <div class="top-acts">
      <a class="navlink" id="myRoomsLink" href="/dashboard.html" data-t="my_rooms" hidden>Your rooms</a>
      <button class="lang" type="button" id="langBtn"></button>
    </div>
  </header>

  <article class="msg you" id="wiz" aria-live="polite">
    <p class="text thinking" data-t="loading">One moment</p>
  </article>
  <p class="small" id="demoNote" data-t="demo_note" hidden style="padding-top:8px"></p>
</main>

<script src="/rooms/rooms.js"></script>
<script>
(() => {
const { $, el, t, chip } = Rooms;
const demo = new URLSearchParams(location.search).get("demo");
const TYPES = ["business", "finance", "politics", "custom"];
const ORGS = ["corporation", "government", "international", "club", "custom"];
const PEOPLE = ["", 1, 2, 3, 4, 5, 10, 20, 50];
const MAX_FILES = 8, MAX_FILE_BYTES = 20 * 1024 * 1024, MAX_TEXT = 50000;
const DRAFT_KEY = "dr-new-room-3", ORG_KEY = "dr-last-org";

// The draft survives a reload, so nothing typed is lost.
let d = { at: 0, type: "business", typeLabel: "", question: "", options: ["", ""], crits: null, model: null, rapid: null, rec: null, recFor: "", context: "", links: [], name: "", email: "", named: false, orgType: null, orgLabel: "", roles: [], people: [], extra: [], sugFor: "", overrideRule: "owner", overrideRoleId: null, strict: false, decideBy: "",
          qRes: null, qKeys: [], qOrig: "", optsDraft: null, critsDraft: null, brief: null, briefFor: "", briefErr: "", briefPicked: [] };
let files = [];   // files can't be saved in the draft; they live only in this page
let ids = [];     // the steps, by name
let known = false; // a returning owner: their name and email are filled in, they just confirm
const save = () => { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); } catch {} };
const template = tp => t("tmpl_" + tp).map(label => ({ label, on: true }));
const category = () => d.type === "custom" ? `custom: ${d.typeLabel.trim()}` : d.type;

/* ---------- Building blocks ---------- */
function head(title, hint) {
  const prog = el("div", "progress"); prog.setAttribute("aria-hidden", "true");
  ids.forEach((_, i) => prog.append(el("i", i <= d.at ? "on" : "")));
  const m = el("div", "meta"); m.append(el("span", null, t("step", { n: d.at + 1, total: ids.length })));
  const nodes = [prog, m, el("h1", "step-title", title)];
  if (hint) nodes.push(el("p", "small", hint));
  return nodes;
}
function actions({ next = t("next") } = {}) {
  const row = el("div", "actions");
  if (d.at > 0) { const b = el("button", "btn ghost", t("back")); b.type = "button"; b.onclick = () => go(d.at - 1); row.append(b); }
  const n = el("button", "btn", next); n.type = "submit"; row.append(n);
  return row;
}
function form(nodes, onNext) {
  const f = el("form", "stack-sm"); f.noValidate = true; f.style.gap = "16px";
  f.append(...nodes);
  const st = el("p", "status err"); st.id = "stepStatus"; st.setAttribute("role", "status");
  f.append(st);
  f.addEventListener("submit", e => { e.preventDefault(); onNext(); });
  return f;
}
const fail = msg => { $("stepStatus").textContent = msg; };
function go(i) { d.at = Math.max(0, Math.min(i, ids.length - 1)); d.atId = ids[d.at]; save(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
const next = () => go(d.at + 1);
function field(id, label, input, hint) {
  const f = el("div", "field"); const l = el("label", "lbl", label); l.htmlFor = id; input.id = id;
  f.append(l, input); if (hint) f.append(el("p", "small", hint)); return f;
}

/* ---------- First: you and your organisation (shown for every new room) ---------- */
function stepYou() {
  const nameIn = el("input", "line"); Object.assign(nameIn, { autocomplete: "name", maxLength: 80, value: d.name });
  nameIn.oninput = () => { d.name = nameIn.value; save(); };
  const emailIn = el("input", "line"); Object.assign(emailIn, { type: "email", autocomplete: "email", inputMode: "email", maxLength: 120, value: d.email, placeholder: t("email_ph") });
  emailIn.oninput = () => { d.email = emailIn.value; save(); };
  const orgs = el("div", "chips"); orgs.setAttribute("role", "group");
  const orgIn = el("input", "line"); Object.assign(orgIn, { maxLength: 60, value: d.orgLabel || "", placeholder: t("org_custom_ph") });
  orgIn.oninput = () => { d.orgLabel = orgIn.value; save(); };
  const orgF = field("orgLabel", t("org_custom_lbl"), orgIn);
  const drawOrgs = () => {
    orgs.replaceChildren(...ORGS.map(o => chip(t("org_" + o), o === d.orgType, () => { d.orgType = o; save(); drawOrgs(); if (o === "custom") orgIn.focus(); })));
    orgF.hidden = d.orgType !== "custom";
  };
  drawOrgs();
  const orgField = el("div", "field org-pick"); orgField.append(el("span", "lbl", t("org_lbl")), el("p", "small", t("org_why")), orgs, orgF);
  setTimeout(() => { if (!d.name) nameIn.focus(); else if (!d.email) emailIn.focus(); }, 50);
  return form([...head(t(known ? "nr_you_title_back" : "nr_you_title"), t(known ? "nr_you_hint_back" : "nr_you_hint")),
    field("ownerName", t("your_name"), nameIn), field("ownerEmail", t("email_lbl"), emailIn, t("email_why")), orgField, actions(), Rooms.agreeNote()], async () => {
    if (!d.name.trim()) { nameIn.focus(); return fail(t("need_name")); }
    if (!Rooms.validEmail(d.email)) { emailIn.focus(); return fail(t("need_email")); }
    if (!d.orgType) return fail(t("need_org"));
    if (d.orgType === "custom" && !d.orgLabel.trim()) { orgIn.focus(); return fail(t("need_org_label")); }
    try { localStorage.setItem(ORG_KEY, JSON.stringify({ orgType: d.orgType, orgLabel: d.orgLabel })); } catch {}
    if (!demo) {
      // One sign-up per press: the button waits while the bot check and sign-in run.
      const nb = document.querySelector("#wiz .actions .btn:not(.ghost)");
      if (nb?.disabled) return;
      if (nb) { nb.disabled = true; nb.textContent = t("loading"); }
      try { await Rooms.trialSignIn(d.name.trim(), d.email.trim()); }
      catch (err) {
        console.error(err);
        if (nb) { nb.disabled = false; nb.textContent = t("next"); }
        return fail(t(["busy", "captcha"].includes(err.message) ? err.message : /captcha/i.test(err.message) ? "captcha" : "err_generic"));
      }
    }
    next();
  });
}

/* ---------- The question and its category ---------- */
// Pressing Next checks the question once: grammar fixed (with Undo on the next page), three rephrasings,
// and a first draft of the options and what to weigh. The world brief starts at the same moment.
async function checkQuestion() {
  const q = d.question.trim();
  if (d.qRes && (d.qKeys || []).includes(q)) return d.qRes;
  const r = demo ? demoCheck(q) : await Rooms.post("/api/rooms/question", { question: q, type: d.type, type_label: d.typeLabel, org_type: d.orgType, org_label: d.orgLabel, draft: true, lang: Rooms.lang });
  d.qRes = r; d.qKeys = [q, String(r.corrected || "").trim()]; save();
  return r;
}
function demoCheck(q) {
  const ar = Rooms.lang === "ar";
  return {
    corrected: q.replace(/\s+/g, " ").replace(/^./, c => c.toUpperCase()).replace(/[?؟.]?$/, ar ? "؟" : "?"), changed: true, issues: [t("q_demo_issue")],
    options: [{ text: q, why: t("q_demo_why") }],
    alternatives: ar ? ["نبدأ الآن", "تجربة لستة أشهر أولًا", "شراكة مع جهة محلية", "ننتظر حتى العام المقبل"] : ["Go ahead now", "Run a 6-month pilot first", "Partner with a local firm", "Wait until next year"],
    criteria: template(d.type).map(c => c.label)
  };
}
function applyCheck(r) {
  if (!r) return;
  if (r.changed && r.corrected && r.corrected.trim() !== d.question.trim()) { d.qOrig = d.question; d.question = r.corrected.trim(); }
  // Fill the next page, unless the owner already wrote their own options or list.
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  if ((r.alternatives || []).length >= 2 && (d.options.every(o => !o.trim()) || same(d.options, d.optsDraft))) { d.options = r.alternatives.slice(0, 6); d.optsDraft = [...d.options]; }
  if ((r.criteria || []).length >= 2 && (!d.crits || same(d.crits, d.critsDraft) || same(d.crits, template(d.type)))) {
    d.crits = r.criteria.slice(0, 8).map(label => ({ label, on: true })); d.critsDraft = structuredClone(d.crits);
  }
  save();
}
/* ---------- Say your question (voice) ---------- */
// Tap, speak, tap again: the server writes out what it heard, and the owner confirms it, edits it or
// records again. "Listen" reads it back with the device's own voice. Up to 60 seconds; nothing is stored.
const canRecord = () => !!(navigator.mediaDevices?.getUserMedia && window.MediaRecorder);
function voiceBox(ta) {
  const box = el("div", "voice");
  const mic = el("button", "btn soft voice-btn"); mic.type = "button";
  const micIcon = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
  const status = el("p", "small"); status.setAttribute("role", "status");
  const heard = el("div", "block voice-heard"); heard.hidden = true;
  let rec = null, chunks = [], timer = null, started = 0, stream = null;
  const idle = () => { mic.innerHTML = micIcon; mic.append(el("span", null, t("voice_btn"))); mic.disabled = false; mic.classList.remove("rec"); };
  const stopAll = () => { clearInterval(timer); stream?.getTracks().forEach(tr => tr.stop()); stream = null; };
  const listen = text => {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang = Rooms.lang === "ar" ? "ar-SA" : "en-GB";
    speechSynthesis.speak(u);
  };
  const show = text => {
    if (!text) { status.textContent = t("voice_empty"); return; }
    const q = el("p", "body", text); q.dir = Rooms.lang === "ar" ? "rtl" : "ltr";
    const yes = el("button", "btn", t("voice_yes")); yes.type = "button";
    yes.onclick = () => { d.question = text; d.qOrig = ""; ta.value = text; save(); heard.hidden = true; status.textContent = t("voice_used"); };
    const edit = el("button", "btn ghost", t("voice_edit")); edit.type = "button";
    edit.onclick = () => { d.question = text; d.qOrig = ""; ta.value = text; save(); heard.hidden = true; status.textContent = ""; ta.focus(); };
    const again = el("button", "linkbtn", t("voice_again")); again.type = "button"; again.onclick = () => { heard.hidden = true; start(); };
    const row = el("div", "share"); row.append(yes, edit);
    const extra = el("div", "voice-extra"); extra.append(again);
    if (window.speechSynthesis) { const l = el("button", "linkbtn", t("voice_listen")); l.type = "button"; l.onclick = () => listen(text); extra.prepend(l); }
    heard.replaceChildren(el("span", "lbl", t("voice_heard")), q, el("p", "small", t("voice_right")), row, extra);
    heard.hidden = false; status.textContent = "";
  };
  const send = async blob => {
    mic.disabled = true; status.textContent = t("voice_writing");
    try {
      if (demo) { await new Promise(r => setTimeout(r, 900)); return show(t("question_ph")); }
      const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1] || ""); fr.onerror = rej; fr.readAsDataURL(blob); });
      const r = await Rooms.post("/api/rooms/voice", { audio: b64, mime: blob.type || "audio/webm", lang: Rooms.lang });
      show(r.text);
    } catch (e) { status.textContent = t(e.message === "quota" ? "err_quota" : "voice_fail"); }
    finally { idle(); }
  };
  const start = async () => {
    status.textContent = "";
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { status.textContent = t("voice_denied"); return; }
    const type = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg"].find(x => MediaRecorder.isTypeSupported?.(x)) || "";
    chunks = [];
    rec = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
    rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => { stopAll(); send(new Blob(chunks, { type: (rec.mimeType || type || "audio/webm").split(";")[0] })); };
    rec.start();
    started = Date.now(); mic.classList.add("rec");
    const tick = () => {
      const sec = Math.floor((Date.now() - started) / 1000);
      mic.innerHTML = ""; mic.append(el("span", "voice-dot"), el("span", null, t("voice_stop") + " · 0:" + String(sec).padStart(2, "0")));
      if (sec >= 60 && rec.state === "recording") rec.stop();
    };
    tick(); timer = setInterval(tick, 500);
  };
  mic.onclick = () => { if (rec && rec.state === "recording") rec.stop(); else start(); };
  idle();
  box.append(mic, status, heard);
  return box;
}

function stepQuestion() {
  const ta = el("textarea"); Object.assign(ta, { id: "question", rows: 3, maxLength: 300, placeholder: t("question_ph"), value: d.question });
  ta.setAttribute("aria-label", t("nr_q_title"));
  ta.oninput = () => { d.question = ta.value; d.qOrig = ""; save(); };
  const types = el("div", "chips"); types.setAttribute("role", "group");
  const customIn = el("input", "line"); Object.assign(customIn, { maxLength: 40, value: d.typeLabel, placeholder: t("custom_ph") });
  customIn.oninput = () => { d.typeLabel = customIn.value; save(); };
  const customF = field("typeLabel", t("custom_lbl"), customIn);
  const drawTypes = () => {
    types.replaceChildren(...TYPES.map(tp => chip(t("type_" + tp), tp === d.type, () => {
      if (tp !== d.type && d.crits && d.crits.every((c, i) => c.label === template(d.type)[i]?.label)) d.crits = null; // an untouched template follows the category
      d.type = tp; save(); drawTypes();
      if (tp === "custom") customIn.focus();
    })));
    customF.hidden = d.type !== "custom";
  };
  drawTypes();
  const typeField = el("div", "field"); typeField.append(el("span", "lbl", t("nr_type_lbl")), types);
  // Starter questions for this kind of organisation, one tap to use.
  const starters = el("details", "more starters");
  starters.open = !d.question.trim();
  const stList = el("div", "choices");
  (t("starters_" + (d.orgType || "custom")) || []).forEach(text => stList.append(Rooms.choice(text, null, false, () => {
    d.question = text; d.qOrig = ""; ta.value = text; save(); starters.open = false; ta.focus();
  })));
  starters.append(el("summary", null, t("starters_lbl")), stList);
  // Check my question: the same check Next runs, shown here first.
  const check = el("button", "linkbtn", t("q_check")); check.type = "button";
  const checkF = el("div", "field"); checkF.append(check, el("p", "small", t("q_check_hint")));
  const checked = el("div", "stack-sm");
  check.onclick = async () => {
    if (!d.question.trim()) { ta.focus(); return fail(t("need_question")); }
    check.disabled = true; check.textContent = t("q_checking"); fail("");
    try {
      const r = await checkQuestion();
      const pickers = el("div", "choices");
      const use = text => { d.question = text; d.qOrig = ""; ta.value = text; save(); checked.replaceChildren(el("p", "small", t("q_used"))); };
      if (r.changed) pickers.append(Rooms.choice(r.corrected, t("q_corrected"), false, () => use(r.corrected)));
      (r.options || []).forEach(o => pickers.append(Rooms.choice(o.text, o.why, false, () => use(o.text))));
      const nodes = [];
      if (r.issues?.length) { const ul = el("ul", "dots"); r.issues.forEach(x => ul.append(el("li", null, x))); nodes.push(el("p", "lbl", t("q_issues")), ul); }
      nodes.push(el("p", "lbl", t("q_pick")), pickers);
      checked.replaceChildren(...nodes);
    } catch (e) { fail(t(e.message === "quota" ? "err_quota" : "q_check_fail")); }
    finally { check.disabled = false; check.textContent = t("q_check"); }
  };
  if (!d.question.trim()) setTimeout(() => ta.focus(), 50);
  const f = form([...head(t("nr_q_title"), t("nr_q_hint")), ta, ...(canRecord() ? [voiceBox(ta)] : []), starters, checkF, checked, typeField, customF, actions()], async () => {
    if (!d.question.trim()) return fail(t("need_question"));
    if (d.type === "custom" && !d.typeLabel.trim()) { customIn.focus(); return fail(t("need_custom")); }
    const nb = f.querySelector(".actions .btn:not(.ghost)"); nb.disabled = true; nb.textContent = t("q_preparing");
    try { applyCheck(await checkQuestion()); } catch (e) { console.warn("question check:", e.message); }   // the owner can always go on without it
    startBrief();
    next();
  });
  return f;
}

/* ---------- World brief, started in the background when the question is set ---------- */
let briefRun = null, briefDraw = null;
function startBrief() {
  const key = d.question.trim();
  if (!key || (d.briefFor === key && (d.brief || briefRun))) return;
  d.briefFor = key; d.brief = null; d.briefErr = ""; d.briefPicked = []; save();
  const run = briefRun = (demo
    ? new Promise(res => setTimeout(() => res({ summary: t("brief_demo_summary"), as_of: new Date().toISOString().slice(0, 10), items: [{ text: t("brief_demo_item"), date: new Date().toISOString().slice(0, 7), source: "Example source", url: null }] }), 2500))
    : Rooms.post("/api/rooms/brief", { question: key, options: d.options.filter(o => o.trim()), context: d.context, type: d.type, type_label: d.typeLabel, lang: Rooms.lang }))
    .then(r => { if (d.briefFor === key) { d.brief = r; save(); } })
    .catch(e => { if (d.briefFor === key) { d.briefErr = e.message === "quota" ? "err_quota" : "brief_fail"; save(); } })
    .finally(() => { if (briefRun === run) briefRun = null; briefDraw?.(); });
}

/* ---------- The options and what to weigh, on one page ---------- */
function stepOptions() {
  if (!d.crits) { d.crits = template(d.type); save(); }
  // The question as it now stands: corrected by the AI (with Undo), or other ways to ask it.
  const qBox = el("div", "block qline");
  const drawQ = () => {
    const kids = [el("span", "lbl", t(d.qOrig ? "q_auto_lbl" : "q_your_lbl")), el("p", "body", d.question)];
    if (d.qOrig) {
      const undo = el("button", "linkbtn", t("q_undo")); undo.type = "button";
      undo.onclick = () => { d.question = d.qOrig; d.qOrig = ""; save(); drawQ(); };
      kids.push(undo);
    }
    const alts = (d.qRes?.options || []).filter(o => o.text.trim() !== d.question.trim());
    if (alts.length) {
      const more = el("details", "more"); more.append(el("summary", null, t("q_other_ways")));
      const ch = el("div", "choices");
      alts.forEach(o => ch.append(Rooms.choice(o.text, o.why, false, () => { if (!d.qOrig) d.qOrig = d.question; d.question = o.text; save(); drawQ(); })));
      more.append(ch); kids.push(more);
    }
    qBox.replaceChildren(...kids);
  };
  drawQ();

  const list = el("div", "items");
  const add = el("button", "linkbtn", t("add_option")); add.type = "button";
  const draw = () => {
    list.replaceChildren(...d.options.map((v, i) => {
      const row = el("div", "item");
      const inp = el("input", "line"); Object.assign(inp, { value: v, maxLength: 200, placeholder: t("option_ph", { n: i + 1 }) });
      inp.setAttribute("aria-label", t("option_ph", { n: i + 1 }));
      inp.oninput = () => { d.options[i] = inp.value; save(); };
      const x = el("button", "x", "×"); x.type = "button"; x.disabled = d.options.length <= 2; x.setAttribute("aria-label", t("remove"));
      x.onclick = () => { d.options.splice(i, 1); save(); draw(); };
      row.append(inp, x);
      return row;
    }));
    add.hidden = d.options.length >= 6;
  };
  add.onclick = () => { d.options.push(""); save(); draw(); list.lastChild.querySelector("input").focus(); };
  draw();

  // What to weigh: a list you edit in place.
  const crits = el("div", "items");
  const addC = el("button", "linkbtn", t("crit_add")); addC.type = "button";
  const drawC = () => {
    d.crits = d.crits.filter(c => c.on !== false);
    crits.replaceChildren(...d.crits.map((c, i) => {
      const row = el("div", "item");
      const inp = el("input", "line"); Object.assign(inp, { value: c.label, maxLength: 80, placeholder: t("crit_add_ph") });
      inp.setAttribute("aria-label", t("crit_add_ph"));
      inp.oninput = () => { c.label = inp.value; save(); };
      const x = el("button", "x", "×"); x.type = "button"; x.disabled = d.crits.length <= 2; x.setAttribute("aria-label", t("remove"));
      x.onclick = () => { d.crits.splice(i, 1); save(); drawC(); };
      row.append(inp, x);
      return row;
    }));
    addC.hidden = d.crits.length >= 8;
  };
  addC.onclick = () => { d.crits.push({ label: "", on: true }); save(); drawC(); crits.lastChild.querySelector("input").focus(); };
  drawC();
  const sug = el("button", "linkbtn", t("suggest_again")); sug.type = "button";
  sug.onclick = async () => {
    sug.disabled = true; sug.textContent = t("suggesting"); fail("");
    try { d.crits = await suggest(); d.critsDraft = structuredClone(d.crits); save(); drawC(); }
    catch (e) { fail(t(e.message === "quota" ? "err_quota" : "suggest_fail")); }
    finally { sug.disabled = false; sug.textContent = t("suggest_again"); }
  };
  const optsF = el("div", "field"); optsF.append(el("span", "lbl", t("nr_opts_title")), el("p", "small", t(d.optsDraft ? "nr_opts_hint_ai" : "nr_opts_hint")), list, add);
  const critF = el("div", "field"); critF.append(el("span", "lbl", t("nr_crit_title")), el("p", "small", t("nr_crit_hint")), crits, addC, sug);
  return form([...head(t("nr_opts_page_title")), qBox, optsF, critF, actions()], () => {
    if (d.options.filter(o => o.trim()).length < 2) return fail(t("need_options"));
    const n = d.crits.filter(c => c.label.trim()).length;
    if (n < 2) return fail(t("need_criteria"));
    d.crits = d.crits.filter(c => c.label.trim()).map(c => ({ label: c.label.trim(), on: true })); save();
    next();
  });

function roleFor(title) {
  title = String(title || "").trim().slice(0, 60);
  if (!title) return null;
  let r = d.roles.find(x => x.title.toLowerCase() === title.toLowerCase());
  if (r) return r;
  if (d.roles.length >= 12) return null;
  const n = Math.max(0, ...d.roles.map(x => Number(String(x.id).slice(1)) || 0)) + 1;
  const sug = (d.extra || []).find(x => x.title.toLowerCase() === title.toLowerCase());
  r = { id: "r" + n, title, max: null, asks: sug?.asks?.length ? sug.asks : sug?.ask ? [sug.ask] : [], picked: [], own: "", rapid: null };
  if (r.asks.length) r.picked = [0];
  d.roles.push(r);
  return r;
}
const roleAsk = r => [...(r.picked || []).map(i => r.asks?.[i]).filter(Boolean), (r.own || "").trim()].filter(Boolean).join("\n").slice(0, 600);

// The server drafts up to 3 asks per role; the owner ticks the ones they want.
async function draftAsks() {
  const todo = d.roles.filter(r => !r.asks?.length && !r.tried);
  if (!todo.length) return;
  todo.forEach(r => { r.tried = true; });
  if (demo) {
    const ar = Rooms.lang === "ar";
    todo.forEach(r => {
      r.asks = ar ? [`ما الأرقام أو الحدود التي تراها من موقعك كـ${r.title} وقد تغيب عن الآخرين؟`, "ما الذي قد يجعلك ترفض هذا؟", "ما الذي يلزم لتنفيذه في الوقت المحدد؟"]
        : [`What numbers or limits do you see as ${r.title} that the others might miss?`, "What would make you send this back?", "What would it take to deliver this on time?"];
      r.picked = [0];
    });
    save(); return;
  }
  const data = await Rooms.post("/api/rooms/roles", {
    question: d.question, options: d.options.filter(o => o.trim()), type: d.type, type_label: d.typeLabel,
    org_type: d.orgType, org_label: d.orgLabel, roles: todo.map(r => r.title), lang: Rooms.lang
  });
  for (const x of data.roles || []) {
    const r = todo.find(y => y.title.toLowerCase() === String(x.title).toLowerCase());
    if (r) { r.asks = (x.asks?.length ? x.asks : [x.ask]).filter(Boolean).slice(0, 3); if (r.asks.length && !(r.picked || []).length) r.picked = [0]; }
  }
  if ((data.extra || []).length) d.extra = [...(d.extra || []), ...data.extra].filter((x, i, a) => a.findIndex(y => y.title === x.title) === i).slice(0, 8);
  save();
}

  }));
}
async function addFiles(list) {
  for (const file of [...list]) {
    if (files.length >= MAX_FILES) break;
    const f = { name: file.name, file, status: "reading", note: "file_reading", text: "" };
    files.push(f);
    if (!Rooms.fileKind(file)) Object.assign(f, { status: "error", note: "file_bad" });
    else if (file.size > MAX_FILE_BYTES) Object.assign(f, { status: "error", note: "file_big" });
    drawFiles();
    if (f.status !== "reading") continue;
    try {
      f.text = (await Rooms.readFile(file)).trim().slice(0, MAX_TEXT);
      Object.assign(f, f.text ? { status: "ready", note: "file_ready" } : { status: "error", note: "file_empty" });
    } catch { Object.assign(f, { status: "error", note: "file_bad" }); }
    drawFiles();
  }
}

/* ---------- Create ---------- */
const safeName = n => n.normalize("NFKD").replace(/[^\w.-]+/g, "_").slice(-80) || "file";
// The world-brief facts the owner ticked, added to what everyone should know.
function contextWithBrief() {
  const r = d.brief, chosen = (d.briefPicked || []).slice().sort((a, b) => a - b).map(i => r?.items?.[i]).filter(Boolean);
  if (!chosen.length) return d.context.trim();
  const lines = chosen.map(x => `• ${x.text} (${[x.date, x.source].filter(Boolean).join(", ")})`).join("\n");
  return ((d.context.trim() ? d.context.trim() + "\n\n" : "") + t("brief_heading", { date: r.as_of || new Date().toISOString().slice(0, 10) }) + "\n" + lines).slice(0, 4000);
}
async function create() {
  const options = d.options.map(o => o.trim()).filter(Boolean).map((label, i) => ({ id: "o" + (i + 1), label }));
  const picked = d.crits.filter(c => c.on !== false && c.label.trim());
  const w = Rooms.apportion(picked.map((_, i) => "c" + (i + 1)), {}, 100); // equal starting weights; members set their own
  const criteria = picked.map((c, i) => ({ id: "c" + (i + 1), label: c.label.trim(), weight: w["c" + (i + 1)] }));
  const people = (d.people || []).slice(0, 50);
  const roles = (d.roles || []).filter(r => people.some(p => p.roleId === r.id)).slice(0, 12)
    .map(r => ({ id: r.id, title: r.title.trim().slice(0, 60), max: null, ask: roleAsk(r), rapid: d.rapid ? r.rapid || null : null }));
  const btn = document.querySelector("#wiz .actions .btn:not(.ghost)"); if (btn) { btn.disabled = true; btn.textContent = t("creating"); }
  fail("");
  try {
    const links = (d.links || []).filter(Rooms.validUrl);
    (d.briefPicked || []).forEach(i => { const u = d.brief?.items?.[i]?.url; if (u && Rooms.validUrl(u) && !links.includes(u)) links.push(u); });
    if (demo) {
      try { localStorage.removeItem(DRAFT_KEY); } catch {}
      const to = `/room.html?demo=owner&model=${d.model || "standard"}${d.rapid ? "&rapid=1" : ""}${roles.length ? "&roles=1" : ""}&people=1`;
      if (!people.length) return Rooms.goToRoom(to);
      return vSend(to, people.map((p, i) => ({ token: "demo-" + (i + 1), person_name: p.name, person_contact: p.contact, role_id: p.roleId })), roles);
    }
    if (!Rooms.user) await Rooms.trialSignIn(d.name.trim(), d.email.trim());
    const sb = Rooms.sb, me = Rooms.user.id;
    let { data: ws } = await sb.from("workspaces").select("id").eq("owner_id", me).order("created_at").limit(1).maybeSingle();
    if (!ws) {
      ws = { id: crypto.randomUUID() };
      const { error } = await sb.from("workspaces").insert({ id: ws.id, name: (d.name.trim() || "My") + " workspace", owner_id: me });
      if (error) throw error;
    }
    // Ids are made here rather than read back, because the owner can only read the room once the
    // insert's trigger has made them a member.
    const id = crypto.randomUUID();
    const review = (() => { const x = new Date(); x.setDate(x.getDate() + 42); return x.toISOString().slice(0, 10); })();   // changed after the decision, next to the plan
    const { error } = await sb.from("rooms").insert({
      id, workspace_id: ws.id, owner_id: me, language: Rooms.lang, type: d.type,
      type_label: d.type === "custom" ? d.typeLabel.trim() : null, question: d.question.trim(),
      context: contextWithBrief(), options, criteria, review_date: review, named_views: d.named,
      model: d.model || "standard", rapid: !!d.rapid, decide_by: d.decideBy || null,
      org_type: d.orgType || null, org_label: d.orgType === "custom" ? d.orgLabel.trim() || null : null, roles,
      override_rule: d.rapid && d.overrideRule === "authority" && roles.some(r => r.id === d.overrideRoleId) ? "authority" : d.rapid && d.overrideRule === "approver" ? "approver" : "owner",
      override_role_id: d.rapid && d.overrideRule === "authority" && roles.some(r => r.id === d.overrideRoleId) ? d.overrideRoleId : null,
      strict_confidential: !!d.strict, report_mode: "both",
      links: links.slice(0, 10).map(url => ({ url }))
    });
    if (error) throw error;
    let filesFailed = false;
    for (const [i, f] of files.filter(f => f.status === "ready").entries()) {
      const path = `${id}/${i + 1}-${safeName(f.name)}`;
      const up = await sb.storage.from("room-files").upload(path, f.file);
      const ins = await sb.from("attachments").insert({ room_id: id, file_name: f.name, storage_path: up.error ? null : path, extracted_text: f.text, uploaded_by: me });
      if (up.error || ins.error) filesFailed = true;
    }
    // One link per person, or one link for everyone when nobody was added.
    const keep = new Set(roles.map(r => r.id));
    const invites = people.length
      ? people.map(p => ({ room_id: id, created_by: me, role_id: keep.has(p.roleId) ? p.roleId : null, person_name: p.name, person_contact: p.contact || null, max_uses: 1 }))
      : [{ room_id: id, created_by: me }];
    const { data: made, error: invErr } = await sb.from("invites").insert(invites).select("token,person_name,person_contact,role_id");
    if (invErr) throw invErr;
    // The address book remembers everyone, for the next room.
    if (people.length) {
      const now = new Date().toISOString();
      const rows = people.map(p => ({ owner_id: me, name: p.name, contact: p.contact || "", role_title: roles.find(r => r.id === p.roleId)?.title || null, used_at: now }));
      sb.from("contacts").upsert(rows, { onConflict: "owner_id,name,contact" }).then(({ error }) => { if (error) console.warn("contacts:", error.message); });
    }
    try { localStorage.removeItem(DRAFT_KEY); } catch {}
    const to = `/room.html?room=${id}&new=1${filesFailed ? "&files=failed" : ""}`;
    if (people.length) vSend(to, made || [], roles); else Rooms.goToRoom(to);
  } catch (err) {
    console.error(err);
    fail(t(Rooms.errKey(err, ["room_needs_2_to_6_options", "room_needs_2_to_8_criteria"])));
    if (btn) { btn.disabled = false; btn.textContent = t("create"); }
  }
}

/* ---------- Send the invites: one tap per person ---------- */
// Until the product sends messages itself, each person's link goes out from the owner's own WhatsApp or email.
function vSend(to, invites, roles) {
  const wrap = el("div", "stack-sm"); wrap.style.gap = "16px";
  wrap.append(el("h1", "step-title", t("send_title")), el("p", "small", t("send_hint")));
  const q = d.question.trim(), me = d.name.trim();
  invites.forEach(inv => {
    const link = `${location.origin}/room.html?join=${encodeURIComponent(inv.token)}`;
    const msg = t("invite_msg_person", { person: inv.person_name.split(" ")[0], name: me || t("someone"), question: q, link });
    const L = Rooms.personLinks(inv.person_contact || "", msg, t("invite_subject", { question: q }));
    const row = el("div", "block invite-row");
    const top = el("div", "role-top");
    const who = el("span", "choice-t", inv.person_name);
    const role = roles.find(r => r.id === inv.role_id);
    if (role) who.append(el("span", "tag title", role.title));
    const sent = el("span", "tag", t("sent")); sent.hidden = true;
    top.append(who, sent);
    const share = el("div", "share");
    const mark = () => { sent.hidden = false; };
    const wa = el("a", "btn" + (L.phone || !L.mail ? "" : " ghost"), t("whatsapp")); wa.href = L.whatsapp; wa.target = "_blank"; wa.rel = "noopener"; wa.onclick = mark;
    const em = el("a", "btn" + (L.mail ? "" : " ghost"), t("email_btn")); em.href = L.email; em.onclick = mark;
    const cp = el("button", "btn ghost", t("copy")); cp.type = "button";
    cp.onclick = async () => { await Rooms.copyText(link); cp.textContent = t("copied"); mark(); setTimeout(() => { cp.textContent = t("copy"); }, 1600); };
    share.append(...(L.mail && !L.phone ? [em, wa] : [wa, em]), cp);
    row.append(top, el("p", "small", inv.person_contact || t("no_contact")), share);
    wrap.append(row);
  });
  const go = el("button", "btn", t("go_to_room")); go.type = "button"; go.onclick = () => Rooms.goToRoom(to);
  wrap.append(el("p", "small", t("send_later")), go);
  $("wiz").replaceChildren(wrap);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ---------- Start ---------- */
const STEPS = { you: stepYou, question: stepQuestion, options: stepOptions, model: stepModel, people: stepPeople, context: stepContext };
function render() { briefDraw = null; $("wiz").replaceChildren(STEPS[ids[d.at]]()); }
Rooms.langToggle(() => { document.title = t("new_room") + " · " + t("product"); render(); });

async function start() {
  try { const saved = JSON.parse(localStorage.getItem(DRAFT_KEY)); if (saved && saved.question !== undefined) d = { ...d, ...saved }; } catch {}
  // The organisation from the last room, so a returning owner only confirms it.
  if (!d.orgType) { try { const o = JSON.parse(localStorage.getItem(ORG_KEY)); if (o?.orgType) { d.orgType = o.orgType; d.orgLabel = o.orgLabel || ""; } } catch {} }
  await Rooms.loadLang(Rooms.firstLang(demo === "ar" ? "ar" : null));
  document.title = t("new_room") + " · " + t("product");
  if (!demo) {
    if (!(await Rooms.connect())) { $("wiz").replaceChildren(el("p", "text", t("not_setup"))); return; }
    if (Rooms.user) {
      const p = await Rooms.profile();
      if (p?.name) d.name = d.name || p.name;
      if (p?.email) d.email = d.email || p.email;
      known = !!(p?.name && p?.email);
    }
  }
  // The first screen shows for every new room: returning owners just confirm it.
  ids = ["you", "question", "options", "model", "people", "context"];
  d.at = Math.max(0, ids.indexOf(d.atId));
  $("demoNote").hidden = !demo;
  render();
  Rooms.helper({ page: "setup", draft: () => ({ question: d.question, options: d.options, criteria: (d.crits || []).filter(c => c.on !== false).map(c => c.label), type: d.type === "custom" ? d.typeLabel : d.type }) });
}
start();
})();
</script>
