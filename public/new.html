<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Open a decision room and invite the people who should have a say.">
<title>New room · Decision Rooms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,300..600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/rooms/rooms.css">
</head>
<body>
<main>
  <header class="top">
    <a class="wm" href="/">Decision Rooms</a>
    <div class="top-acts">
      <a class="navlink" id="myRoomsLink" href="/dashboard.html" data-t="my_rooms" hidden>Your rooms</a>
      <button class="lang" type="button" id="langBtn"></button>
    </div>
  </header>

  <article class="msg you" id="wiz" aria-live="polite">
    <p class="text thinking" data-t="loading">One moment</p>
  </article>
  <p class="small" id="demoNote" data-t="demo_note" hidden style="padding-top:8px"></p>
</main>

<script src="/rooms/rooms.js"></script>
<script>
(() => {
const { $, el, t, chip } = Rooms;
const demo = new URLSearchParams(location.search).get("demo");
const TYPES = ["business", "finance", "politics", "custom"];
const ORGS = ["corporation", "government", "international", "club", "custom"];
const PEOPLE = ["", 1, 2, 3, 4, 5, 10, 20, 50];
const MAX_FILES = 8, MAX_FILE_BYTES = 20 * 1024 * 1024, MAX_TEXT = 50000;
const DRAFT_KEY = "dr-new-room-2";

// The draft survives a reload, so nothing typed is lost.
let d = { at: 0, type: "business", typeLabel: "", question: "", options: ["", ""], crits: null, model: null, rapid: null, rec: null, recFor: "", context: "", links: [], name: "", email: "", review: "", named: false, orgType: null, orgLabel: "", roles: [], extra: [], sugFor: "", overrideRule: "owner", overrideRoleId: null, strict: false };
let files = [];   // files can't be saved in the draft; they live only in this page
let ids = [];     // the steps for this person: "you" first if we don't know them yet
const save = () => { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); } catch {} };
const template = tp => t("tmpl_" + tp).map(label => ({ label, on: true }));
const category = () => d.type === "custom" ? `custom: ${d.typeLabel.trim()}` : d.type;

/* ---------- Building blocks ---------- */
function head(title, hint) {
  const prog = el("div", "progress"); prog.setAttribute("aria-hidden", "true");
  ids.forEach((_, i) => prog.append(el("i", i <= d.at ? "on" : "")));
  const m = el("div", "meta"); m.append(el("span", null, t("step", { n: d.at + 1, total: ids.length })));
  const nodes = [prog, m, el("h1", "step-title", title)];
  if (hint) nodes.push(el("p", "small", hint));
  return nodes;
}
function actions({ next = t("next") } = {}) {
  const row = el("div", "actions");
  if (d.at > 0) { const b = el("button", "btn ghost", t("back")); b.type = "button"; b.onclick = () => go(d.at - 1); row.append(b); }
  const n = el("button", "btn", next); n.type = "submit"; row.append(n);
  return row;
}
function form(nodes, onNext) {
  const f = el("form", "stack-sm"); f.noValidate = true; f.style.gap = "16px";
  f.append(...nodes);
  const st = el("p", "status err"); st.id = "stepStatus"; st.setAttribute("role", "status");
  f.append(st);
  f.addEventListener("submit", e => { e.preventDefault(); onNext(); });
  return f;
}
const fail = msg => { $("stepStatus").textContent = msg; };
function go(i) { d.at = Math.max(0, Math.min(i, ids.length - 1)); d.atId = ids[d.at]; save(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
const next = () => go(d.at + 1);
function field(id, label, input, hint) {
  const f = el("div", "field"); const l = el("label", "lbl", label); l.htmlFor = id; input.id = id;
  f.append(l, input); if (hint) f.append(el("p", "small", hint)); return f;
}

/* ---------- First (once): your name and email ---------- */
function stepYou() {
  const nameIn = el("input", "line"); Object.assign(nameIn, { autocomplete: "name", maxLength: 80, value: d.name });
  nameIn.oninput = () => { d.name = nameIn.value; save(); };
  const emailIn = el("input", "line"); Object.assign(emailIn, { type: "email", autocomplete: "email", inputMode: "email", maxLength: 120, value: d.email, placeholder: t("email_ph") });
  emailIn.oninput = () => { d.email = emailIn.value; save(); };
  setTimeout(() => (d.name ? emailIn : nameIn).focus(), 50);
  return form([...head(t("nr_you_title"), t("nr_you_hint")), field("ownerName", t("your_name"), nameIn),
    field("ownerEmail", t("email_lbl"), emailIn, t("email_why")), actions(), Rooms.agreeNote()], async () => {
    if (!d.name.trim()) { nameIn.focus(); return fail(t("need_name")); }
    if (!Rooms.validEmail(d.email)) { emailIn.focus(); return fail(t("need_email")); }
    if (!demo) {
      try { await Rooms.trialSignIn(d.name.trim(), d.email.trim()); }
      catch (err) { console.error(err); return fail(t(err.message === "busy" ? "busy" : "err_generic")); }
    }
    next();
  });
}

/* ---------- The question and its category ---------- */
function stepQuestion() {
  const ta = el("textarea"); Object.assign(ta, { id: "question", rows: 3, maxLength: 300, placeholder: t("question_ph"), value: d.question });
  ta.setAttribute("aria-label", t("nr_q_title"));
  ta.oninput = () => { d.question = ta.value; save(); };
  const types = el("div", "chips"); types.setAttribute("role", "group");
  const customIn = el("input", "line"); Object.assign(customIn, { maxLength: 40, value: d.typeLabel, placeholder: t("custom_ph") });
  customIn.oninput = () => { d.typeLabel = customIn.value; save(); };
  const customF = field("typeLabel", t("custom_lbl"), customIn);
  const drawTypes = () => {
    types.replaceChildren(...TYPES.map(tp => chip(t("type_" + tp), tp === d.type, () => {
      if (tp !== d.type && d.crits && d.crits.every((c, i) => c.label === template(d.type)[i]?.label)) d.crits = null; // an untouched template follows the category
      d.type = tp; save(); drawTypes();
      if (tp === "custom") customIn.focus();
    })));
    customF.hidden = d.type !== "custom";
  };
  drawTypes();
  const typeField = el("div", "field"); typeField.append(el("span", "lbl", t("nr_type_lbl")), types);
  // Check my question: grammar fixed, what could mislead the group, and three rephrasings to pick from.
  const check = el("button", "linkbtn", t("q_check")); check.type = "button";
  const checked = el("div", "stack-sm");
  check.onclick = async () => {
    if (!d.question.trim()) { ta.focus(); return fail(t("need_question")); }
    check.disabled = true; check.textContent = t("q_checking"); fail("");
    try {
      const r = demo ? { corrected: d.question.trim().replace(/\s+/g, " ").replace(/^./, c => c.toUpperCase()).replace(/[?؟]?$/, "?"), changed: true, issues: [t("q_demo_issue")], options: [{ text: d.question.trim(), why: t("q_demo_why") }] } : await Rooms.post("/api/rooms/question", { question: d.question, type: d.type, type_label: d.typeLabel, lang: Rooms.lang });
      const pickers = el("div", "choices");
      const use = text => { d.question = text; ta.value = text; save(); checked.replaceChildren(el("p", "small", t("q_used"))); };
      if (r.changed) pickers.append(Rooms.choice(r.corrected, t("q_corrected"), false, () => use(r.corrected)));
      (r.options || []).forEach(o => pickers.append(Rooms.choice(o.text, o.why, false, () => use(o.text))));
      const nodes = [];
      if (r.issues?.length) { const ul = el("ul", "dots"); r.issues.forEach(x => ul.append(el("li", null, x))); nodes.push(el("p", "lbl", t("q_issues")), ul); }
      nodes.push(el("p", "lbl", t("q_pick")), pickers);
      checked.replaceChildren(...nodes);
    } catch (e) { fail(t(e.message === "quota" ? "err_quota" : "q_check_fail")); }
    finally { check.disabled = false; check.textContent = t("q_check"); }
  };
  setTimeout(() => ta.focus(), 50);
  return form([...head(t("nr_q_title"), t("nr_q_hint")), ta, check, checked, typeField, customF, actions()], () => {
    if (!d.question.trim()) return fail(t("need_question"));
    if (d.type === "custom" && !d.typeLabel.trim()) { customIn.focus(); return fail(t("need_custom")); }
    next();
  });
}

/* ---------- The options ---------- */
function stepOptions() {
  const list = el("div", "items");
  const add = el("button", "linkbtn", t("add_option")); add.type = "button";
  const draw = () => {
    list.replaceChildren(...d.options.map((v, i) => {
      const row = el("div", "item");
      const inp = el("input", "line"); Object.assign(inp, { value: v, maxLength: 200, placeholder: t("option_ph", { n: i + 1 }) });
      inp.setAttribute("aria-label", t("option_ph", { n: i + 1 }));
      inp.oninput = () => { d.options[i] = inp.value; save(); };
      const x = el("button", "x", "×"); x.type = "button"; x.disabled = d.options.length <= 2; x.setAttribute("aria-label", t("remove"));
      x.onclick = () => { d.options.splice(i, 1); save(); draw(); };
      row.append(inp, x);
      return row;
    }));
    add.hidden = d.options.length >= 6;
  };
  add.onclick = () => { d.options.push(""); save(); draw(); list.lastChild.querySelector("input").focus(); };
  draw();
  setTimeout(() => list.querySelector("input")?.focus(), 50);
  return form([...head(t("nr_opts_title"), t("nr_opts_hint")), list, add, actions()], () => {
    if (d.options.filter(o => o.trim()).length < 2) return fail(t("need_options"));
    next();
  });
}

/* ---------- What to weigh ---------- */
function stepCriteria() {
  if (!d.crits) { d.crits = template(d.type); save(); }
  const list = el("div", "ticks");
  const draw = () => list.replaceChildren(...d.crits.map(c => {
    const b = el("button", "tick", c.label); b.type = "button"; b.setAttribute("aria-pressed", String(c.on));
    b.onclick = () => { c.on = !c.on; save(); draw(); };
    return b;
  }));
  draw();
  const addIn = el("input", "line"); Object.assign(addIn, { maxLength: 80, placeholder: t("crit_add_ph") });
  addIn.setAttribute("aria-label", t("crit_add_ph"));
  const addBtn = el("button", "btn soft", t("add")); addBtn.type = "button";
  const addOne = () => {
    const v = addIn.value.trim(); if (!v || d.crits.length >= 8) return;
    d.crits.push({ label: v, on: true }); addIn.value = ""; save(); draw();
  };
  addBtn.onclick = addOne;
  addIn.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); addOne(); } };
  const addRow = el("div", "add-row"); addRow.append(addIn, addBtn);
  const sug = el("button", "linkbtn", t("suggest")); sug.type = "button";
  sug.onclick = async () => {
    sug.disabled = true; sug.textContent = t("suggesting"); fail("");
    try { d.crits = await suggest(); save(); draw(); }
    catch (e) { fail(t(e.message === "quota" ? "err_quota" : "suggest_fail")); }
    finally { sug.disabled = false; sug.textContent = t("suggest"); }
  };
  return form([...head(t("nr_crit_title"), t("nr_crit_hint")), list, addRow, sug, actions()], () => {
    if (d.crits.filter(c => c.on).length < 2) return fail(t("need_criteria"));
    next();
  });
}
// Ask the server for criteria that fit this question and category (it writes the prompt, not the browser).
async function suggest() {
  if (demo) throw new Error("demo");
  const data = await Rooms.post("/api/rooms/criteria", { question: d.question, options: d.options.filter(o => o.trim()), type: d.type, type_label: d.typeLabel, lang: Rooms.lang });
  const list = (data.criteria || []).slice(0, 8);
  if (list.length < 2) throw new Error("few");
  return list.map(label => ({ label, on: true }));
}

/* ---------- How should we decide? (thinking model, recommended for this question) ---------- */
let M = null; // rooms/models.js, loaded when needed
async function recommendation() {
  M = M || await import("/rooms/models.js");
  const key = JSON.stringify([d.question, d.options, d.context, d.type, d.typeLabel]);
  if (d.rec && d.recFor === key) return d.rec;
  const input = { question: d.question, options: d.options.filter(o => o.trim()), context: d.context, type: d.type, type_label: d.typeLabel };
  let rec = null;
  if (!demo) {
    try { rec = await Rooms.post("/api/rooms/triage", input); } catch {}
  }
  rec = rec || M.recommend(M.guessSignals(input));   // demo, or triage unavailable: a rough guess in the browser
  d.rec = rec; d.recFor = key;
  if (!d.model || !M.MODELS[d.model]) d.model = rec.model;
  if (d.rapid === null) d.rapid = !!rec.rapid;
  save();
  return rec;
}
function stepModel() {
  const box = el("div", "stack-sm");
  box.append(el("p", "text sm thinking", t("nr_model_loading")));
  const here = d.at;
  const f = form([...head(t("nr_model_title"), t("nr_model_hint")), box, actions()], next);
  recommendation().then(rec => {
    if (d.at !== here) return;
    let all = false;
    const list = el("div", "choices");
    const more = el("button", "linkbtn"); more.type = "button"; more.onclick = () => { all = !all; draw(); };
    const draw = () => {
      const show = all ? [rec.model, ...M.MODEL_IDS.filter(id => id !== rec.model)] : [rec.model, ...rec.alternatives];
      list.replaceChildren(...show.map(id => {
        const m = M.MODELS[id];
        const c = Rooms.choice(m.framework, m.line[Rooms.lang] || m.line.en, d.model === id, () => { d.model = id; save(); draw(); });
        if (id === rec.model) { c.prepend(el("span", "tag split", t("recommended"))); c.append(el("span", "choice-h why", t(rec.why))); }
        return c;
      }));
      more.textContent = t(all ? "fewer_models" : "see_all_models");
    };
    const rapid = el("button", "tick"); rapid.type = "button";
    const drawRapid = () => {
      rapid.setAttribute("aria-pressed", String(!!d.rapid));
      const b = el("span", "tick-body");
      b.append(el("span", "choice-t", t("rapid_lbl")), el("span", "choice-h", M.RAPID.line[Rooms.lang] || M.RAPID.line.en));
      if (rec.rapid) b.append(el("span", "choice-h why", t("rapid_suggested")));
      rapid.replaceChildren(b);
    };
    rapid.onclick = () => { d.rapid = !d.rapid; save(); drawRapid(); };
    draw(); drawRapid();
    box.replaceChildren(list, more, rapid);
  });
  return f;
}

/* ---------- Who's in the room: the organisation, its roles, and what to ask each one ---------- */
// Each role gets its own invite link (optionally limited to a number of people) and an ask that
// only that role can answer. Everyone still counts equally.
function addRole(title, ask = "") {
  title = String(title).trim().slice(0, 60);
  if (!title || d.roles.length >= 12 || d.roles.some(r => r.title.toLowerCase() === title.toLowerCase())) return false;
  const n = Math.max(0, ...d.roles.map(r => Number(String(r.id).slice(1)) || 0)) + 1;
  d.roles.push({ id: "r" + n, title, max: null, ask: String(ask).slice(0, 600), rapid: null });
  d.extra = (d.extra || []).filter(x => x.title.toLowerCase() !== title.toLowerCase());
  save();
  return true;
}
function stepPeople() {
  if (!Array.isArray(d.roles)) d.roles = [];
  const orgs = el("div", "chips"); orgs.setAttribute("role", "group");
  const orgIn = el("input", "line"); Object.assign(orgIn, { maxLength: 60, value: d.orgLabel || "", placeholder: t("org_custom_ph") });
  orgIn.oninput = () => { d.orgLabel = orgIn.value; save(); drawDraft(); };
  orgIn.onchange = () => suggestNow();
  const orgF = field("orgLabel", t("org_custom_lbl"), orgIn);
  const sugg = el("div", "chips");
  const list = el("div", "roles");
  const extra = el("div", "field");
  const addIn = el("input", "line"); Object.assign(addIn, { maxLength: 60, placeholder: t("role_add_ph") });
  addIn.setAttribute("aria-label", t("role_add_ph"));
  const addBtn = el("button", "btn soft", t("add")); addBtn.type = "button";
  const addOne = () => { if (addRole(addIn.value)) { addIn.value = ""; drawAll(); } };
  addBtn.onclick = addOne;
  addIn.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); addOne(); } };
  const addRow = el("div", "add-row"); addRow.append(addIn, addBtn);
  const draft = el("button", "linkbtn"); draft.type = "button";
  const none = el("p", "small", t("roles_none_note"));

  const drawOrgs = () => {
    orgs.replaceChildren(...ORGS.map(o => chip(t("org_" + o), o === d.orgType, () => { d.orgType = o; save(); drawAll(); if (o === "custom") orgIn.focus(); else suggestNow(); })));
    orgF.hidden = d.orgType !== "custom";
  };
  const drawSugg = () => {
    const ready = d.orgType && d.orgType !== "custom" ? t("roles_" + d.orgType) : [];
    const have = new Set(d.roles.map(r => r.title.toLowerCase()));
    sugg.replaceChildren(...[...ready, t("role_external")].filter(x => !have.has(x.toLowerCase()))
      .map(x => chip("+ " + x, false, () => { addRole(x); drawAll(); })));
  };
  const drawList = () => {
    list.replaceChildren(...d.roles.map(r => {
      const b = el("div", "block role-card");
      const top = el("div", "role-top");
      const nm = el("span", "choice-t", r.title);
      const x = el("button", "x", "×"); x.type = "button"; x.setAttribute("aria-label", t("role_remove") + " " + r.title);
      x.onclick = () => { d.roles = d.roles.filter(y => y !== r); save(); drawAll(); };
      top.append(nm, x);
      const opts = el("div", "role-opts");
      const ppl = el("select", "line role-select"); ppl.setAttribute("aria-label", r.title + " · " + t("role_people"));
      PEOPLE.forEach(v => { const o = el("option", null, v === "" ? t("role_any") : String(v)); o.value = String(v); if (String(r.max ?? "") === String(v)) o.selected = true; ppl.append(o); });
      ppl.onchange = () => { r.max = ppl.value ? Number(ppl.value) : null; save(); };
      const pf = el("label", "role-opt"); pf.append(el("span", "small", t("role_people")), ppl);
      opts.append(pf);
      if (d.rapid) {
        const rp = el("select", "line role-select"); rp.setAttribute("aria-label", r.title + " · " + t("rr_title"));
        [["", "rr_input"], ["recommender", "rr_recommender"], ["approver", "rr_approver"], ["performer", "rr_performer"]].forEach(([v, k]) => {
          const o = el("option", null, t(k)); o.value = v; if ((r.rapid || "") === v) o.selected = true; rp.append(o);
        });
        rp.onchange = () => { r.rapid = rp.value || null; save(); };
        const rf = el("label", "role-opt"); rf.append(el("span", "small", t("rr_title")), rp);
        opts.append(rf);
      }
      const ask = el("textarea"); Object.assign(ask, { rows: 2, maxLength: 600, placeholder: t("role_ask_ph"), value: r.ask || "" });
      ask.setAttribute("aria-label", r.title + " · " + t("role_ask_lbl"));
      ask.oninput = () => { r.ask = ask.value; save(); };
      const af = el("div", "field"); af.append(el("span", "lbl", t("role_ask_lbl")), ask);
      b.append(top, opts, af);
      return b;
    }));
    none.hidden = d.roles.length > 0;
  };
  const drawExtra = () => {
    const ex = (d.extra || []).filter(x => !d.roles.some(r => r.title.toLowerCase() === x.title.toLowerCase()));
    extra.hidden = !ex.length && !suggesting;
    extra.replaceChildren(el("span", "lbl", t("roles_extra")), ...(suggesting && !ex.length ? [el("p", "small thinking", t("roles_drafting"))] : []), ...ex.map(x => {
      const c = Rooms.choice("+ " + x.title, x.ask, false, () => { addRole(x.title, x.ask); drawAll(); });
      return c;
    }));
  };
  const drawDraft = () => {
    draft.textContent = t(d.roles.length ? "roles_draft" : "roles_suggest");
    draft.hidden = !d.orgType || (d.orgType === "custom" && !d.orgLabel.trim());
  };
  // RAPID: who may override an approver's objection.
  const gov = el("div", "field");
  const drawGov = () => {
    gov.hidden = !d.rapid;
    if (!d.rapid) return;
    const sel = el("select", "line role-select"); sel.id = "overrideRule"; sel.style.width = "100%";
    [["owner", "gov_owner"], ["approver", "gov_approver"], ...d.roles.map(r => ["authority:" + r.id, null, r.title])].forEach(([v, k, title]) => {
      const o = el("option", null, k ? t(k) : t("gov_authority", { role: title })); o.value = v;
      if (v === d.overrideRule || v === "authority:" + d.overrideRoleId && d.overrideRule === "authority") o.selected = true;
      sel.append(o);
    });
    sel.onchange = () => { const [rule, id] = sel.value.split(":"); d.overrideRule = rule; d.overrideRoleId = id || null; save(); };
    const l = el("label", "lbl", t("gov_lbl")); l.htmlFor = "overrideRule";
    gov.replaceChildren(l, el("p", "small", t("gov_hint")), sel);
  };
  const drawAll = () => { drawOrgs(); drawExtra(); drawSugg(); drawList(); drawDraft(); drawGov(); };
  let suggesting = false;
  // Roles that fit this question, suggested as soon as the organisation is known (once per organisation).
  const suggestNow = async () => {
    const key = [d.orgType, d.orgLabel.trim(), d.question].join("|");
    if (demo || !d.orgType || (d.orgType === "custom" && !d.orgLabel.trim()) || d.sugFor === key) return;
    d.sugFor = key; suggesting = true; drawExtra();
    try {
      const data = await Rooms.post("/api/rooms/roles", { question: d.question, options: d.options.filter(o => o.trim()), type: d.type, type_label: d.typeLabel, org_type: d.orgType, org_label: d.orgLabel, roles: [], lang: Rooms.lang });
      d.extra = [...(data.roles || []), ...(data.extra || [])].slice(0, 6);
    } catch { d.sugFor = ""; }
    suggesting = false; save(); drawAll();
  };
  draft.onclick = async () => {
    draft.disabled = true; draft.textContent = t("roles_drafting"); fail("");
    try { await draftAsks(); drawAll(); }
    catch (e) { fail(t(e.message === "quota" ? "err_quota" : "roles_fail")); drawDraft(); }
    finally { draft.disabled = false; }
  };
  drawAll();
  const orgField = el("div", "field"); orgField.append(el("span", "lbl", t("org_lbl")), orgs);
  const rolesField = el("div", "field"); rolesField.append(el("span", "lbl", t("roles_lbl")), el("p", "small", t("roles_hint")), sugg);
  setTimeout(suggestNow, 0);
  return form([...head(t("nr_people_title"), t("nr_people_hint")), orgField, orgF, extra, rolesField, list, addRow, draft, none, gov, actions()], () => {
    if (!d.orgType) return fail(t("need_org"));
    if (d.orgType === "custom" && !d.orgLabel.trim()) { orgIn.focus(); return fail(t("need_org_label")); }
    if (d.rapid && d.overrideRule === "authority" && !d.roles.some(r => r.id === d.overrideRoleId)) { d.overrideRule = "owner"; d.overrideRoleId = null; save(); }
    next();
  });
}
// The server drafts an ask per role (keeping the owner's own words), or suggests roles for a custom organisation.
async function draftAsks() {
  if (demo) {
    const ar = Rooms.lang === "ar";
    if (!d.roles.length) d.extra = (ar ? ["المدرب", "أمين الصندوق", "عضو مجلس الإدارة"] : ["Head coach", "Treasurer", "Board member"]).map(title => ({ title, ask: "" }));
    d.roles.forEach(r => { if (!r.ask.trim()) r.ask = ar ? `ما الأرقام أو الحدود التي تراها من موقعك كـ${r.title} وقد تغيب عن الآخرين؟` : `What numbers or limits do you see as ${r.title} that the others might miss?`; });
    save(); return;
  }
  const data = await Rooms.post("/api/rooms/roles", {
    question: d.question, options: d.options.filter(o => o.trim()), type: d.type, type_label: d.typeLabel,
    org_type: d.orgType, org_label: d.orgLabel, roles: d.roles.map(r => r.title), lang: Rooms.lang
  });
  if (d.roles.length) {
    for (const x of data.roles || []) {
      const r = d.roles.find(y => y.title.toLowerCase() === String(x.title).toLowerCase());
      if (r && !r.ask.trim() && x.ask) r.ask = x.ask;
    }
    d.extra = (data.extra || []).slice(0, 2);
  } else d.extra = (data.roles || []).slice(0, 6);
  save();
}

/* ---------- Last: what everyone should know, files, settings, then open the room ---------- */
function stepContext() {
  const ta = el("textarea"); Object.assign(ta, { rows: 5, maxLength: 4000, placeholder: t("context_ph"), value: d.context });
  ta.setAttribute("aria-label", t("nr_ctx_title"));
  ta.oninput = () => { d.context = ta.value; save(); };

  // Files: upload, or paste a conversation (Slack, email...), with how-to help for common sources.
  const drop = el("label", "drop"); drop.htmlFor = "files";
  const inp = el("input"); Object.assign(inp, { type: "file", id: "files", multiple: true, accept: ".pdf,.docx,.xlsx,.xls,.ods,.csv,.tsv,.txt,.md,.json,.zip" });
  drop.append(inp, el("span", null, "+ " + t("drop")));
  inp.onchange = () => { addFiles(inp.files); inp.value = ""; };
  ["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", e => { if (e.dataTransfer?.files) addFiles(e.dataTransfer.files); });

  const pasteBtn = el("button", "linkbtn", t("paste_btn")); pasteBtn.type = "button";
  const pasteBox = el("div", "stack-sm"); pasteBox.hidden = true;
  const pasteTa = el("textarea"); Object.assign(pasteTa, { rows: 6, maxLength: MAX_TEXT, placeholder: t("paste_ph") });
  pasteTa.setAttribute("aria-label", t("paste_ph"));
  const pasteAdd = el("button", "btn soft", t("paste_add")); pasteAdd.type = "button"; pasteAdd.style.width = "auto";
  pasteBtn.onclick = () => { pasteBox.hidden = !pasteBox.hidden; if (!pasteBox.hidden) pasteTa.focus(); };
  pasteAdd.onclick = () => {
    const text = pasteTa.value.trim(); if (!text || files.length >= MAX_FILES) return;
    const name = `${t("paste_name")} ${files.filter(f => f.pasted).length + 1}.txt`;
    files.push({ name, file: new File([text], name, { type: "text/plain" }), status: "ready", note: "file_ready", text, pasted: true });
    pasteTa.value = ""; pasteBox.hidden = true; drawFiles();
  };
  pasteBox.append(pasteTa, pasteAdd);

  const list = el("ul", "plain"); list.id = "fileList";
  const how = el("details", "more howto");
  how.append(el("summary", null, t("files_ideas")));
  [["how_wa_ios_t", "how_wa_ios"], ["how_wa_and_t", "how_wa_and"], ["how_slack_t", "how_slack"], ["how_email_t", "how_email"], ["how_docs_t", "how_docs"], ["how_sheets_t", "how_sheets"]].forEach(([title, steps]) => {
    const b = el("div", "block"); const ol = el("ol", "steps-list");
    t(steps).forEach(s => ol.append(el("li", null, s)));
    b.append(el("h3", null, t(title)), ol);
    how.append(b);
  });
  how.append(el("p", "small", t("how_tip")));

  // Settings that rarely change
  const more = el("details", "more");
  const rev = el("input", "line"); Object.assign(rev, { type: "date", id: "review", value: d.review, min: new Date().toISOString().slice(0, 10) });
  rev.onchange = () => { d.review = rev.value; save(); };
  const revF = el("div", "field"); const rl = el("label", "lbl", t("review_lbl")); rl.htmlFor = "review"; revF.append(rl, rev);
  const named = el("label", "check");
  const nc = el("input"); nc.type = "checkbox"; nc.checked = d.named; nc.onchange = () => { d.named = nc.checked; save(); };
  const nt = el("span"); nt.append(el("span", null, t("named_lbl")), el("br"), el("span", "small", t("named_hint")));
  named.append(nc, nt);
  const namedF = el("div", "field"); namedF.append(named);
  const strict = el("label", "check");
  const sc = el("input"); sc.type = "checkbox"; sc.id = "strict"; sc.checked = !!d.strict; sc.onchange = () => { d.strict = sc.checked; save(); };
  const stx = el("span"); stx.append(el("span", null, t("strict_lbl")), el("br"), el("span", "small", t("strict_hint")));
  strict.append(sc, stx);
  const strictF = el("div", "field"); strictF.append(strict);
  const repF = el("div", "field");
  const repSel = el("select", "line role-select"); repSel.id = "reportMode"; repSel.style.width = "100%";
  [["both", "rm_both"], ["team", "rm_team"], ["personal", "rm_personal"]].forEach(([v, k]) => { const o = el("option", null, t(k)); o.value = v; if ((d.reportMode || "both") === v) o.selected = true; repSel.append(o); });
  repSel.onchange = () => { d.reportMode = repSel.value; save(); };
  const repL = el("label", "lbl", t("rm_lbl")); repL.htmlFor = "reportMode";
  repF.append(repL, repSel);
  more.append(el("summary", null, t("more_settings")), revF, namedF, strictF, repF);

  // Useful links: everyone in the room sees them, and the analysis reads them.
  if (!Array.isArray(d.links)) d.links = [];
  const linksF = el("div", "field");
  linksF.append(el("span", "lbl", t("links_lbl")), el("p", "small", t("links_hint")), Rooms.linksEditor(d.links, 10, l => { d.links = l; save(); }));

  // World brief: what is happening in the world that matters to this question, dated and sourced.
  // The owner picks items to add to what everyone sees.
  const briefF = el("div", "field");
  const briefBtn = el("button", "btn soft", t("brief_btn")); briefBtn.type = "button"; briefBtn.style.width = "auto";
  const briefBox = el("div", "stack-sm");
  briefBtn.onclick = async () => {
    briefBtn.disabled = true; briefBtn.textContent = t("brief_loading"); fail("");
    try {
      const r = demo ? { summary: t("brief_demo_summary"), items: [{ text: t("brief_demo_item"), date: new Date().toISOString().slice(0, 7), source: "Example source", url: null }] }
        : await Rooms.post("/api/rooms/brief", { question: d.question, options: d.options.filter(o => o.trim()), context: d.context, type: d.type, type_label: d.typeLabel, lang: Rooms.lang });
      const picked = new Set();
      const list = el("div", "ticks");
      (r.items || []).forEach((x, i) => {
        const b = el("button", "tick"); b.type = "button"; b.setAttribute("aria-pressed", "false");
        const body = el("span", "tick-body"); body.append(el("span", null, x.text), el("span", "choice-h", [x.date, x.source].filter(Boolean).join(" · ")));
        b.append(body);
        b.onclick = () => { picked.has(i) ? picked.delete(i) : picked.add(i); b.setAttribute("aria-pressed", String(picked.has(i))); };
        list.append(b);
      });
      const add = el("button", "btn soft", t("brief_add")); add.type = "button"; add.style.width = "auto";
      add.onclick = () => {
        const chosen = [...picked].sort().map(i => r.items[i]);
        if (!chosen.length) return;
        const lines = chosen.map(x => `• ${x.text} (${[x.date, x.source].filter(Boolean).join(", ")})`).join("\n");
        d.context = (d.context.trim() ? d.context.trim() + "\n\n" : "") + t("brief_heading", { date: r.as_of || new Date().toISOString().slice(0, 10) }) + "\n" + lines;
        ta.value = d.context;
        chosen.forEach(x => { if (x.url && Rooms.validUrl(x.url) && !d.links.includes(x.url) && d.links.length < 10) d.links.push(x.url); });
        save(); render();
      };
      briefBox.replaceChildren(...(r.summary ? [el("p", "body", r.summary)] : []), list, el("p", "small", t("brief_pick_hint")), add);
    } catch (e) { fail(t(e.message === "quota" ? "err_quota" : "brief_fail")); }
    finally { briefBtn.disabled = false; briefBtn.textContent = t("brief_btn"); }
  };
  briefF.append(el("span", "lbl", t("brief_lbl")), el("p", "small", t("brief_hint")), briefBtn, briefBox);

  setTimeout(drawFiles, 0);
  const nodes = [...head(t("nr_ctx_title"), t("nr_ctx_hint")), ta, briefF, linksF, drop, el("p", "small", t("files_types")), pasteBtn, pasteBox, list, how, more];
  if (["finance", "politics"].includes(d.type)) nodes.push(el("p", "small", t("advice_note")));
  return form([...nodes, actions({ next: t("create") })], create);
}
function drawFiles() {
  const list = $("fileList"); if (!list) return;
  list.replaceChildren(...files.map(f => {
    const li = el("li", "file");
    const nm = el("span", "nm", f.name); nm.title = f.name;
    const st = el("span", "st" + (f.status === "error" ? " err" : f.status === "ready" ? " ok" : ""), t(f.note));
    const x = el("button", null, "×"); x.type = "button"; x.setAttribute("aria-label", t("remove") + " " + f.name);
    x.onclick = () => { files = files.filter(y => y !== f); drawFiles(); };
    li.append(nm, st, x);
    return li;
  }));
}
async function addFiles(list) {
  for (const file of [...list]) {
    if (files.length >= MAX_FILES) break;
    const f = { name: file.name, file, status: "reading", note: "file_reading", text: "" };
    files.push(f);
    if (!Rooms.fileKind(file)) Object.assign(f, { status: "error", note: "file_bad" });
    else if (file.size > MAX_FILE_BYTES) Object.assign(f, { status: "error", note: "file_big" });
    drawFiles();
    if (f.status !== "reading") continue;
    try {
      f.text = (await Rooms.readFile(file)).trim().slice(0, MAX_TEXT);
      Object.assign(f, f.text ? { status: "ready", note: "file_ready" } : { status: "error", note: "file_empty" });
    } catch { Object.assign(f, { status: "error", note: "file_bad" }); }
    drawFiles();
  }
}

/* ---------- Create ---------- */
const safeName = n => n.normalize("NFKD").replace(/[^\w.-]+/g, "_").slice(-80) || "file";
async function create() {
  const options = d.options.map(o => o.trim()).filter(Boolean).map((label, i) => ({ id: "o" + (i + 1), label }));
  const picked = d.crits.filter(c => c.on);
  const w = Rooms.apportion(picked.map((_, i) => "c" + (i + 1)), {}, 100); // equal starting weights; members set their own
  const criteria = picked.map((c, i) => ({ id: "c" + (i + 1), label: c.label, weight: w["c" + (i + 1)] }));
  const roles = (d.roles || []).slice(0, 12).map(r => ({ id: r.id, title: r.title.trim().slice(0, 60), max: r.max || null, ask: (r.ask || "").trim().slice(0, 600), rapid: d.rapid ? r.rapid || null : null }));
  const btn = document.querySelector("#wiz .actions .btn:not(.ghost)"); if (btn) { btn.disabled = true; btn.textContent = t("creating"); }
  fail("");
  try {
    if (demo) { try { localStorage.removeItem(DRAFT_KEY); } catch {} Rooms.goToRoom(`/room.html?demo=owner&model=${d.model || "standard"}${d.rapid ? "&rapid=1" : ""}${d.roles.length ? "&roles=1" : ""}`); return; }
    if (!Rooms.user) await Rooms.trialSignIn(d.name.trim(), d.email.trim());
    const sb = Rooms.sb, me = Rooms.user.id;
    let { data: ws } = await sb.from("workspaces").select("id").eq("owner_id", me).order("created_at").limit(1).maybeSingle();
    if (!ws) {
      ws = { id: crypto.randomUUID() };
      const { error } = await sb.from("workspaces").insert({ id: ws.id, name: (d.name.trim() || "My") + " workspace", owner_id: me });
      if (error) throw error;
    }
    // Ids are made here rather than read back, because the owner can only read the room once the
    // insert's trigger has made them a member.
    const id = crypto.randomUUID();
    const review = d.review || (() => { const x = new Date(); x.setDate(x.getDate() + 42); return x.toISOString().slice(0, 10); })();
    const { error } = await sb.from("rooms").insert({
      id, workspace_id: ws.id, owner_id: me, language: Rooms.lang, type: d.type,
      type_label: d.type === "custom" ? d.typeLabel.trim() : null, question: d.question.trim(),
      context: d.context.trim(), options, criteria, review_date: review, named_views: d.named,
      model: d.model || "standard", rapid: !!d.rapid,
      org_type: d.orgType || null, org_label: d.orgType === "custom" ? d.orgLabel.trim() || null : null, roles,
      override_rule: d.rapid && d.overrideRule === "authority" && roles.some(r => r.id === d.overrideRoleId) ? "authority" : d.rapid && d.overrideRule === "approver" ? "approver" : "owner",
      override_role_id: d.rapid && d.overrideRule === "authority" && roles.some(r => r.id === d.overrideRoleId) ? d.overrideRoleId : null,
      strict_confidential: !!d.strict, report_mode: ["team", "personal", "both"].includes(d.reportMode) ? d.reportMode : "both",
      links: (d.links || []).filter(Rooms.validUrl).slice(0, 10).map(url => ({ url }))
    });
    if (error) throw error;
    let filesFailed = false;
    for (const [i, f] of files.filter(f => f.status === "ready").entries()) {
      const path = `${id}/${i + 1}-${safeName(f.name)}`;
      const up = await sb.storage.from("room-files").upload(path, f.file);
      const ins = await sb.from("attachments").insert({ room_id: id, file_name: f.name, storage_path: up.error ? null : path, extracted_text: f.text, uploaded_by: me });
      if (up.error || ins.error) filesFailed = true;
    }
    // One link per role (with its limit), or one link for everyone when there are no roles.
    const invites = roles.length ? roles.map(r => ({ room_id: id, created_by: me, role_id: r.id, max_uses: r.max })) : [{ room_id: id, created_by: me }];
    const { error: invErr } = await sb.from("invites").insert(invites);
    if (invErr) throw invErr;
    try { localStorage.removeItem(DRAFT_KEY); } catch {}
    Rooms.goToRoom(`/room.html?room=${id}&new=1${filesFailed ? "&files=failed" : ""}`);
  } catch (err) {
    console.error(err);
    fail(t(Rooms.errKey(err, ["room_needs_2_to_6_options", "room_needs_2_to_8_criteria"])));
    if (btn) { btn.disabled = false; btn.textContent = t("create"); }
  }
}

/* ---------- Start ---------- */
const STEPS = { you: stepYou, question: stepQuestion, options: stepOptions, criteria: stepCriteria, model: stepModel, people: stepPeople, context: stepContext };
function render() { $("wiz").replaceChildren(STEPS[ids[d.at]]()); }
Rooms.langToggle(() => { document.title = t("new_room") + " · " + t("product"); render(); });

async function start() {
  try { const saved = JSON.parse(localStorage.getItem(DRAFT_KEY)); if (saved && saved.question !== undefined) d = { ...d, ...saved }; } catch {}
  await Rooms.loadLang(Rooms.firstLang(demo === "ar" ? "ar" : null));
  document.title = t("new_room") + " · " + t("product");
  let known = false;
  if (!demo) {
    if (!(await Rooms.connect())) { $("wiz").replaceChildren(el("p", "text", t("not_setup"))); return; }
    if (Rooms.user) {
      const p = await Rooms.profile();
      if (p?.name) d.name = d.name || p.name;
      if (p?.email) d.email = d.email || p.email;
      known = !!(p?.name && p?.email);   // asked once: people we know skip straight to the question
    }
  }
  ids = [...(known ? [] : ["you"]), "question", "options", "criteria", "model", "people", "context"];
  d.at = Math.max(0, ids.indexOf(d.atId)); // resume on the same step by name, even if "you" was skipped this time
  $("demoNote").hidden = !demo;
  render();
  Rooms.helper({ page: "setup", draft: () => ({ question: d.question, options: d.options, criteria: (d.crits || []).filter(c => c.on).map(c => c.label), type: d.type === "custom" ? d.typeLabel : d.type }) });
}
start();
})();
</script>
