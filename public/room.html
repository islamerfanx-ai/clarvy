<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A Clarvy decision room: give your view privately, then see the group's call.">
<title>Clarvy room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,300..600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/rooms/rooms.css">
</head>
<body>
<main>
  <header class="top">
    <a class="wm" href="/">Clarvy</a>
    <div class="top-acts">
      <a class="navlink" id="myRoomsLink" href="/rooms.html" data-t="my_rooms" hidden>My rooms</a>
      <button class="lang" type="button" id="langBtn"></button>
    </div>
  </header>
  <div id="view" style="display:flex;flex-direction:column;gap:8px" aria-live="polite">
    <article class="msg"><p class="text thinking">One moment</p></article>
  </div>
  <p class="small" id="demoNote" data-t="demo_note" hidden style="text-align:center;padding-top:8px"></p>
</main>

<script src="/rooms/rooms.js"></script>
<script>
(() => {
const { $, el, t, choice } = Rooms;
const params = new URLSearchParams(location.search);
let roomId = params.get("room");
const joinToken = params.get("join");
const demo = params.get("demo");
const RISKS = ["safe", "balanced", "bold"];
const SCALE = [1, 2, 3, 4, 5];

/* ======================= Data: live (Supabase) ======================= */
const live = {
  async preview() {
    const { data, error } = await Rooms.sb.rpc("invite_preview", { invite_token: joinToken });
    return !error && data && data[0] || null;
  },
  async load() {
    const sb = Rooms.sb, me = Rooms.user.id;
    const { data: room, error } = await sb.from("rooms")
      .select("id,type,question,context,options,criteria,status,language,review_date,quorum,decide_error").eq("id", roomId).maybeSingle();
    if (error) throw error;
    if (!room) return null; // row-level security hides rooms you're not in
    const [mem, mine, roster, an, files] = await Promise.all([
      sb.from("memberships").select("role").eq("room_id", roomId).eq("user_id", me).maybeSingle(),
      sb.from("inputs").select("ratings,weights,risk_appetite,gut_pick,concern").eq("room_id", roomId).eq("user_id", me).maybeSingle(),
      sb.rpc("room_roster", { rid: roomId }),
      sb.from("analyses").select("frame,disagreement_map,verdict,confidence,owner_decision,override_reason,final_option").eq("room_id", roomId).order("created_at", { ascending: false }).limit(1).maybeSingle(),
      sb.from("attachments").select("file_name").eq("room_id", roomId).order("created_at")
    ]);
    const role = mem.data?.role;
    const out = { room, role, mine: mine.data, roster: (roster.data || []).map(r => ({ ...r, me: r.user_id === me })), analysis: an.data, files: (files.data || []).map(f => f.file_name) };
    if (role === "owner") out.invite = await this.invite();
    if (["decided", "reviewed"].includes(room.status)) {
      const [so, counts] = await Promise.all([
        sb.from("signoffs").select("stance,note").eq("room_id", roomId).eq("user_id", me).maybeSingle(),
        sb.rpc("signoff_counts", { rid: roomId })
      ]);
      out.signoff = so.data;
      out.counts = Object.fromEntries((counts.data || []).map(c => [c.stance, Number(c.n)]));
    }
    return out;
  },
  // The owner's current invite link, made fresh if the last one expired.
  async invite() {
    const sb = Rooms.sb;
    const { data } = await sb.from("invites").select("token").eq("room_id", roomId).eq("revoked", false)
      .gt("expires_at", new Date().toISOString()).order("created_at", { ascending: false }).limit(1).maybeSingle();
    if (data) return data.token;
    const { data: made } = await sb.from("invites").insert({ room_id: roomId, created_by: Rooms.user.id }).select("token").single();
    return made?.token || null;
  },
  async join(name, consent) {
    if (!Rooms.user) await Rooms.guestSignIn(name);
    else if (name) await Rooms.setName(name);
    const { data, error } = await Rooms.sb.rpc("join_room", { invite_token: joinToken, consent });
    if (error) throw error;
    return data;
  },
  async save(input) {
    const { error } = await Rooms.sb.from("inputs").upsert({ room_id: roomId, user_id: Rooms.user.id, ...input }, { onConflict: "room_id,user_id" });
    if (error) throw error;
  },
  decide: () => Rooms.decideNow(roomId),
  async settle(decision, reason, option) {
    const { error } = await Rooms.sb.rpc("decide_verdict", { rid: roomId, decision, reason: reason || null, option_id: option || null });
    if (error) throw error;
  },
  async signOff(stance, note) {
    const { error } = await Rooms.sb.from("signoffs").upsert({ room_id: roomId, user_id: Rooms.user.id, stance, note }, { onConflict: "room_id,user_id" });
    if (error) throw error;
  }
};

/* ======================= Data: demo (in this browser only) ======================= */
const DEMO_ROOMS = {
  en: {
    id: "demo", type: "business", status: "open", language: "en", review_date: "2026-12-01", quorum: 2,
    question: "Should we open a second location in Jeddah this year, or wait until next spring?",
    context: "The Riyadh shop does about 1.2M a month and has been profitable for 14 months.\nFit-out in Jeddah is roughly 4M. One landlord offers 6 months rent-free.",
    options: [{ id: "o1", label: "Open in Jeddah this year" }, { id: "o2", label: "Wait until next spring" }, { id: "o3", label: "Grow Riyadh instead" }],
    criteria: [{ id: "c1", label: "Upside" }, { id: "c2", label: "Cash risk" }, { id: "c3", label: "Execution capacity" }, { id: "c4", label: "Brand fit" }]
  },
  ar: {
    id: "demo", type: "finance", status: "open", language: "ar", review_date: "2026-12-15", quorum: 2,
    question: "هل نأخذ قرضًا بنكيًا للتوسّع، أم نطرح حصة للمستثمرين، أم نموّل أنفسنا؟",
    context: "الإيرادات السنوية 18 مليونًا وهامش الربح 14٪.\nعرض البنك بفائدة 7.5٪ لخمس سنوات، ومستثمر مهتم بحصة 20٪.",
    options: [{ id: "o1", label: "قرض بنكي" }, { id: "o2", label: "حصة للمستثمرين" }, { id: "o3", label: "تمويل ذاتي" }],
    criteria: [{ id: "c1", label: "تكلفة رأس المال" }, { id: "c2", label: "السيطرة على القرار" }, { id: "c3", label: "الحماية من الخسارة" }, { id: "c4", label: "السيولة" }]
  }
};
function demoStore(kind) {
  const room = structuredClone(DEMO_ROOMS[kind === "ar" ? "ar" : "en"]);
  const owner = kind === "owner";
  let role = kind === "join" ? null : owner ? "owner" : "member";
  let mine = null, analysis = null, signoff = null, myName = owner ? "Islam" : "Lina";
  const others = [
    { name: "Sara", input: { weights: { c1: 20, c2: 45, c3: 25, c4: 10 }, risk_appetite: "safe", gut_pick: "o2", concern: "Cash is thin until the Riyadh loan is paid off." } },
    { name: "Omar", input: { weights: { c1: 45, c2: 15, c3: 15, c4: 25 }, risk_appetite: "bold", gut_pick: "o1", concern: "A competitor could take the best Jeddah site first." } }
  ];
  const roster = () => [
    ...(role ? [{ name: myName, role, submitted: !!mine, me: true }] : []),
    { name: "Sara", role: owner ? "member" : "owner", submitted: true, me: false },
    { name: "Omar", role: "member", submitted: owner, me: false }
  ];
  return {
    async preview() { return { room_id: "demo", type: room.type, question: room.question, language: room.language, owner_name: "Sara", named_views: false, role: "member", usable: true }; },
    async load() {
      const counts = signoff ? { agree: 1, [signoff.stance]: (signoff.stance === "agree" ? 2 : 1) } : { agree: 1 };
      return { room, role, mine, roster: roster(), analysis, files: ["Riyadh P&L 2026.xlsx"], invite: owner ? "demo-invite" : null, signoff, counts };
    },
    async join(name) { role = "member"; if (name) myName = name; return "demo"; },
    async save(input) { mine = input; },
    async decide() {
      room.status = "deciding";
      setTimeout(async () => { analysis = await demoAnalysis(room, [mine, ...others.map(o => o.input)].filter(Boolean)); await refresh(); }, 2500);
    },
    async settle(decision, reason, option) {
      Object.assign(analysis, { owner_decision: decision, override_reason: reason, final_option: decision === "accepted" ? analysis.verdict.call : option });
      room.status = "decided";
    },
    async signOff(stance, note) { signoff = { stance, note }; }
  };
}
// The demo runs the real group math (rooms/math.js) on made-up scores, with a canned write-up.
async function demoAnalysis(room, inputs) {
  const M = await import("/rooms/math.js");
  const scores = { o1: { c1: 9, c2: 3, c3: 4, c4: 8 }, o2: { c1: 7, c2: 7, c3: 7, c4: 7 }, o3: { c1: 4, c2: 9, c3: 8, c4: 5 } };
  const outcomes = {
    o1: { best: { value: 10, odds: 25 }, likely: { value: 6, odds: 50 }, worst: { value: 1, odds: 25 } },
    o2: { best: { value: 8, odds: 30 }, likely: { value: 7, odds: 55 }, worst: { value: 4, odds: 15 } },
    o3: { best: { value: 6, odds: 30 }, likely: { value: 5, odds: 60 }, worst: { value: 4, odds: 10 } }
  };
  const m = M.roomMath({ options: room.options, criteria: room.criteria, scores, outcomes, inputs });
  const ar = room.language === "ar";
  return {
    confidence: m.capConfidence ? "Medium" : "High",
    frame: { facts: [{ text: ar ? "ارتفعت أسعار الفائدة على قروض الشركات 0.5٪ هذا العام." : "Retail rents in central Jeddah rose about 9% this year.", source: ar ? "تقرير مصرفي، سبتمبر 2026" : "Local property report, Sep 2026", url: null }] },
    verdict: {
      call: m.call, call_label: room.options.find(o => o.id === m.call).label,
      headline: ar ? "خذوا الخيار الأوسط الآن، وأعيدوا التقييم بعد ستة أشهر." : "Wait until spring, and use the time to lock in the rent-free lease.",
      reasons: ar ? ["يحمي السيولة في أصعب الأشهر.", "يبقي خيار التوسّع مفتوحًا.", "يحظى بأوسع قبول في المجموعة."] : ["It protects cash through the tightest months.", "It keeps the Jeddah option open at low cost.", "It has the broadest support in the group."],
      risks: ar ? ["قد يرتفع العرض المنافس."] : ["A competitor could take the best site first.", "The rent-free offer may not last until spring."],
      check_first: ar ? null : "Ask the landlord if the 6 months rent-free still applies for a March start.",
      disappoints: ar ? null : "Members who weigh upside most, who would rather move this year.",
      bring_on_board: ar ? null : "A signed option on the site now, so waiting doesn't mean losing it.",
      split: m.capConfidence
    },
    disagreement_map: {
      weights: m.weightSpread, winners: m.winners, gut: m.gut, risk: m.riskMix, members: m.members, dissent: m.dissent,
      themes: ar ? [] : [{ theme: "Cash runway", kind: "facts", count: 2 }, { theme: "Moving before competitors", kind: "values", count: 1 }]
    },
    owner_decision: null, override_reason: null, final_option: null
  };
}

const store = demo ? demoStore(demo) : live;

/* ======================= Screens ======================= */
let S = null;                 // what load() returned
let inputStep = 0;            // 0 = not answering; 1-4 = input steps
let draft = null;             // answers in progress
let pollTimer = null;
const view = $("view");
const optLabel = id => S.room.options.find(o => o.id === id)?.label || id;
const say = (node, msg, kind = "err") => { node.textContent = msg; node.className = "status " + kind; };
function card(cls, ...kids) { const c = el("article", "msg " + cls); c.append(...kids.filter(Boolean)); return c; }
function meta(left, right) { const m = el("div", "meta"); m.append(el("span", null, left), el("span", null, right || "")); return m; }
function btn(label, cls, onClick) { const b = el("button", "btn " + (cls || ""), label); b.type = "button"; if (onClick) b.onclick = onClick; return b; }
function show(...cards) { view.replaceChildren(...cards); }
function notice(msg, thinking) { const p = el("p", "text" + (thinking ? " thinking" : ""), msg); show(card("", p)); }
const contentLang = node => { node.lang = S.room.language; node.dir = S.room.language === "ar" ? "rtl" : "ltr"; return node; };

// The question, with what everyone should know tucked away.
function questionCard() {
  const r = S.room;
  const q = contentLang(el("p", "text", r.question));
  const c = card("active", meta(t("type_" + r.type), r.review_date ? t("review_on", { date: Rooms.fmtDate(r.review_date) }) : ""), q);
  if (r.context || S.files?.length) {
    const more = el("details", "more");
    const sum = el("summary", null, t("nr_ctx_title").replace(/[?؟]$/, "")); sum.style.color = "#fff";
    more.append(sum);
    if (r.context) { const b = contentLang(el("p", "body", r.context)); b.style.marginTop = "10px"; more.append(b); }
    if (S.files?.length) { const ul = el("ul", "plain"); ul.style.marginTop = "12px"; S.files.forEach(n => ul.append(el("li", "file", n))); more.append(ul); }
    c.append(more);
  }
  return c;
}

/* ---------- Join (invite link) ---------- */
async function vJoin() {
  const p = await store.preview();
  if (!p) return notice(t("invite_not_found"));
  if (!p.usable) return notice(t("invite_expired"));
  if (p.room_id && Rooms.user && !demo) {
    // Already in this room? Go straight there.
    const { data } = await Rooms.sb.from("memberships").select("role").eq("room_id", p.room_id).eq("user_id", Rooms.user.id).maybeSingle();
    if (data) { roomId = p.room_id; history.replaceState(null, "", "?room=" + roomId); return refresh(); }
  }
  const q = el("p", "text", p.question); q.lang = p.language; q.dir = p.language === "ar" ? "rtl" : "ltr";
  const top = card("active", meta(p.owner_name ? t("join_from", { name: p.owner_name }) : t("join_anon"), t("type_" + p.type)), q,
    el("p", "small", t("join_hint")));
  const f = el("form", "stack-sm"); f.noValidate = true;
  const needName = !Rooms.hasAccount();
  const nameIn = el("input", "line"); Object.assign(nameIn, { id: "jName", autocomplete: "given-name", maxLength: 60, placeholder: t("name_ph") });
  if (needName) { const l = el("label", "lbl", t("name_lbl")); l.htmlFor = "jName"; f.append(l, nameIn); }
  const consent = el("input"); consent.type = "checkbox";
  if (p.named_views) { const c = el("label", "check"); c.append(consent, el("span", null, t("join_consent"))); f.append(c); }
  if (p.role === "observer") f.append(el("p", "small", t("join_observer")));
  const go = el("button", "btn", t("join_start")); go.type = "submit";
  const st = el("p", "status"); st.setAttribute("role", "status");
  f.append(go, st);
  f.onsubmit = async e => {
    e.preventDefault();
    const name = nameIn.value.trim();
    if (needName && !name) { nameIn.focus(); return say(st, t("need_name")); }
    go.disabled = true; say(st, t("joining"), "");
    try {
      roomId = await store.join(name, consent.checked);
      if (!demo) history.replaceState(null, "", "?room=" + roomId);
      Rooms.showMyRooms();
      inputStep = 0;
      await refresh();
    } catch (err) {
      say(st, t(Rooms.errKey(err, ["invite_expired", "invite_not_found"])));
      go.disabled = false;
    }
  };
  const bottom = card("you", f);
  if (needName && !demo) {
    const have = el("button", "linkbtn", t("have_account")); have.type = "button";
    const box = el("div", "stack-sm");
    have.onclick = () => { have.hidden = true; Rooms.emailCode(box, { onDone: () => vJoin() }); };
    bottom.append(have, box);
  }
  show(top, bottom);
  if (needName) nameIn.focus();
}

/* ---------- Sign in (opening a room link on a new device) ---------- */
function vSignIn() {
  const box = el("div", "stack-sm");
  show(card("you", el("p", "text sm", t("signin_title")), box));
  Rooms.emailCode(box, { onDone: () => refresh() });
}

/* ---------- My answers, one step at a time ---------- */
function startInput() {
  const ids = S.room.criteria.map(c => c.id);
  const m = S.mine;
  draft = {
    ratings: Object.fromEntries(ids.map(id => [id, m?.ratings?.[id] ?? 3])),
    risk: m?.risk_appetite || null, gut: m?.gut_pick || null, concern: m?.concern || ""
  };
  inputStep = 1;
  render();
}
function vInput() {
  if (!draft) return startInput();
  const total = 4;
  const prog = el("div", "progress"); for (let i = 1; i <= total; i++) prog.append(el("i", i <= inputStep ? "on" : ""));
  const f = el("form", "stack-sm"); f.noValidate = true; f.style.gap = "16px";
  const m = el("div", "meta"); m.append(el("span", null, t("step", { n: inputStep, total })));
  f.append(prog, m);
  const st = el("p", "status err"); st.setAttribute("role", "status");
  const row = el("div", "actions");
  if (inputStep > 1) row.append(btn(t("back"), "ghost", () => { inputStep--; render(); }));
  else if (S.mine || S.role === "owner") row.append(btn(t("back"), "ghost", () => { inputStep = 0; draft = null; render(); }));
  const next = el("button", "btn", inputStep === total ? t("send") : t("next")); next.type = "submit";
  row.append(next);

  if (inputStep === 1) {
    const note = el("p", "note"); note.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
    note.append(el("span", null, t("privacy")));
    const list = el("div");
    S.room.criteria.forEach(c => {
      const r = el("div", "rate"); r.setAttribute("role", "group");
      const nm = contentLang(el("span", "rate-name", c.label)); nm.id = "rn-" + c.id; r.setAttribute("aria-labelledby", nm.id);
      const sc = el("div", "scale");
      const draw = () => sc.replaceChildren(...SCALE.map(v => {
        const b = el("button", null, t("scale_" + v)); b.type = "button"; b.setAttribute("aria-pressed", String(draft.ratings[c.id] === v));
        b.onclick = () => { draft.ratings[c.id] = v; draw(); };
        return b;
      }));
      draw();
      r.append(nm, sc);
      list.append(r);
    });
    f.append(el("h1", "step-title", t("in_rate_title")), note, list);
  } else if (inputStep === 2) {
    const ch = el("div", "choices");
    const draw = () => ch.replaceChildren(...RISKS.map(k => choice(t("risk_" + k), t("risk_" + k + "_hint"), draft.risk === k, () => { draft.risk = k; draw(); say(st, ""); })));
    draw();
    f.append(el("h1", "step-title", t("in_risk_title")), ch);
  } else if (inputStep === 3) {
    const ch = contentLang(el("div", "choices"));
    const draw = () => ch.replaceChildren(...S.room.options.map(o => choice(o.label, null, draft.gut === o.id, () => { draft.gut = o.id; draw(); say(st, ""); })));
    draw();
    f.append(el("h1", "step-title", t("in_gut_title")), el("p", "small", t("in_gut_hint")), ch);
  } else {
    const inp = el("input", "line"); Object.assign(inp, { maxLength: 280, placeholder: t("concern_ph"), value: draft.concern, autocomplete: "off" });
    inp.setAttribute("aria-label", t("in_concern_title"));
    inp.oninput = () => { draft.concern = inp.value; };
    const title = el("h1", "step-title", t("in_concern_title"));
    f.append(title, el("p", "small", t("in_concern_hint") + " (" + t("optional") + ")"), inp);
    setTimeout(() => inp.focus(), 50);
  }
  f.append(st, row);
  f.onsubmit = async e => {
    e.preventDefault();
    if (inputStep === 2 && !draft.risk) return say(st, t("need_pick"));
    if (inputStep === 3 && !draft.gut) return say(st, t("need_pick"));
    if (inputStep < total) { inputStep++; render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    next.disabled = true; next.textContent = t("sending");
    const ids = S.room.criteria.map(c => c.id);
    try {
      await store.save({ ratings: draft.ratings, weights: Rooms.apportion(ids, draft.ratings, 100), risk_appetite: draft.risk, gut_pick: draft.gut, concern: draft.concern.trim() });
      inputStep = 0; draft = null;
      await refresh();
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (err) {
      const k = Rooms.errKey(err, ["room_not_open"]);
      say(st, t(k === "room_not_open" ? "closed" : k));
      next.disabled = false; next.textContent = t("send");
    }
  };
  show(questionCard(), card("you", f));
}

/* ---------- Waiting: who has answered, and Decide now ---------- */
function vWaiting() {
  const r = S.room, owner = S.role === "owner";
  const answering = S.roster.filter(p => p.role !== "observer");
  const done = answering.filter(p => p.submitted).length;
  const head = el("p", "text sm", owner ? t("wait_title_owner") : S.mine ? t("wait_title_member") : t("observer"));
  const meter = el("div", "meter"); const fill = el("i"); fill.style.width = (answering.length ? done / answering.length * 100 : 0) + "%"; meter.append(fill);
  const list = el("ul", "roster");
  answering.forEach(p => {
    const li = el("li");
    const who = el("span", "who", p.name || "·"); if (p.me) who.append(el("span", "me", " (" + t("you") + ")"));
    li.append(who, el("span", "st" + (p.submitted ? " done" : ""), p.submitted ? t("answered") : t("not_yet")));
    list.append(li);
  });
  const status = el("div", "block"); status.append(el("h3", null, t("wait_progress", { n: done, total: answering.length })), meter, list);
  const main = card("you", head, status);

  if (S.role !== "observer") {
    if (!S.mine) main.append(btn(t("give_answers"), owner ? "soft" : "", startInput));
    else if (r.status === "open") { const l = el("button", "linkbtn", t("edit_answers")); l.type = "button"; l.onclick = startInput; main.append(l); }
  }
  if (owner) {
    const st = el("p", "status err"); st.setAttribute("role", "status");
    if (r.decide_error) say(st, t(r.decide_error === "rooms_not_configured" ? "rooms_not_configured" : "decide_failed"));
    const ready = done >= r.quorum;
    const d = btn(t("decide_now"), "", async () => {
      d.disabled = true; say(st, "");
      try { await store.decide(); S.room.status = "deciding"; render(); }
      catch (err) { d.disabled = false; say(st, t(["need_more_inputs", "rooms_not_configured", "room_not_open"].includes(err.message) ? err.message : "err_generic", { need: r.quorum })); }
    });
    d.disabled = !ready;
    main.append(d);
    if (!ready) main.append(el("p", "small", t("decide_need", { need: r.quorum })));
    main.append(st);
  } else if (S.mine) {
    main.append(el("p", "small", t("wait_hint_member")));
  }
  if (params.get("files") === "failed") main.append(el("p", "status err", t("files_failed")));
  const cards = [questionCard(), main];
  // A brand-new room puts the invite first; after that it sits under the progress.
  if (owner && S.invite) cards.splice(params.get("new") && !done ? 1 : 2, 0, shareCard(done < answering.length));
  if (Rooms.isGuest() && S.mine) cards.push(saveCard());
  show(...cards);
}
function shareCard(withNudge) {
  const link = `${location.origin}/room.html?join=${encodeURIComponent(S.invite)}`;
  const me = S.roster.find(p => p.me)?.name;
  const q = S.room.question;
  const msg = me ? t("invite_msg", { name: me, question: q, link }) : t("invite_msg_anon", { question: q, link });
  const links = Rooms.shareLinks(msg, t("invite_subject", { question: q }));
  const box = el("div", "linkbox");
  const inp = el("input", "line"); inp.readOnly = true; inp.value = link; inp.setAttribute("aria-label", t("share_title"));
  const copy = btn(t("copy"), "soft", async () => { await Rooms.copyText(link); copy.textContent = t("copied"); setTimeout(() => { copy.textContent = t("copy"); }, 1600); });
  box.append(inp, copy);
  const row = el("div", "share");
  const wa = el("a", "btn ghost", t("whatsapp")); wa.href = links.whatsapp; wa.target = "_blank"; wa.rel = "noopener";
  const em = el("a", "btn ghost", t("email_btn")); em.href = links.email;
  row.append(wa, em);
  if (navigator.share) row.append(btn(t("share"), "ghost", () => navigator.share({ text: msg }).catch(() => {})));
  const c = card("you", el("p", "text sm", t("share_title")), el("p", "small", t("share_hint")), box, row);
  if (withNudge && S.roster.some(p => p.submitted && !p.me)) {
    const nudge = el("a", "linkbtn", t("nudge")); nudge.href = Rooms.shareLinks(t("reminder_msg", { question: q, link }), "").whatsapp; nudge.target = "_blank"; nudge.rel = "noopener";
    c.append(nudge);
  }
  return c;
}
// Guests (joined with just a name) can add an email to keep the room on other devices.
function saveCard() {
  const box = el("div", "stack-sm");
  const c = card("you", el("p", "text sm", t("save_title")), el("p", "small", t("save_hint")));
  const open = el("button", "linkbtn", t("email_lbl") + " →"); open.type = "button";
  open.onclick = () => { open.remove(); Rooms.emailCode(box, { onDone: email => { c.replaceChildren(el("p", "status ok", t("save_done", { email }))); } }); };
  c.append(open, box);
  return c;
}

/* ---------- Thinking ---------- */
function vThinking() {
  show(questionCard(), card("you", el("p", "text sm thinking", t("thinking")), el("p", "small", t("thinking_hint"))));
}

/* ---------- Verdict ---------- */
function vVerdict() {
  const a = S.analysis, v = a.verdict || {}, map = a.disagreement_map || {}, r = S.room;
  const settled = ["decided", "reviewed"].includes(r.status);
  const owner = S.role === "owner";
  const cards = [];

  const pills = el("div", "pills");
  pills.append(el("span", "pill strong", t("conf_" + (a.confidence || "Medium"))));
  if (v.split) pills.append(el("span", "pill", t("v_split")));
  const top = card("active", meta(t("v_call"), t("type_" + r.type)), contentLang(el("p", "text", v.headline || v.call_label)),
    contentLang(el("p", "body", "→ " + (v.call_label || optLabel(v.call)))), pills);
  cards.push(top);

  // The owner settles the call; everyone else sees it once settled.
  if (settled) {
    cards.push(card("outline", el("h3", null, t("v_final")), contentLang(el("p", "text sm", optLabel(a.final_option || v.call))),
      el("p", "small", a.owner_decision === "overridden" ? t("v_overridden", { reason: a.override_reason || "" }) : t("v_accepted"))));
  } else if (owner) {
    const st = el("p", "status err"); st.setAttribute("role", "status");
    const pick = el("div", "stack-sm"); pick.hidden = true;
    let chosen = null;
    const opts = contentLang(el("div", "choices"));
    const drawOpts = () => opts.replaceChildren(...r.options.filter(o => o.id !== v.call).map(o => choice(o.label, null, chosen === o.id, () => { chosen = o.id; drawOpts(); })));
    drawOpts();
    const why = el("input", "line"); Object.assign(why, { maxLength: 300, placeholder: t("v_override_why") });
    why.setAttribute("aria-label", t("v_override_why"));
    const confirm = btn(t("v_override_save"), "", async () => {
      if (!chosen) return say(st, t("need_pick"));
      if (!why.value.trim()) { why.focus(); return say(st, t("need_reason")); }
      confirm.disabled = true;
      try { await store.settle("overridden", why.value.trim(), chosen); await refresh(); }
      catch { confirm.disabled = false; say(st, t("err_generic")); }
    });
    pick.append(el("h3", null, t("v_override_pick")), opts, why, confirm);
    const accept = btn(t("v_accept"), "", async () => {
      accept.disabled = true;
      try { await store.settle("accepted"); await refresh(); }
      catch { accept.disabled = false; say(st, t("err_generic")); }
    });
    const other = el("button", "linkbtn", t("v_override")); other.type = "button";
    other.onclick = () => { pick.hidden = !pick.hidden; };
    cards.push(card("you", el("p", "text sm", t("v_owner_title")), accept, other, pick, st));
  } else {
    cards.push(card("you", el("p", "small", t("v_waiting_owner"))));
  }

  if (v.check_first) cards.push(card("outline", el("h3", null, t("v_check")), contentLang(el("p", "body", v.check_first))));

  const why = card("");
  const listOf = (title, xs) => { if (!xs?.length) return; const b = el("div", "block"); const ul = contentLang(el("ul", "dots")); xs.forEach(x => ul.append(el("li", null, x))); b.append(el("h3", null, title), ul); why.append(b); };
  const para = (title, text) => { if (!text) return; const b = el("div", "block"); b.append(el("h3", null, title), contentLang(el("p", "body", text))); why.append(b); };
  listOf(t("v_why"), v.reasons); listOf(t("v_risks"), v.risks);
  para(t("v_disappoints"), v.disappoints); para(t("v_onboard"), v.bring_on_board);
  if (why.childElementCount) cards.push(why);

  cards.push(mapCard(map, v.call));

  const facts = a.frame?.facts || [];
  if (facts.length) {
    const ul = contentLang(el("ul", "plain facts"));
    facts.forEach(f => {
      const li = el("li", null, f.text);
      if (f.source || f.url) {
        const s = el("span", "src");
        if (f.url) { const link = el("a", null, f.source || new URL(f.url).hostname); link.href = f.url; link.target = "_blank"; link.rel = "noopener noreferrer"; s.append(link); }
        else s.textContent = f.source;
        li.append(s);
      }
      ul.append(li);
    });
    cards.push(card("", el("h3", null, t("v_facts")), ul));
  }
  if (settled && S.role !== "observer") cards.push(signOffCard());
  if (["finance", "politics"].includes(r.type)) cards.push(el("p", "small", t("advice_note")));
  show(...cards);
}
function mapCard(map, call) {
  const c = card("", el("h3", null, t("v_map")));
  const side = document.documentElement.dir === "rtl" ? "right" : "left";
  if (map.weights?.length) {
    const b = el("div", "bars"); b.append(el("p", "lbl", t("map_weights")));
    map.weights.forEach(w => {
      const row = el("div", "range");
      const top = el("div", "range-top"); top.append(contentLang(el("span", null, w.label)), el("span", "tag" + (w.split ? " split" : ""), t(w.split ? "map_split" : "map_agree")));
      const trk = el("div", "range-trk"); const span = el("i"); const avg = el("b");
      span.style[side] = w.min + "%"; span.style.width = Math.max(1, w.max - w.min) + "%"; avg.style[side] = w.avg + "%";
      trk.append(span, avg);
      row.append(top, trk);
      b.append(row);
    });
    c.append(b);
  }
  if (map.winners) {
    const b = el("div", "bars"); b.append(el("p", "lbl", t("map_leans")));
    const total = Math.max(1, map.members || 1);
    S.room.options.forEach(o => {
      const row = el("div", "lean" + (o.id === call ? " call" : ""));
      const top = el("div", "lean-top"); top.append(contentLang(el("span", null, o.label)), el("span", "n", t("map_lean", { n: map.winners[o.id] || 0, g: map.gut?.[o.id] || 0 })));
      const trk = el("div", "lean-trk"); const fill = el("i"); fill.style.width = ((map.winners[o.id] || 0) / total * 100) + "%"; trk.append(fill);
      row.append(top, trk);
      b.append(row);
    });
    c.append(b);
  }
  if (map.themes?.length) {
    const b = el("div", "block"); b.append(el("p", "lbl", t("map_themes")));
    map.themes.forEach(th => {
      const d = el("div", "theme " + th.kind);
      d.append(contentLang(el("span", "tt", th.theme)), el("span", "kind", t(th.kind === "facts" ? "theme_facts" : "theme_values")));
      b.append(d);
    });
    c.append(b);
  }
  return c;
}
function signOffCard() {
  const c = card("you", el("p", "text sm", t("so_title")));
  const counts = S.counts || {};
  const countLine = el("p", "small", t("so_counts", { agree: counts.agree || 0, commit: counts.disagree_commit || 0, object: counts.object || 0 }));
  const label = s => t({ agree: "so_agree", disagree_commit: "so_commit", object: "so_object" }[s]);
  if (S.signoff) { c.append(el("p", "status ok", t("so_done", { stance: label(S.signoff.stance) })), countLine); return c; }
  let stance = null;
  const ch = el("div", "choices");
  const draw = () => ch.replaceChildren(...["agree", "disagree_commit", "object"].map(s => choice(label(s), null, stance === s, () => { stance = s; draw(); })));
  draw();
  const note = el("input", "line"); Object.assign(note, { maxLength: 500, placeholder: t("so_note_ph") });
  note.setAttribute("aria-label", t("so_note_ph"));
  const st = el("p", "status err"); st.setAttribute("role", "status");
  const send = btn(t("so_send"), "", async () => {
    if (!stance) return say(st, t("need_pick"));
    send.disabled = true;
    try { await store.signOff(stance, note.value.trim()); await refresh(); }
    catch { send.disabled = false; say(st, t("err_generic")); }
  });
  c.append(ch, note, send, st, countLine);
  return c;
}

/* ======================= Flow ======================= */
function render() {
  clearTimeout(pollTimer);
  if (!S) return;
  if (!S.role) return notice(t("no_access"));
  document.title = (S.room.question.length > 50 ? S.room.question.slice(0, 50) + "…" : S.room.question) + " · Clarvy";
  const st = S.room.status;
  if (inputStep && st === "open" && S.role !== "observer") return vInput();
  if (st === "open") {
    if (!S.mine && S.role === "member") return startInput();   // members go straight to their answers
    vWaiting(); return poll();
  }
  if (!S.analysis) { vThinking(); return poll(); }
  vVerdict();
  if (st === "deciding") poll();
}
// While waiting on other people (or on Clarvy), check again every few seconds.
function poll() {
  if (demo) return;
  pollTimer = setTimeout(async () => {
    if (inputStep || document.hidden) return poll();
    const before = JSON.stringify([S.room.status, S.roster, !!S.analysis, S.room.decide_error]);
    try { const next = await store.load(); if (next && JSON.stringify([next.room.status, next.roster, !!next.analysis, next.room.decide_error]) !== before) { S = next; render(); return; } } catch {}
    poll();
  }, 5000);
}
async function refresh() {
  try { S = await store.load(); }
  catch (err) { console.error(err); return notice(t("err_generic")); }
  if (!S) return notice(t("no_access"));
  render();
}
Rooms.langToggle(() => {
  if (S) render();
  else if (joinToken || demo === "join") vJoin();
  else if (Rooms.sb && !Rooms.user) vSignIn();
});

async function start() {
  await Rooms.loadLang(Rooms.firstLang(demo === "ar" ? "ar" : null));
  notice(t("loading"), true);
  $("demoNote").hidden = !demo;
  if (demo) return demo === "join" ? vJoin() : refresh();
  if (!roomId && !joinToken) return notice(t("no_room"));
  if (!(await Rooms.connect())) return notice(t("not_setup"));
  if (Rooms.user) {
    const p = await Rooms.profile();
    if (p?.language && !Rooms.savedLang() && p.language !== Rooms.lang) await Rooms.loadLang(p.language);
  }
  if (joinToken && !roomId) return vJoin();
  if (!Rooms.user) return vSignIn();
  refresh();
}
start();
})();
</script>
