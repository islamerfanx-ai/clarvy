<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Give your private input to a Clarvy decision room.">
<title>My input · Clarvy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,300..600&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap">
<link rel="stylesheet" href="/rooms/rooms.css">
</head>
<body>
<main>
  <header class="top">
    <a class="wm" href="/">Clarvy</a>
    <div class="top-acts">
      <span class="pill" id="typePill" hidden></span>
      <button class="lang" type="button" id="langBtn"></button>
    </div>
  </header>

  <!-- Shown while loading, and for sign-in / access messages -->
  <article class="msg" id="notice">
    <div class="meta"><span data-t="from_clarvy">From: Clarvy</span></div>
    <p class="text thinking" id="noticeText">Opening the room</p>
    <form id="signin" hidden>
      <div class="field">
        <label class="lbl" for="email" data-t="signin_email">Your email</label>
        <input class="line" id="email" type="email" autocomplete="email" required>
      </div>
      <button class="btn" type="submit" data-t="signin_send">Email me a link</button>
      <p class="status" id="signinStatus" role="status" aria-live="polite"></p>
    </form>
  </article>

  <!-- Invite link: who's asking, then sign in and join -->
  <article class="msg active" id="joinCard" hidden>
    <div class="meta light"><span id="joinFrom"></span><span id="joinType"></span></div>
    <p class="text" id="joinQuestion"></p>
    <p class="small" id="joinObserver" data-t="join_observer" hidden style="color:rgba(255,255,255,.8)"></p>
  </article>
  <article class="msg you" id="joinActions" hidden>
    <label class="check" id="consentRow" hidden><input type="checkbox" id="consent"><span data-t="join_consent"></span></label>
    <button class="btn" type="button" id="joinBtn" data-t="join_btn">Join the room</button>
    <p class="status" id="joinStatus" role="status" aria-live="polite"></p>
  </article>

  <!-- The question and what the room knows -->
  <article class="msg active" id="questionCard" hidden>
    <div class="meta light"><span data-t="from_clarvy">From: Clarvy</span><span id="reviewOn"></span></div>
    <p class="text" id="question"></p>
    <details class="peek" id="know">
      <summary data-t="what_we_know">What we know</summary>
      <div class="block" id="contextBlock"><p class="body" id="context"></p></div>
      <div class="block"><h3 data-t="options">The options</h3><ul class="plain" id="optionList"></ul></div>
      <div class="block" id="filesBlock"><h3 data-t="files">Files</h3><ul class="plain" id="fileList"></ul></div>
      <div class="block"><h3 data-t="facts">Shared facts</h3><ul class="plain facts" id="factList"></ul><p class="small" id="noFacts" data-t="no_facts"></p></div>
    </details>
  </article>

  <!-- My input -->
  <article class="msg you" id="inputCard" hidden>
    <div class="meta"><span data-t="from_you">From: You</span><span data-t="time_hint">About 2 minutes</span></div>
    <p class="note" id="privateNote">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span data-t="private_note"></span>
    </p>
    <p class="small" id="lockedNote" hidden></p>
    <form id="inputForm" novalidate>
      <fieldset id="inputFields">
        <div class="field" role="group" aria-labelledby="weightsLbl">
          <div class="field-head">
            <span class="lbl" id="weightsLbl" data-t="weights">What matters to you</span>
            <button class="linkbtn" type="button" id="resetWeights" data-t="weights_reset">Use Clarvy's suggestion</button>
          </div>
          <p class="small" data-t="weights_hint"></p>
          <div class="alloc" id="alloc" aria-hidden="true"></div>
          <div class="block" id="crits"></div>
          <div class="total"><span data-t="total">Total</span><span id="total">100</span></div>
        </div>

        <div class="field" style="margin-top:26px">
          <span class="lbl" id="riskLbl" data-t="risk">How much risk can you live with?</span>
          <div class="chips" id="riskChips" role="group" aria-labelledby="riskLbl"></div>
        </div>

        <div class="field" style="margin-top:26px">
          <span class="lbl" id="gutLbl" data-t="gut">Your gut pick</span>
          <p class="small" data-t="gut_hint"></p>
          <div class="chips" id="gutChips" role="group" aria-labelledby="gutLbl"></div>
        </div>

        <div class="field" style="margin-top:26px">
          <label class="lbl" for="concern"><span data-t="concern">One concern</span> <span class="opt" data-t="optional">optional</span></label>
          <input class="line" id="concern" maxlength="280" autocomplete="off">
          <span class="count" id="concernCount" aria-hidden="true">0/280</span>
        </div>
      </fieldset>

      <p class="small" id="adviceNote" data-t="advice_note" hidden></p>
      <button class="btn" type="submit" id="send" data-t="send">Send my input</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </form>
  </article>

  <p class="small" id="demoNote" data-t="demo_note" hidden style="text-align:center;padding-top:8px"></p>
</main>

<script src="/rooms/rooms.js"></script>
<script>
(() => {
const { $, t, chip, PALETTE } = Rooms;
const params = new URLSearchParams(location.search);
let roomId = params.get("room");
const joinToken = params.get("join");
const demo = params.get("demo");
const RISKS = ["safe", "balanced", "bold"];

/* ---------- Data: Supabase when configured, an in-browser demo room otherwise ---------- */
const DEMO_ROOMS = {
  en: {
    id: "demo-en", type: "business", status: "open", language: "en", review_date: "2026-12-01",
    question: "Should we open a second location in Jeddah this year, or wait until next spring?",
    context: "The Riyadh shop does about 1.2M a month and has been profitable for 14 months.\nFit-out in Jeddah is roughly 4M. Two landlords have offered terms; one gives 6 months rent-free.",
    options: [{ id: "now", label: "Open in Jeddah this year" }, { id: "spring", label: "Wait until next spring" }, { id: "never", label: "Grow Riyadh instead" }],
    criteria: [{ id: "upside", label: "Upside", weight: 30 }, { id: "cash", label: "Cash risk", weight: 30 }, { id: "team", label: "Execution capacity", weight: 25 }, { id: "brand", label: "Brand fit", weight: 15 }],
    files: ["Riyadh P&L 2026.xlsx", "Landlord offers.pdf"],
    facts: [{ text: "Retail rents in central Jeddah rose about 9% this year.", source: "Local property report, Sep 2026" }]
  },
  ar: {
    id: "demo-ar", type: "finance", status: "open", language: "ar", review_date: "2026-12-15",
    question: "هل نأخذ قرضًا بنكيًا للتوسّع، أم نطرح حصة للمستثمرين، أم نموّل أنفسنا؟",
    context: "الإيرادات السنوية 18 مليونًا وهامش الربح 14٪.\nعرض البنك بفائدة 7.5٪ لخمس سنوات، ومستثمر مهتم بحصة 20٪.",
    options: [{ id: "loan", label: "قرض بنكي" }, { id: "equity", label: "حصة للمستثمرين" }, { id: "self", label: "تمويل ذاتي" }],
    criteria: [{ id: "cost", label: "تكلفة رأس المال", weight: 30 }, { id: "control", label: "السيطرة على القرار", weight: 30 }, { id: "downside", label: "الحماية من الخسارة", weight: 25 }, { id: "liquidity", label: "السيولة", weight: 15 }],
    files: ["القوائم المالية 2026.pdf"],
    facts: []
  }
};

const store = {
  async room() {
    if (demo) { const r = DEMO_ROOMS[demo === "ar" ? "ar" : "en"]; return { room: r, role: "member", files: r.files, facts: r.facts }; }
    const sb = Rooms.sb, me = Rooms.user.id;
    const { data: room, error } = await sb.from("rooms")
      .select("id,type,question,context,options,criteria,status,language,review_date").eq("id", roomId).maybeSingle();
    if (error) throw error;
    if (!room) return null; // RLS hides rooms you're not in
    const [mem, files, analysis] = await Promise.all([
      sb.from("memberships").select("role").eq("room_id", roomId).eq("user_id", me).maybeSingle(),
      sb.from("attachments").select("file_name").eq("room_id", roomId).order("created_at"),
      sb.from("analyses").select("frame").eq("room_id", roomId).order("created_at", { ascending: false }).limit(1).maybeSingle()
    ]);
    const facts = Array.isArray(analysis.data?.frame?.facts) ? analysis.data.frame.facts : [];
    return { room, role: mem.data?.role, files: (files.data || []).map(f => f.file_name), facts };
  },
  async myInput() {
    if (demo) { try { return JSON.parse(localStorage.getItem("clarvy-demo-input-" + demo)); } catch { return null; } }
    const { data } = await Rooms.sb.from("inputs").select("weights,risk_appetite,gut_pick,concern").eq("room_id", roomId).eq("user_id", Rooms.user.id).maybeSingle();
    return data;
  },
  async save(input) {
    if (demo) { try { localStorage.setItem("clarvy-demo-input-" + demo, JSON.stringify(input)); } catch {} return; }
    const { error } = await Rooms.sb.from("inputs").upsert({ room_id: roomId, user_id: Rooms.user.id, ...input }, { onConflict: "room_id,user_id" });
    if (error) throw error;
  }
};

const suggested = room => Rooms.apportion(room.criteria.map(c => c.id), Object.fromEntries(room.criteria.map(c => [c.id, Number(c.weight) || 0])), 100);

/* ---------- Screen ---------- */
let state = null;   // { room, role, files, facts, weights, risk, gut, saved }
let invite = null;  // invite_preview row while joining

function notice(msg, { thinking = false, signin = false } = {}) {
  $("notice").hidden = false;
  $("noticeText").textContent = msg;
  $("noticeText").classList.toggle("thinking", thinking);
  $("signin").hidden = !signin;
  $("questionCard").hidden = $("inputCard").hidden = true;
}

/* ---------- Joining with an invite link ---------- */
function renderJoin() {
  $("joinCard").hidden = false;
  $("joinFrom").textContent = invite.owner_name ? t("join_from", { name: invite.owner_name }) : t("join_anon");
  $("joinType").textContent = t("type_" + invite.type);
  $("joinQuestion").textContent = invite.question;
  $("joinQuestion").dir = invite.language === "ar" ? "rtl" : "ltr";
  $("joinObserver").hidden = invite.role !== "observer";
  $("consentRow").hidden = !invite.named_views;
  document.title = t("join_btn") + " · Clarvy";
}
$("joinBtn").addEventListener("click", async () => {
  $("joinBtn").disabled = true; $("joinStatus").textContent = t("joining"); $("joinStatus").className = "status";
  const { data, error } = await Rooms.sb.rpc("join_room", { invite_token: joinToken, consent: $("consent").checked });
  if (error) {
    $("joinStatus").textContent = t(Rooms.errKey(error, ["invite_expired", "invite_not_found"]));
    $("joinStatus").className = "status err"; $("joinBtn").disabled = false;
    return;
  }
  roomId = data;
  history.replaceState(null, "", "?room=" + encodeURIComponent(roomId));
  $("joinCard").hidden = $("joinActions").hidden = true;
  invite = null;
  openRoom();
});

/* ---------- The room and my input ---------- */
function renderRoom({ room, files, facts }) {
  $("notice").hidden = true;
  $("questionCard").hidden = $("inputCard").hidden = false;
  document.title = t("page_title");
  // Room content is in the owner's language; set its direction separately from the interface.
  const contentDir = room.language === "ar" ? "rtl" : "ltr";
  ["question", "contextBlock", "optionList", "factList", "crits", "gutChips"].forEach(id => { $(id).dir = contentDir; $(id).lang = room.language; });
  $("typePill").hidden = false;
  $("typePill").textContent = t("type_" + room.type);
  $("reviewOn").textContent = room.review_date
    ? t("review_on", { date: new Date(room.review_date + "T00:00:00").toLocaleDateString(Rooms.lang === "ar" ? "ar-u-nu-latn" : "en-GB", { day: "numeric", month: "short", year: "numeric" }) })
    : "";
  $("question").textContent = room.question;
  $("context").textContent = room.context || "";
  $("contextBlock").hidden = !room.context;
  $("optionList").replaceChildren(...room.options.map(o => Object.assign(document.createElement("li"), { textContent: o.label })));
  $("filesBlock").hidden = !files.length;
  $("fileList").replaceChildren(...files.map(n => { const li = document.createElement("li"); li.className = "file"; li.textContent = n; return li; }));
  $("factList").replaceChildren(...facts.map(f => {
    const li = document.createElement("li"); li.textContent = f.text || String(f);
    if (f.source) { const s = document.createElement("span"); s.className = "small"; s.style.display = "block"; s.textContent = f.source; li.append(s); }
    return li;
  }));
  $("noFacts").hidden = facts.length > 0;
  $("adviceNote").hidden = !["finance", "politics"].includes(room.type);
}

function renderCrits() {
  const { room } = state;
  $("crits").replaceChildren(...room.criteria.map((c, i) => {
    const row = document.createElement("div"); row.className = "crit";
    const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = PALETTE[i % PALETTE.length];
    const nm = document.createElement("label"); nm.className = "nm"; nm.htmlFor = "w-" + c.id; nm.textContent = c.label;
    const out = document.createElement("output"); out.id = "o-" + c.id; out.htmlFor = "w-" + c.id;
    const r = document.createElement("input");
    Object.assign(r, { type: "range", min: 0, max: 100, step: 1, id: "w-" + c.id });
    r.style.setProperty("--c", PALETTE[i % PALETTE.length]);
    r.addEventListener("input", () => { state.weights = Rooms.rebalance(state.weights, c.id, Number(r.value)); syncWeights(); dirty(); });
    row.append(dot, nm, out, r);
    return row;
  }));
  syncWeights();
}

function syncWeights() {
  const { room, weights } = state;
  $("alloc").replaceChildren(...room.criteria.map((c, i) => {
    const seg = document.createElement("i"); seg.style.width = weights[c.id] + "%"; seg.style.background = PALETTE[i % PALETTE.length]; return seg;
  }));
  room.criteria.forEach(c => {
    const r = $("w-" + c.id); r.value = weights[c.id]; r.style.setProperty("--p", weights[c.id] + "%");
    r.setAttribute("aria-valuetext", weights[c.id] + " / 100");
    $("o-" + c.id).textContent = weights[c.id];
  });
  $("total").textContent = Object.values(weights).reduce((a, b) => a + b, 0);
}

function renderChoices() {
  $("riskChips").replaceChildren(...RISKS.map(k => chip(t("risk_" + k), state.risk === k, () => { state.risk = k; renderChoices(); dirty(); })));
  $("gutChips").replaceChildren(...state.room.options.map(o => chip(o.label, state.gut === o.id, () => { state.gut = o.id; renderChoices(); dirty(); })));
}

function renderForm() {
  const locked = state.room.status !== "open" || state.role === "observer";
  $("inputFields").disabled = locked;
  $("send").hidden = locked;
  $("lockedNote").hidden = !locked;
  $("lockedNote").textContent = state.role === "observer" ? t("observer") : locked ? t("closed") : "";
  $("privateNote").hidden = state.role === "observer";
  $("inputForm").hidden = state.role === "observer";
  $("send").textContent = t(state.saved ? "update" : "send");
  renderCrits(); renderChoices();
}

function dirty() { setStatus(""); $("send").disabled = false; }
function setStatus(msg, kind = "") { $("status").textContent = msg; $("status").className = "status " + kind; }

$("concern").addEventListener("input", () => { $("concernCount").textContent = $("concern").value.length + "/280"; dirty(); });
$("resetWeights").addEventListener("click", () => { state.weights = suggested(state.room); syncWeights(); dirty(); });

$("inputForm").addEventListener("submit", async e => {
  e.preventDefault();
  if (!state.risk) return setStatus(t("need_risk"), "err");
  if (!state.gut) return setStatus(t("need_gut"), "err");
  $("send").disabled = true; setStatus(t("sending"));
  try {
    await store.save({ weights: state.weights, risk_appetite: state.risk, gut_pick: state.gut, concern: $("concern").value.trim() });
    state.saved = true;
    $("send").textContent = t("update");
    setStatus(t("sent"), "ok");
  } catch (err) {
    const key = Rooms.errKey(err, ["room_not_open"]);
    setStatus(t(key === "room_not_open" ? "closed" : key), "err");
    $("send").disabled = false;
  }
});

Rooms.langToggle(() => {
  if (state) { renderRoom(state); renderForm(); if (state.saved) $("send").textContent = t("update"); }
  else if (invite) renderJoin();
  if (!$("signin").hidden) $("noticeText").textContent = t(joinToken && !roomId ? "signin_title_join" : "signin_title");
});
Rooms.signInForm($("signin"), $("email"), $("signinStatus"));

async function openRoom() {
  notice(t("loading"), { thinking: true });
  try {
    const data = await store.room();
    if (!data || !data.role) return notice(t("no_access"));
    const mine = await store.myInput();
    const ids = data.room.criteria.map(c => c.id);
    const keep = mine?.weights && ids.every(id => Number.isInteger(mine.weights[id])) && ids.reduce((s, id) => s + mine.weights[id], 0) === 100;
    state = {
      ...data,
      weights: keep ? Object.fromEntries(ids.map(id => [id, mine.weights[id]])) : suggested(data.room),
      risk: mine?.risk_appetite || null,
      gut: mine?.gut_pick || null,
      saved: !!mine
    };
    $("concern").value = mine?.concern || "";
    $("concernCount").textContent = $("concern").value.length + "/280";
    renderRoom(state); renderForm();
    if (mine) $("send").disabled = true;
  } catch (err) {
    console.error(err);
    notice(t("err_generic"));
  }
}

async function start() {
  await Rooms.loadLang(Rooms.firstLang(demo === "ar" ? "ar" : null));
  notice(t("loading"), { thinking: true });
  $("demoNote").hidden = !demo;
  if (demo) return openRoom();
  if (!roomId && !joinToken) return notice(t("no_room"));
  if (!(await Rooms.connect())) return notice(t("not_setup"));
  if (Rooms.user) {
    const p = await Rooms.profile();
    if (p?.language && !Rooms.savedLang() && p.language !== Rooms.lang) await Rooms.loadLang(p.language);
  }
  if (joinToken && !roomId) {
    const { data, error } = await Rooms.sb.rpc("invite_preview", { invite_token: joinToken });
    invite = !error && data && data[0];
    if (!invite) return notice(t("invite_not_found"));
    if (!invite.usable) return notice(t("invite_expired"));
    renderJoin();
    if (!Rooms.user) return notice(t("signin_title_join"), { signin: true });
    $("notice").hidden = true;
    $("joinActions").hidden = false;
    return;
  }
  if (!Rooms.user) return notice(t("signin_title"), { signin: true });
  openRoom();
}
start();
})();
</script>
</body>
</html>
