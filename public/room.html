<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A decision room: give your view privately, then see the group's call.">
<title>Decision Rooms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,300..600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/rooms/rooms.css">
</head>
<body>
<main>
  <header class="top">
    <a class="wm" href="/">Decision Rooms</a>
    <div class="top-acts">
      <a class="navlink" id="myRoomsLink" href="/dashboard.html" data-t="my_rooms" hidden>My rooms</a>
      <button class="lang" type="button" id="langBtn"></button>
    </div>
  </header>
  <div id="view" style="display:flex;flex-direction:column;gap:8px" aria-live="polite">
    <article class="msg"><p class="text thinking">One moment</p></article>
  </div>
  <p class="small" id="demoNote" data-t="demo_note" hidden style="text-align:center;padding-top:8px"></p>
</main>

<script src="/rooms/rooms.js"></script>
<script>
(() => {
const { $, el, t, choice } = Rooms;
const params = new URLSearchParams(location.search);
let roomId = params.get("room");
const joinToken = params.get("join");
const demo = params.get("demo");
const RISKS = ["safe", "balanced", "bold"];
const SCALE = [1, 2, 3, 4, 5];
let MODELS = {};   // rooms/models.js, loaded at start (framework names for the verdict)
let MATH = null;   // rooms/math.js, for "The numbers" panel

/* ======================= Data: live (Supabase) ======================= */
const live = {
  async preview() {
    const { data, error } = await Rooms.sb.rpc("invite_preview", { invite_token: joinToken });
    // The owner sees that the link was opened (people are told on the join page).
    if (!error && data?.[0]?.usable) Rooms.sb.rpc("invite_opened", { invite_token: joinToken }).then(() => {}, () => {});
    return !error && data && data[0] || null;
  },
  async load() {
    const sb = Rooms.sb, me = Rooms.user.id;
    const { data: room, error } = await sb.from("rooms")
      .select("id,type,type_label,question,context,options,criteria,status,language,review_date,quorum,decide_error,model,rapid,links,org_type,org_label,roles,override_rule,override_role_id,strict_confidential,report_mode,decide_stage,decide_by,auto_nudge,department_ids").eq("id", roomId).maybeSingle();
    if (error) throw error;
    if (!room) return null; // row-level security hides rooms you're not in
    const [mem, mine, roster, an, files] = await Promise.all([
      sb.from("memberships").select("role,role_id").eq("room_id", roomId).eq("user_id", me).maybeSingle(),
      sb.from("inputs").select("ratings,weights,risk_appetite,gut_pick,concern,links,role_answer,role_files,comments").eq("room_id", roomId).eq("user_id", me).maybeSingle(),
      sb.rpc("room_roster", { rid: roomId }),
      sb.from("analyses").select("frame,outcomes,disagreement_map,verdict,confidence,owner_decision,override_reason,final_option").eq("room_id", roomId).order("created_at", { ascending: false }).limit(1).maybeSingle(),
      sb.from("attachments").select("file_name").eq("room_id", roomId).order("created_at")
    ]);
    // Not a member: maybe the owner's assistant (they run the process, never answer or decide).
    let role = mem.data?.role, level = null;
    if (!role) { const { data: lv } = await sb.rpc("my_assist_level", { rid: roomId }); if (lv) { role = "assistant"; level = lv; } }
    const { data: setupBy } = await sb.rpc("room_setup_by", { rid: roomId });
    if (room.department_ids?.length) { const { data: dp } = await sb.rpc("room_departments", { rid: roomId }); room.__depts = dp || []; }
    const out = { departments: room.__depts || [], setupBy: setupBy || null, level, room, role, roleId: mem.data?.role_id || null, mine: mine.data, roster: (roster.data || []).map(r => ({ ...r, me: r.user_id === me })), analysis: an.data, files: (files.data || []).map(f => f.file_name) };
    if (role === "owner" || (role === "assistant" && level !== "view")) {
      out.invites = await this.invites(room);
      const [{ data: nd }, { data: note }, { data: log }] = await Promise.all([sb.rpc("room_nudges", { rid: roomId }),
        role === "owner" ? sb.from("notes").select("id,body").eq("room_id", roomId).eq("user_id", me).maybeSingle() : Promise.resolve({ data: null }),
        role === "owner" ? sb.rpc("room_assistant_log", { rid: roomId }) : Promise.resolve({ data: [] })]);
      out.nudges = nd || []; out.note = note || null; out.assistLog = log || [];
    }
    if (an.data) {
      const { data: plan } = await sb.from("plan_items").select("id,kind,title,note,assignee,owner_label,due_date,status,position").eq("room_id", roomId).order("due_date", { ascending: true, nullsFirst: false }).order("position");
      out.plan = plan || [];
    }
    if (room.rapid) {
      const { data: obj } = await sb.from("objections").select("id,user_id,reason,status,override_reason,created_at,option_id").eq("room_id", roomId).order("created_at");
      out.objections = obj || [];
    }
    if (["decided", "reviewed"].includes(room.status)) {
      const [so, counts] = await Promise.all([
        sb.from("signoffs").select("stance,note").eq("room_id", roomId).eq("user_id", me).maybeSingle(),
        sb.rpc("signoff_counts", { rid: roomId })
      ]);
      out.signoff = so.data;
      out.counts = Object.fromEntries((counts.data || []).map(c => [c.stance, Number(c.n)]));
      // Review: where it stands, the logged reviews, and my own private rating for the open one.
      const [rs, sum] = await Promise.all([sb.rpc("review_state", { rid: roomId }), sb.rpc("review_summary", { rid: roomId })]);
      out.review = rs.data || null;
      out.reviews = sum.data || [];
      if (out.review?.round) {
        const { data: mine2 } = await sb.from("review_ratings").select("rating,note").eq("room_id", roomId).eq("user_id", me).eq("review_no", out.review.round).maybeSingle();
        out.myRating = mine2 || null;
      }
    }
    return out;
  },
  // The owner's invite links: one per role (or one for everyone), each made fresh if it expired.
  async invites(room) {
    const sb = Rooms.sb;
    // Rooms with personal invites list each person (joined or not); older rooms keep their role links.
    const { data: people } = await sb.from("invites").select("token,role_id,max_uses,uses,person_name,person_contact,joined_by,expires_at,opened_at")
      .eq("room_id", roomId).eq("revoked", false).not("person_name", "is", null).order("created_at");
    if (people?.length) return people;
    const { data } = await sb.from("invites").select("token,role_id,max_uses,uses").eq("room_id", roomId).eq("revoked", false)
      .gt("expires_at", new Date().toISOString()).order("created_at", { ascending: false });
    const roles = Array.isArray(room.roles) ? room.roles : [];
    const out = [];
    for (const r of roles.length ? roles : [null]) {
      let inv = (data || []).find(i => (i.role_id || null) === (r ? r.id : null));
      if (!inv) {
        const { data: made } = await sb.from("invites").insert({ room_id: roomId, created_by: Rooms.user.id, role_id: r ? r.id : null, max_uses: r ? r.max || null : null })
          .select("token,role_id,max_uses,uses").single();
        inv = made;
      }
      if (inv) out.push(inv);
    }
    return out;
  },
  // The owner adds someone from the room, until the call is made.
  async setAutoNudge(on) {
    const { error } = await Rooms.sb.from("rooms").update({ auto_nudge: on }).eq("id", roomId);
    if (error) throw error;
  },
  // The owner's private note on this room (one per room), and sharing a note into the room's context.
  async saveNote(body) {
    const { data, error } = await Rooms.sb.from("notes").upsert({ user_id: Rooms.user.id, room_id: roomId, body }, { onConflict: "user_id,room_id" }).select("id,body").single();
    if (error) throw error;
    return data;
  },
  async shareNote(text) {
    const { data: r } = await Rooms.sb.from("rooms").select("context").eq("id", roomId).single();
    const add = t("rn_shared_head", { date: Rooms.fmtDate(new Date().toISOString().slice(0, 10)) }) + "\n" + text.trim();
    const { error } = await Rooms.sb.from("rooms").update({ context: (r?.context ? r.context + "\n\n" : "") + add }).eq("id", roomId);
    if (error) throw error;
  },
  async addPerson(name, contact, roleId) {
    const { data, error } = await Rooms.sb.from("invites").insert({ room_id: roomId, created_by: Rooms.user.id, person_name: name, person_contact: contact || null, role_id: roleId || null, max_uses: 1 })
      .select("token,role_id,max_uses,uses,person_name,person_contact,joined_by,expires_at").single();
    if (error) throw error;
    Rooms.sb.from("contacts").upsert({ owner_id: Rooms.user.id, name, contact: contact || "", role_title: (S.room.roles || []).find(r => r.id === roleId)?.title || null, used_at: new Date().toISOString() }, { onConflict: "owner_id,name,contact" }).then(() => {});
    return data;
  },
  async setRoom(patch) {
    const { error } = await Rooms.sb.from("rooms").update(patch).eq("id", roomId);
    if (error) throw error;
    Object.assign(S.room, patch);
  },
  async join(name, email, consent) {
    if (!Rooms.hasAccount()) throw new Error("sign_in_first");
    const { data, error } = await Rooms.sb.rpc("join_room", { invite_token: joinToken, consent });
    if (error) throw error;
    return data;
  },
  async save(input) {
    const { error } = await Rooms.sb.from("inputs").upsert({ room_id: roomId, user_id: Rooms.user.id, ...input }, { onConflict: "room_id,user_id" });
    if (error) throw error;
  },
  decide: () => Rooms.decideNow(roomId),
  async settle(decision, reason, option) {
    const { error } = await Rooms.sb.rpc("decide_verdict", { rid: roomId, decision, reason: reason || null, option_id: option || null });
    if (error) throw error;
  },
  async signOff(stance, note) {
    const { error } = await Rooms.sb.from("signoffs").upsert({ room_id: roomId, user_id: Rooms.user.id, stance, note }, { onConflict: "room_id,user_id" });
    if (error) throw error;
  },
  // RAPID: the owner names roles; approvers can object, which pauses Decide now.
  async setRapidRole(uid, rapid_role) {
    const { error } = await Rooms.sb.from("memberships").update({ rapid_role }).eq("room_id", roomId).eq("user_id", uid);
    if (error) throw error;
  },
  async object(reason, option_id) {
    const { error } = await Rooms.sb.from("objections").insert({ room_id: roomId, user_id: Rooms.user.id, reason, option_id: option_id || null });
    if (error) throw error;
  },
  // Report share links (owner): the current one, a new one, or switch it off.
  async reportLink() {
    const { data } = await Rooms.sb.from("report_shares").select("token").eq("room_id", roomId).eq("revoked", false).order("created_at", { ascending: false }).limit(1).maybeSingle();
    return data?.token || null;
  },
  async createReport() {
    const { data, error } = await Rooms.sb.from("report_shares").insert({ room_id: roomId, created_by: Rooms.user.id }).select("token").single();
    if (error) throw error;
    return data.token;
  },
  // The follow-up plan: the owner writes it, an assignee moves their own items along.
  async addPlan(items) { const { error } = await Rooms.sb.from("plan_items").insert(items.map((x, i) => ({ room_id: roomId, created_by: Rooms.user.id, position: i, ...x }))); if (error) throw error; },
  async updatePlan(id, patch) { const { error } = await Rooms.sb.from("plan_items").update(patch).eq("id", id); if (error) throw error; },
  async removePlan(id) { const { error } = await Rooms.sb.from("plan_items").delete().eq("id", id); if (error) throw error; },
  async addLink(url) {
    const { data } = await Rooms.sb.from("rooms").select("links").eq("id", roomId).single();
    const links = (data?.links || []).filter(l => l?.url !== url).concat([{ url }]).slice(-10);
    const { error } = await Rooms.sb.from("rooms").update({ links }).eq("id", roomId);
    if (error) throw error;
    S.room.links = links;
  },
  async logReview(what, rating, lessons, next) {
    const { error } = await Rooms.sb.rpc("log_review", { rid: roomId, what_happened: what, rating, lessons, next_review: next || null });
    if (error) throw error;
  },
  async rate(round, rating, note) {
    const { error } = await Rooms.sb.from("review_ratings").upsert({ room_id: roomId, user_id: Rooms.user.id, review_no: round, rating, note }, { onConflict: "room_id,user_id,review_no" });
    if (error) throw error;
  },
  async stopReport(token) { const { error } = await Rooms.sb.from("report_shares").update({ revoked: true }).eq("token", token); if (error) throw error; },
  async withdraw(oid) { const { error } = await Rooms.sb.rpc("withdraw_objection", { oid }); if (error) throw error; },
  async overrule(oid, why) { const { error } = await Rooms.sb.rpc("override_objection", { oid, why }); if (error) throw error; }
};

/* ======================= Data: demo (in this browser only) ======================= */
const DEMO_ROOMS = {
  en: {
    id: "demo", type: "business", status: "open", language: "en", review_date: "2026-12-01", quorum: 2,
    question: "Should we open a second location in Jeddah this year, or wait until next spring?",
    context: "The Riyadh shop does about 1.2M a month and has been profitable for 14 months.\nFit-out in Jeddah is roughly 4M. One landlord offers 6 months rent-free.",
    options: [{ id: "o1", label: "Open in Jeddah this year" }, { id: "o2", label: "Wait until next spring" }, { id: "o3", label: "Grow Riyadh instead" }],
    criteria: [{ id: "c1", label: "Upside" }, { id: "c2", label: "Cash risk" }, { id: "c3", label: "Execution capacity" }, { id: "c4", label: "Brand fit" }]
  },
  ar: {
    id: "demo", type: "finance", status: "open", language: "ar", review_date: "2026-12-15", quorum: 2,
    question: "هل نأخذ قرضًا بنكيًا للتوسّع، أم نطرح حصة للمستثمرين، أم نموّل أنفسنا؟",
    context: "الإيرادات السنوية 18 مليونًا وهامش الربح 14٪.\nعرض البنك بفائدة 7.5٪ لخمس سنوات، ومستثمر مهتم بحصة 20٪.",
    options: [{ id: "o1", label: "قرض بنكي" }, { id: "o2", label: "حصة للمستثمرين" }, { id: "o3", label: "تمويل ذاتي" }],
    criteria: [{ id: "c1", label: "تكلفة رأس المال" }, { id: "c2", label: "السيطرة على القرار" }, { id: "c3", label: "الحماية من الخسارة" }, { id: "c4", label: "السيولة" }]
  }
};
function demoStore(kind) {
  const room = structuredClone(DEMO_ROOMS[kind === "ar" ? "ar" : "en"]);
  room.model = params.get("model") || "wrap";
  room.rapid = params.get("rapid") === "1";
  room.links = [{ url: "https://www.example.org/jeddah-retail-report" }];
  const withRoles = params.get("roles") === "1", withPeople = params.get("people") === "1";
  room.roles = withRoles ? [
    { id: "r1", title: "CFO", max: 1, ask: "Please add the fit-out cost, the cash runway after it, and what a 6-month delay would save.", rapid: room.rapid ? "approver" : null },
    { id: "r2", title: "Director", max: null, ask: "", rapid: null }] : [];
  room.org_type = withRoles ? "corporation" : null;
  const owner = kind === "owner";
  let role = kind === "join" ? null : owner ? "owner" : "member";
  let mine = null, analysis = null, signoff = null, myName = owner ? "Islam" : "Lina";
  const others = [
    { name: "Sara", input: { weights: { c1: 20, c2: 45, c3: 25, c4: 10 }, risk_appetite: "safe", gut_pick: "o2", concern: "Cash is thin until the Riyadh loan is paid off." } },
    { name: "Omar", input: { weights: { c1: 45, c2: 15, c3: 15, c4: 25 }, risk_appetite: "bold", gut_pick: "o1", concern: "A competitor could take the best Jeddah site first." } }
  ];
  const roles = { Sara: owner ? null : null, Omar: room.rapid ? "approver" : null };
  room.decide_by = params.get("late") ? "2026-10-01" : "2026-10-27";
  const people = [
    { token: "demo-1", role_id: withRoles ? "r1" : null, max_uses: 1, uses: 1, person_name: "Sara Haddad", person_contact: "sara@example.com", joined_by: "sara" },
    { token: "demo-2", role_id: withRoles ? "r2" : null, max_uses: 1, uses: 1, person_name: "Omar Nasser", person_contact: "+971 50 555 0101", joined_by: "omar" },
    { token: "demo-3", role_id: withRoles ? "r2" : null, max_uses: 1, uses: 0, person_name: "Kenji Watanabe", person_contact: "kenji@example.com", joined_by: null, opened_at: "2026-10-23T09:00:00Z" },
    { token: "demo-4", role_id: null, max_uses: 1, uses: 0, person_name: "Amara Okafor", person_contact: "amara@example.com", joined_by: null }];
  const objections = room.rapid ? [{ id: "x1", user_id: "omar", reason: "Legal hasn't cleared the lease terms yet.", status: "open", override_reason: null }] : [];
  const roster = () => [
    ...(role ? [{ user_id: "me", name: myName, role, rapid_role: null, submitted: !!mine, me: true, role_title: withRoles && !owner ? "CFO" : null }] : []),
    { user_id: "sara", name: "Sara", role: owner ? "member" : "owner", rapid_role: roles.Sara, submitted: true, me: false, role_title: withRoles && owner ? "CFO" : null },
    { user_id: "omar", name: "Omar", role: "member", rapid_role: roles.Omar, submitted: owner, me: false, role_title: withRoles ? "Director" : null }
  ];
  return {
    async preview() { return { room_id: "demo", type: room.type, question: room.question, language: room.language, owner_name: "Sara", named_views: false, role: "member", usable: true, role_title: withRoles ? "CFO" : null, role_ask: withRoles ? room.roles[0].ask : null, is_full: false,
      person_name: withPeople ? "Kenji Watanabe" : null, person_contact: withPeople ? "kenji@example.com" : null }; },
    async load() {
      const counts = signoff ? { agree: 1, [signoff.stance]: (signoff.stance === "agree" ? 2 : 1) } : { agree: 1 };
      const invites = !owner ? null : withPeople ? people : withRoles ? [{ token: "demo-cfo", role_id: "r1", max_uses: 1, uses: 0 }, { token: "demo-dir", role_id: "r2", max_uses: null, uses: 1 }] : [{ token: "demo-invite", role_id: null }];
      room.report_mode = "both";
      if (room.status === "decided" && params.get("review") === "1" && !this.reviews.length && !this.review) this.review = { round: 1, due: true, review_date: room.review_date, raters: 2 };
      return { room, role, roleId: withRoles && !owner ? "r1" : null, mine, roster: roster(), analysis, plan: this.plan, files: ["Riyadh P&L 2026.xlsx"], invites, nudges: owner ? [{ invite_token: "demo-3", user_id: null, n: 1 }] : [], signoff, counts, objections: room.rapid ? objections : undefined,
        review: this.review, reviews: this.reviews, myRating: this.myRating };
    },
    async join(name) { role = "member"; if (name) myName = name; return "demo"; },
    async setRapidRole(uid, r) { if (uid === "sara") roles.Sara = r; if (uid === "omar") roles.Omar = r; },
    async object(reason, option_id) { objections.push({ id: "x" + (objections.length + 1), user_id: "me", reason, option_id: option_id || null, status: "open" }); },
    async withdraw(oid) { const o = objections.find(x => x.id === oid); if (o) o.status = "withdrawn"; },
    reportToken: null,
    async reportLink() { return this.reportToken; },
    async createReport() { this.reportToken = "demo"; return "demo"; },
    async stopReport() { this.reportToken = null; },
    async overrule(oid, why) { const o = objections.find(x => x.id === oid); if (o) Object.assign(o, { status: "overridden", override_reason: why }); },
    async save(input) { mine = input; },
    async setAutoNudge(on) { room.auto_nudge = on; },
    async saveNote(body) { return { id: "demo-note", body }; },
    async shareNote(text) { room.context = (room.context ? room.context + "\n\n" : "") + text.trim(); },
    async addPerson(name, contact, roleId) { const x = { token: "demo-" + (people.length + 1), role_id: roleId || null, max_uses: 1, uses: 0, person_name: name, person_contact: contact || null, joined_by: null }; people.push(x); return x; },
    async setRoom(patch) { Object.assign(room, patch); },
    plan: [],
    async addPlan(items) { items.forEach((x, i) => this.plan.push({ id: "p" + (this.plan.length + 1), status: "todo", note: "", position: i, ...x })); },
    async updatePlan(id, patch) { Object.assign(this.plan.find(x => x.id === id) || {}, patch); },
    async removePlan(id) { this.plan = this.plan.filter(x => x.id !== id); },
    async addLink(url) { room.links.push({ url }); },
    async decide() {
      room.status = "deciding";
      // Walk through the same stages the server reports, a couple of seconds each.
      const stages = ["reading", ...(room.model === "cynefin" ? ["sensemaking"] : []), "facts", "math", "judging", "writing"];
      stages.forEach((st, i) => setTimeout(() => { room.decide_stage = st; thinkingUpdate(); }, i * 2600));
      setTimeout(async () => { room.decide_stage = null; analysis = await demoAnalysis(room, [mine, ...others.map(o => o.input)].filter(Boolean)); await refresh(); }, stages.length * 2600 + 800);
    },
    async settle(decision, reason, option) {
      const final = decision === "accepted" ? analysis.verdict.call : option;
      if (objections.some(o => o.status === "open" && (!o.option_id || o.option_id === final))) throw new Error("objection_open");
      Object.assign(analysis, { owner_decision: decision, override_reason: reason, final_option: decision === "accepted" ? analysis.verdict.call : option });
      room.status = "decided";
    },
    async signOff(stance, note) { signoff = { stance, note }; },
    // Review, in this browser: ?review=1 makes the review due as soon as the call is settled.
    review: null, reviews: [], myRating: null,
    async logReview(what, rating, lessons, next) {
      this.reviews.push({ review_no: this.reviews.length + 1, logged_at: new Date().toISOString(), what_happened: what, rating, lessons,
        plan_total: this.plan.filter(x => x.kind !== "review").length, plan_done: this.plan.filter(x => x.status === "done").length, plan_blocked: this.plan.filter(x => x.status === "blocked").length,
        raters: this.myRating ? 4 : 3, avg: this.myRating ? 3.8 : 3.7, min: 3, max: 5, notes: ["Cash held up better than we feared.", "The pop-up proved demand."] });
      room.status = "reviewed"; this.myRating = null;
      this.review = next ? { round: this.reviews.length + 1, due: false, review_date: next, raters: 0 } : null;
    },
    async rate(round, rating, note) { this.myRating = { rating, note }; }
  };
}
// The demo runs the real group math (rooms/math.js) on made-up scores, with a canned write-up.
async function demoAnalysis(room, inputs) {
  const M = await import("/rooms/math.js");
  const scores = { o1: { c1: 9, c2: 3, c3: 4, c4: 8 }, o2: { c1: 7, c2: 7, c3: 7, c4: 7 }, o3: { c1: 4, c2: 9, c3: 8, c4: 5 } };
  const outcomes = {
    o1: { best: { value: 10, odds: 25 }, likely: { value: 6, odds: 50 }, worst: { value: 1, odds: 25 } },
    o2: { best: { value: 8, odds: 30 }, likely: { value: 7, odds: 55 }, worst: { value: 4, odds: 15 } },
    o3: { best: { value: 6, odds: 30 }, likely: { value: 5, odds: 60 }, worst: { value: 4, odds: 10 } }
  };
  const m = M.roomMath({ options: room.options, criteria: room.criteria, scores, outcomes, inputs });
  const ar = room.language === "ar";
  return {
    confidence: m.capConfidence ? "Medium" : "High",
    frame: { facts: [{ text: ar ? "ارتفعت أسعار الفائدة على قروض الشركات 0.5٪ هذا العام." : "Retail rents in central Jeddah rose about 9% this year.", date: "2026-09", kind: "news", source: ar ? "تقرير مصرفي، سبتمبر 2026" : "Local property report, Sep 2026", url: null }] },
    verdict: {
      call: m.call, call_label: room.options.find(o => o.id === m.call).label,
      headline: ar ? "خذوا الخيار الأوسط الآن، وأعيدوا التقييم بعد ستة أشهر." : "Wait until spring, and use the time to lock in the rent-free lease.",
      reasons: ar ? ["يحمي السيولة في أصعب الأشهر.", "يبقي خيار التوسّع مفتوحًا.", "يحظى بأوسع قبول في المجموعة."] : ["It protects cash through the tightest months.", "It keeps the Jeddah option open at low cost.", "It has the broadest support in the group."],
      risks: ar ? ["قد يرتفع العرض المنافس."] : ["A competitor could take the best site first.", "The rent-free offer may not last until spring."],
      check_first: ar ? null : "Ask the landlord if the 6 months rent-free still applies for a March start.",
      disappoints: ar ? null : "Members who weigh upside most, who would rather move this year.",
      bring_on_board: ar ? null : "A signed option on the site now, so waiting doesn't mean losing it.",
      split: m.split,
      leaned: m.gutMismatch ? { option: m.gutMismatch.gut, label: room.options.find(o => o.id === m.gutMismatch.gut).label, count: m.gutMismatch.leaning, members: m.members } : null,
      role_points: ar ? [] : [{ point: "The fit-out would leave less than six months of cash.", response: "accept", detail: "Waiting until spring keeps cash above six months; a pop-up costs about a tenth of the fit-out." }],
      objections: room.rapid && !ar ? [{ objection: "Legal hasn't cleared the lease terms yet.", meets: true, how: "Waiting until spring leaves time to clear the lease before anything is signed." }] : [],
      ...demoExtras(room.model, ar)
    },
    disagreement_map: {
      weights: m.weightSpread, winners: m.winners, gut: m.gut, risk: m.riskMix, members: m.members, dissent: m.dissent,
      themes: ar ? [] : [{ theme: "Cash runway", kind: "facts", count: 2 }, { theme: "Moving before competitors", kind: "values", count: 1 }]
    },
    outcomes: { scores, outcomes, whatif: m.whatif, group: m.group },
    owner_decision: null, override_reason: null, final_option: null
  };
}

// What each thinking model adds to the verdict, canned for the demo (the server writes the real ones).
function demoExtras(model, ar) {
  const x = {
    model,
    tripwires: ar ? [{ signal: "تراجع السيولة إلى أقل من ستة أشهر", when: "كل شهر" }] : [
      { signal: "The landlord withdraws the rent-free offer for a spring start", when: "Before the end of this month" },
      { signal: "Monthly revenue in Riyadh falls below 1M for two months in a row", when: "Monthly" }]
  };
  if (model === "quick") Object.assign(x, { undo: "Sign a short lease with a break clause, so walking back costs one quarter's rent.", look_again: "In three months, or sooner if a tripwire is hit." });
  if (model === "wrap") Object.assign(x, { widened_option: "Open a small pop-up in Jeddah for three months before committing to the full fit-out.", small_test: "Run weekend sales in a Jeddah mall for six weeks and compare takings with Riyadh's first months.", distance: "We'd tell another team to protect their cash runway first and keep the site option open." });
  if (model === "cynefin") Object.assign(x, { domain: { domain: "complicated", why: "The numbers and the market can be worked out with analysis and local advice.", shift_signal: "If a major competitor opens nearby, the situation becomes much harder to predict." } });
  if (model === "mece") Object.assign(x, { governing_question: "Will a Jeddah branch this year earn more than it puts at risk, compared with waiting until spring?", tree: [
    { branch: "Demand", hypothesis: "Jeddah has enough demand for a second branch.", finding: "Footfall and rents suggest strong demand.", verdict: "holds" },
    { branch: "Cash", hypothesis: "We can fund the fit-out without stress.", finding: "4M fit-out would take cash below six months of runway.", verdict: "fails" },
    { branch: "Team", hypothesis: "We can run two branches well.", finding: "No manager is ready yet.", verdict: "unclear" }] });
  return x;
}

let S = null;                 // what load() returned

const view = $("view");

// The question, with what everyone should know tucked away.
function questionCard() {
  const r = S.room;
  const q = contentLang(el("p", "text", r.question));
  // While the room is open it shows the decide-by date; once decided, the review date.
  const when = ["decided", "reviewed"].includes(r.status) ? (r.review_date ? t("review_on", { date: Rooms.fmtDate(r.review_date) }) : "") : r.decide_by ? t("decide_by_on", { date: Rooms.fmtDate(r.decide_by) }) : "";
  const c = card("active", meta(Rooms.typeName(r), when), q);
  if (S.setupBy) { const sb2 = el("p", "small", t("as_setup_by", { a: S.setupBy, o: S.roster.find(p => p.role === "owner")?.name || "" })); sb2.style.cssText = "opacity:.85;margin:6px 0 0"; c.append(sb2); }
  if (S.departments?.length) {
    const dl = el("p", "small", S.departments.map(x => x.lead ? t("dept_lead_name", { name: x.name }) : x.name).join(" · "));
    dl.style.cssText = "opacity:.85;margin:6px 0 0"; c.append(dl);
  }
  const links = (Array.isArray(r.links) ? r.links : []).map(l => l?.url).filter(Boolean);
  if (r.context || S.files?.length || links.length) {
    const more = el("details", "more");
    const sum = el("summary", null, t("nr_ctx_title").replace(/[?؟]$/, "")); sum.style.color = "#fff";
    more.append(sum);
    if (r.context) { const b = contentLang(el("p", "body", r.context)); b.style.marginTop = "10px"; more.append(b); }
    if (S.files?.length) { const ul = el("ul", "plain"); ul.style.marginTop = "12px"; S.files.forEach(n => ul.append(el("li", "file", n))); more.append(ul); }
    if (links.length) {
      const ul = el("ul", "plain"); ul.style.marginTop = "12px";
      links.forEach(u => { const li = el("li", "file"); const a = el("a", "nm", u); a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer"; a.style.color = "#fff"; li.append(a); ul.append(li); });
      more.append(ul);
    }
    c.append(more);
  }
  return c;
}

/* ---------- Join (invite link) ---------- */
async function vJoin() {
  const p = await store.preview();
  if (!p) return notice(t("invite_not_found"));
  if (p.room_id && Rooms.hasAccount() && !demo) {
    // Already in this room? Go straight there, even from a personal link that is now used.
    const { data } = await Rooms.sb.from("memberships").select("role").eq("room_id", p.room_id).eq("user_id", Rooms.user.id).maybeSingle();
    if (data) { roomId = p.room_id; history.replaceState(null, "", "?room=" + roomId); return refresh(); }
  }
  if (p.is_full) return notice(t(p.person_name ? "invite_used" : "role_full"));
  if (!p.usable) return notice(t("invite_expired"));
  const q = el("p", "text", p.question); q.lang = p.language; q.dir = p.language === "ar" ? "rtl" : "ltr";
  const first = p.person_name ? p.person_name.trim().split(/\s+/)[0] : "";
  const top = card("active", meta(p.owner_name ? t("join_from", { name: p.owner_name }) : t("join_anon"), Rooms.typeName(p)),
    ...(first ? [el("p", "text sm hi", t("join_hi", { name: first }))] : []), q, el("p", "small", t("join_hint")), el("p", "small", t("join_seen_note")));
  if (p.role_title) {
    const as = el("p", "body", t("join_as", { role: p.role_title })); as.style.marginTop = "10px";
    top.append(as);
  }
  // Not signed in, or the profile isn't finished: sign in with one code (the email from the invite is
  // filled in), then the short profile. Then one tap to join.
  const box = el("div", "stack-sm");
  if (!demo) {
    const me = Rooms.hasAccount() ? await Rooms.myProfile() : null;
    if (!me?.completed_at) {
      const invEmail = Rooms.validEmail(p.person_contact) ? p.person_contact.trim() : "";
      show(top, card("you", el("p", "text sm", t(invEmail ? "join_si_title_known" : "join_si_title")), el("p", "small", t("join_si_hint")), box));
      Rooms.ensureAccount(box, { email: invEmail, name: p.person_name || "", onDone: () => vJoin() });
      return;
    }
  }
  const f = el("form", "stack-sm"); f.noValidate = true;
  const me = demo ? { name: p.person_name || "Lina", email: p.person_contact || "lina@example.com" } : await Rooms.myProfile();
  f.append(el("p", "body", t("join_as_me", { name: me.name, email: me.email || "" })));
  const consent = el("input"); consent.type = "checkbox";
  if (p.named_views) { const c = el("label", "check"); c.append(consent, el("span", null, t("join_consent"))); f.append(c); }
  if (p.role === "observer") f.append(el("p", "small", t("join_observer")));
  const go = el("button", "btn", t("join_start_ready")); go.type = "submit";
  const st = el("p", "status"); st.setAttribute("role", "status");
  f.append(go, st);
  f.onsubmit = async e => {
    e.preventDefault();
    go.disabled = true; say(st, t("joining"), "");
    try {
      roomId = await store.join(me.name, me.email, consent.checked);
      if (!demo) history.replaceState(null, "", "?room=" + roomId);
      Rooms.showMyRooms();
      inputStep = 0;
      await refresh();
    } catch (err) {
      say(st, t(Rooms.errKey(err, ["invite_expired", "invite_not_found", "role_full", "invite_used", "busy"])));
      go.disabled = false;
    }
  };
  show(top, card("you", f));
  go.focus();
}

/* ---------- My answers, one step at a time ---------- */
function startInput() {
  const ids = S.room.criteria.map(c => c.id);
  const m = S.mine;
  draft = {
    ratings: Object.fromEntries(ids.map(id => [id, m?.ratings?.[id] ?? 3])),
    risk: m?.risk_appetite || null, gut: m?.gut_pick || null, concern: m?.concern || "", links: [...(m?.links || [])],
    roleAnswer: m?.role_answer || "", roleFiles: [...(m?.role_files || [])], comments: { ...(m?.comments || {}) }
  };
  inputStep = 1;
  render();
}
// The ask written for this member's role, if there is one: it becomes a fifth step.
const myRole = () => (Array.isArray(S.room.roles) ? S.room.roles : []).find(r => r.id === S.roleId) || null;
const myAsk = () => (myRole()?.ask || "").trim() ? myRole() : null;
function vInput() {
  if (!draft) return startInput();
  const total = myAsk() ? 5 : 4;
  const prog = el("div", "progress"); for (let i = 1; i <= total; i++) prog.append(el("i", i <= inputStep ? "on" : ""));
  const f = el("form", "stack-sm"); f.noValidate = true; f.style.gap = "16px";
  const m = el("div", "meta"); m.append(el("span", null, t("step", { n: inputStep, total })));
  f.append(prog, m);
  const st = el("p", "status err"); st.setAttribute("role", "status");
  const row = el("div", "actions");
  if (inputStep > 1) row.append(btn(t("back"), "ghost", () => { inputStep--; render(); }));
  else if (S.mine || S.role === "owner") row.append(btn(t("back"), "ghost", () => { inputStep = 0; draft = null; render(); }));
  const next = el("button", "btn", inputStep === total ? t("send") : t("next")); next.type = "submit";
  row.append(next);

  if (inputStep === 1) {
    const note = el("p", "note"); note.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
    note.append(el("span", null, t("privacy")));
    const list = el("div");
    S.room.criteria.forEach(c => {
      const r = el("div", "rate"); r.setAttribute("role", "group");
      const nm = contentLang(el("span", "rate-name", c.label)); nm.id = "rn-" + c.id; r.setAttribute("aria-labelledby", nm.id);
      const sc = el("div", "scale");
      const draw = () => sc.replaceChildren(...SCALE.map(v => {
        const b = el("button", null, t("scale_" + v)); b.type = "button"; b.setAttribute("aria-pressed", String(draft.ratings[c.id] === v));
        b.onclick = () => { draft.ratings[c.id] = v; draw(); };
        return b;
      }));
      draw();
      // An optional comment, folded until opened; read pooled and unnamed.
      const cm = el("details", "more rate-note");
      cm.open = !!draft.comments[c.id];
      const ci = el("input", "line"); Object.assign(ci, { maxLength: 300, value: draft.comments[c.id] || "", placeholder: t("rate_note_ph"), autocomplete: "off" });
      ci.setAttribute("aria-label", c.label + " · " + t("rate_note"));
      ci.oninput = () => { draft.comments[c.id] = ci.value; };
      cm.append(el("summary", null, t("rate_note")), ci);
      r.append(nm, sc, cm);
      list.append(r);
    });
    f.append(el("h1", "step-title", t("in_rate_title")), note, list);
  } else if (inputStep === 2) {
    const ch = el("div", "choices");
    const draw = () => ch.replaceChildren(...RISKS.map(k => choice(t("risk_" + k), t("risk_" + k + "_hint"), draft.risk === k, () => { draft.risk = k; draw(); say(st, ""); })));
    draw();
    f.append(el("h1", "step-title", t("in_risk_title")), ch);
  } else if (inputStep === 3) {
    const ch = contentLang(el("div", "choices"));
    const draw = () => ch.replaceChildren(...S.room.options.map(o => choice(o.label, null, draft.gut === o.id, () => { draft.gut = o.id; draw(); say(st, ""); })));
    draw();
    f.append(el("h1", "step-title", t("in_gut_title")), el("p", "small", t("in_gut_hint")), ch);
  } else if (inputStep === 5) {
    const r = myAsk();
    const ask = contentLang(el("p", "body", r.ask));
    const ta = el("textarea"); Object.assign(ta, { rows: 5, maxLength: 4000, placeholder: t("role_answer_ph"), value: draft.roleAnswer });
    ta.setAttribute("aria-label", t("in_role_title"));
    ta.oninput = () => { draft.roleAnswer = ta.value; };
    const fl = el("ul", "plain");
    const drawFiles = () => fl.replaceChildren(...draft.roleFiles.map(f => {
      const li = el("li", "file"); const nm = el("span", "nm", f.name); nm.title = f.name;
      const x = el("button", null, "×"); x.type = "button"; x.setAttribute("aria-label", t("remove") + " " + f.name);
      x.onclick = () => { draft.roleFiles = draft.roleFiles.filter(y => y !== f); drawFiles(); };
      li.append(nm, x); return li;
    }));
    const drop = el("label", "drop"); drop.htmlFor = "roleFiles";
    const inp = el("input"); Object.assign(inp, { type: "file", id: "roleFiles", multiple: true, accept: ".pdf,.docx,.xlsx,.xls,.ods,.csv,.tsv,.txt,.md,.json,.zip" });
    drop.append(inp, el("span", null, "+ " + t("drop")));
    inp.onchange = async () => {
      for (const file of [...inp.files]) {
        if (draft.roleFiles.length >= 3) break;
        if (!Rooms.fileKind(file) || file.size > 20 * 1024 * 1024) { say(st, t("file_bad")); continue; }
        try { const text = (await Rooms.readFile(file)).trim().slice(0, 45000); if (text) draft.roleFiles.push({ name: file.name.slice(0, 120), text }); }
        catch { say(st, t("file_bad")); }
      }
      inp.value = ""; drawFiles();
    };
    drawFiles();
    const ff = el("div", "field"); ff.append(el("span", "lbl", t("role_files_lbl")), drop, fl);
    f.append(el("h1", "step-title", t("in_role_title")), el("p", "small", t("in_role_hint", { role: r.title })), ask, ta, ff);
    setTimeout(() => ta.focus(), 50);
  } else {
    const inp = el("input", "line"); Object.assign(inp, { maxLength: 280, placeholder: t("concern_ph"), value: draft.concern, autocomplete: "off" });
    inp.setAttribute("aria-label", t("in_concern_title"));
    inp.oninput = () => { draft.concern = inp.value; };
    const title = el("h1", "step-title", t("in_concern_title"));
    const lf = el("div", "field"); lf.style.marginTop = "8px";
    lf.append(el("span", "lbl", t("my_links_lbl")), el("p", "small", t("my_links_hint")), Rooms.linksEditor(draft.links, 3, l => { draft.links = l; }));
    f.append(title, el("p", "small", t("in_concern_hint") + " (" + t("optional") + ")"), inp, lf);
    setTimeout(() => inp.focus(), 50);
  }
  f.append(st, row);
  f.onsubmit = async e => {
    e.preventDefault();
    if (inputStep === 2 && !draft.risk) return say(st, t("need_pick"));
    if (inputStep === 3 && !draft.gut) return say(st, t("need_pick"));
    if (inputStep < total) { inputStep++; render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    next.disabled = true; next.textContent = t("sending");
    const ids = S.room.criteria.map(c => c.id);
    try {
      const comments = Object.fromEntries(Object.entries(draft.comments || {}).map(([k, v]) => [k, String(v).trim().slice(0, 300)]).filter(([k, v]) => v && ids.includes(k)));
      const input = { ratings: draft.ratings, weights: Rooms.apportion(ids, draft.ratings, 100), risk_appetite: draft.risk, gut_pick: draft.gut, concern: draft.concern.trim(), links: draft.links.filter(Rooms.validUrl).slice(0, 3), comments };
      if (myAsk()) Object.assign(input, { role_answer: draft.roleAnswer.trim().slice(0, 4000), role_files: draft.roleFiles.slice(0, 3) });
      await store.save(input);
      inputStep = 0; draft = null;
      await refresh();
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (err) {
      const k = Rooms.errKey(err, ["room_not_open"]);
      say(st, t(k === "room_not_open" ? "closed" : k));
      next.disabled = false; next.textContent = t("send");
    }
  };
  show(questionCard(), card("you", f));
}

/* ---------- Waiting: who has answered, and Decide now ---------- */
const RAPID_KEYS = { recommender: "rr_recommender", approver: "rr_approver", performer: "rr_performer" };
const rapidLabel = p => t(p.role === "owner" ? "rr_decides" : RAPID_KEYS[p.rapid_role] || "rr_input");
const openObjections = () => (S.objections || []).filter(o => o.status === "open");
const nameOf = uid => S.roster.find(p => p.user_id === uid)?.name || "·";
// The owner, or their assistant (organise or run), runs the process; only "run" may press Decide now.
const runsRoom = () => S.role === "owner" || (S.role === "assistant" && S.level !== "view");
const mayDecide = () => S.role === "owner" || (S.role === "assistant" && S.level === "run");

function vWaiting() {
  const r = S.room, owner = runsRoom(), helper = S.role === "assistant";
  const answering = S.roster.filter(p => p.role !== "observer");
  const done = answering.filter(p => p.submitted).length;
  const first = String(S.roster.find(p => p.me)?.name || "").trim().split(/\s+/)[0];
  const ownerName = S.roster.find(p => p.role === "owner")?.name || "";
  const head = el("p", "text sm", helper ? t("as_head", { owner: ownerName }) : owner ? t(first ? "wait_title_owner_n" : "wait_title_owner", { name: first }) : S.mine ? t(first ? "wait_title_member_n" : "wait_title_member", { name: first }) : t("observer"));
  // Progress that encourages: almost there, everyone in.
  const left = answering.length - done;
  const progress = !answering.length ? t("wait_progress", { n: 0, total: 0 }) : left === 0 ? t("wait_all_in") : left === 1 ? t("wait_one_left", { n: done, total: answering.length }) : t("wait_progress", { n: done, total: answering.length });
  const meter = el("div", "meter"); const fill = el("i"); fill.style.width = (answering.length ? done / answering.length * 100 : 0) + "%"; meter.append(fill);
  const list = el("ul", "roster");
  answering.forEach(p => {
    const li = el("li");
    const who = el("span", "who", p.name || "·"); if (p.me) who.append(el("span", "me", " (" + t("you") + ")"));
    if (p.role_title) who.append(el("span", "tag title", p.role_title));
    if (r.rapid) who.append(el("span", "tag", rapidLabel(p)));
    li.append(who, el("span", "st" + (p.submitted ? " done" : ""), p.submitted ? t("answered") : t("not_yet")));
    list.append(li);
  });
  const status = el("div", "block"); status.append(el("h3", null, progress), meter, list);
  const main = card("you", head, status);

  if (S.role !== "observer" && !helper) {
    if (!S.mine) main.append(btn(t("give_answers"), owner ? "soft" : "", startInput));
    else if (r.status === "open") { const l = el("button", "linkbtn", t("edit_answers")); l.type = "button"; l.onclick = startInput; main.append(l); }
  }
  const blocked = r.rapid && openObjections().length > 0;
  if (owner) {
    const st = el("p", "status err"); st.setAttribute("role", "status");

/* ---------- Thinking ---------- */
// While the room decides, show its thinking stage by stage: done steps get a tick, the current one
// shows what it is doing right now, later ones wait. The stage comes from the server (rooms.decide_stage);
// with no stage yet (queued, or an older server), it estimates from the time since Decide now.
const STAGES = ["reading", "sensemaking", "facts", "math", "judging", "writing"];
const STAGE_EST = { reading: 0, sensemaking: 4, facts: 10, math: 50, judging: 55, writing: 85 };   // seconds, for the estimate
let think = null;   // the live thinking screen, kept between polls so the animation doesn't restart
function stageList() { return STAGES.filter(s2 => s2 !== "sensemaking" || S.room.model === "cynefin"); }
function vThinking() {
  // One live line (a spark, the current stage, a timer), a typed commentary under it, finished stages
  // collected below with ticks, and a thin bar with one segment per stage.
  const spark = el("span", "spark"); spark.setAttribute("aria-hidden", "true");
  spark.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22"><g fill="currentColor">' +
    [0, 45, 90, 135].map(r => `<g transform="rotate(${r} 12 12)"><rect x="11" y="2" width="2" height="20" rx="1"/></g>`).join("") + "</g></svg>";
  const now = el("span", "live-label");
  const clock = el("span", "think-clock", "0:00");
  const line = el("div", "live-line"); line.append(spark, now, clock);
  const sub = el("p", "live-sub"); sub.setAttribute("aria-live", "polite");
  const bar = el("div", "live-bar"); bar.setAttribute("aria-hidden", "true");
  const done = el("ul", "live-done");
  const ids = stageList();
  ids.forEach(() => bar.append(el("i")));
  const c = card("you", el("p", "eyebrow-sm", t("thinking")), line, sub, bar, done, el("p", "small", t("thinking_hint")));
  show(questionCard(), c);
  if (think) { clearInterval(think.tick); clearInterval(think.rot); clearInterval(think.type); }
  think = { ids, now, sub, bar, done, clock, started: think?.started || Date.now(), current: null, subIdx: 0, steps: [{ li: line }] };
  think.tick = setInterval(() => { const s2 = Math.floor((Date.now() - think.started) / 1000); clock.textContent = Math.floor(s2 / 60) + ":" + String(s2 % 60).padStart(2, "0"); if (!S.room.decide_stage) thinkingUpdate(); }, 1000);
  think.rot = setInterval(() => rotateSub(), 3200);
  thinkingUpdate();
}
const stageLabel = id => t("ts_" + id + (id === "judging" ? "_" + (MODELS[S.room.model] ? S.room.model : "standard") : ""));
function thinkingUpdate() {
  if (!think || !think.now.isConnected) return;
  const ids = think.ids;
  let cur = S.room.decide_stage;
  if (!cur || !ids.includes(cur)) {   // estimate from the clock when the server hasn't said yet
    const el2 = (Date.now() - think.started) / 1000;
    cur = ids.filter(id => STAGE_EST[id] <= el2).pop() || ids[0];
  }
  const at = ids.indexOf(cur);
  [...think.bar.children].forEach((x, i) => { x.className = i < at ? "done" : i === at ? "now" : ""; });
  if (think.current === cur) return;
  think.current = cur;
  think.now.classList.remove("in"); void think.now.offsetWidth;
  think.now.textContent = stageLabel(cur); think.now.classList.add("in");
  // finished stages, newest last
  think.done.replaceChildren(...ids.slice(0, at).map(id => { const li = el("li", null, stageLabel(id)); return li; }));
  if (think.done.lastChild) think.done.lastChild.classList.add("in");
  think.subIdx = 0; rotateSub(true);
}
// The commentary under the live line types itself out, then changes every few seconds.
function rotateSub(reset) {
  if (!think || !think.current) return;
  const lines = t("tsub_" + think.current);
  const list2 = Array.isArray(lines) ? lines : [lines];
  if (!reset) think.subIdx++;
  const n = S.roster.filter(p => p.submitted).length;
  const text = String(list2[think.subIdx % list2.length]).replace("{n}", n);
  clearInterval(think.type);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { think.sub.textContent = text; return; }
  let k = 0; think.sub.textContent = "";
  think.type = setInterval(() => { k += 2; think.sub.textContent = text.slice(0, k); if (k >= text.length) clearInterval(think.type); }, 28);
}

// The call becomes a plan everyone sees: actions with an owner and a date, tripwire checks and the review.

const addDays = n => { const x = new Date(); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); };
function draftPlan() {
  const v = S.analysis.verdict || {}, items = [];
  (v.first_actions || []).forEach(x => items.push({ kind: "action", title: (typeof x === "string" ? x : x.action).slice(0, 200), owner_label: x.owner || null, due_date: addDays(2), note: x.by || "" }));
  if (v.check_first) items.push({ kind: "action", title: v.check_first.slice(0, 200), due_date: addDays(7) });
  if (v.small_test) items.push({ kind: "action", title: v.small_test.slice(0, 200), due_date: addDays(14) });
  (v.experiments || []).forEach(x => items.push({ kind: "action", title: x.test.slice(0, 200), note: x.success ? t("v_success") + ": " + x.success : "", due_date: addDays(21) }));
  (v.combination?.steps || []).forEach((x, i) => items.push({ kind: "action", title: x.step.slice(0, 200), note: x.adds || "", due_date: addDays(30 * (i + 1)) }));
  (v.tripwires || []).forEach(w => items.push({ kind: "check", title: w.signal.slice(0, 200), note: w.when || "", due_date: addDays(30) }));
  if (S.room.review_date) items.push({ kind: "review", title: t("plan_review_title"), due_date: S.room.review_date });
  return items;
}
const icsDate = d => d.replace(/-/g, "");
function icsFor(items) {
  const esc = x => String(x || "").replace(/[\;,]/g, m => "\\" + m).replace(/\n/g, "\\n");
  const ev = items.filter(x => x.due_date).map(x => {
    const end = new Date(x.due_date + "T00:00:00Z"); end.setUTCDate(end.getUTCDate() + 1);
    return ["BEGIN:VEVENT", `UID:${x.id || Math.random().toString(36).slice(2)}@decisionrooms`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").slice(0, 15)}Z`,
      `DTSTART;VALUE=DATE:${icsDate(x.due_date)}`, `DTEND;VALUE=DATE:${end.toISOString().slice(0, 10).replace(/-/g, "")}`,
      `SUMMARY:${esc(x.title)}`, `DESCRIPTION:${esc(S.room.question + (x.note ? " · " + x.note : ""))}`, "BEGIN:VALARM", "TRIGGER:-PT15H", "ACTION:DISPLAY", `DESCRIPTION:${esc(x.title)}`, "END:VALARM", "END:VEVENT"].join("\r\n");
  });
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Decision Rooms//Plan//EN", ...ev, "END:VCALENDAR"].join("\r\n");
}
function downloadIcs(items, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([icsFor(items)], { type: "text/calendar" })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const gcal = x => { const end = new Date(x.due_date + "T00:00:00Z"); end.setUTCDate(end.getUTCDate() + 1);
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(x.title) + "&dates=" + icsDate(x.due_date) + "/" + end.toISOString().slice(0, 10).replace(/-/g, "") + "&details=" + encodeURIComponent(S.room.question + (x.note ? " · " + x.note : "")); };
function planCard() {
  const owner = runsRoom(), plan = S.plan || [], me = S.roster.find(p => p.me)?.user_id;
  const c = card("you", el("p", "text sm", t("plan_title")), el("p", "small", t("plan_hint")));
  const st = el("p", "status err");
  if (!plan.length) {
    if (owner) {
      const go = btn(t("plan_draft"), "", async () => { go.disabled = true; try { await store.addPlan(draftPlan()); await refresh(); } catch { go.disabled = false; say(st, t("err_generic")); } });
      c.append(el("p", "small", t("review_after_plan")));
      c.append(go, st);
    } else c.append(el("p", "body", t("plan_none")));
    return c;
  }
  const who = x => x.assignee ? S.roster.find(p => p.user_id === x.assignee)?.name : x.owner_label;
  const list = el("ul", "plain plan");
  plan.forEach(x => {
    const li = el("li", "plan-item " + x.status);
    const top = el("div", "range-top");
    const title = contentLang(el("span", "rate-name", x.title));
    top.append(title, el("span", "tag" + (x.kind === "check" ? " split" : ""), t("plan_kind_" + x.kind)));
    li.append(top);
    const meta2 = el("div", "plan-meta");
    if (x.due_date) meta2.append(el("span", null, Rooms.fmtDate(x.due_date)));
    if (who(x)) meta2.append(el("span", null, who(x)));
    if (x.note) meta2.append(contentLang(el("span", "small", x.note)));
    li.append(meta2);
    const row = el("div", "plan-row");
    if (owner || x.assignee === me) {
      const sel = el("select", "line role-select"); sel.setAttribute("aria-label", x.title + " · " + t("plan_status"));
      ["todo", "doing", "done", "blocked"].forEach(v => { const o = el("option", null, t("plan_st_" + v)); o.value = v; if (x.status === v) o.selected = true; sel.append(o); });
      sel.onchange = async () => { sel.disabled = true; try { await store.updatePlan(x.id, { status: sel.value }); await refresh(); } catch { sel.disabled = false; } };
      row.append(sel);
    } else row.append(el("span", "tag", t("plan_st_" + x.status)));
    if (x.due_date) {
      const g = el("a", "linkbtn", t("plan_gcal")); g.href = gcal(x); g.target = "_blank"; g.rel = "noopener"; row.append(g);
      const i = el("button", "linkbtn", t("plan_ics")); i.type = "button"; i.onclick = () => downloadIcs([x], "decision-plan-item.ics"); row.append(i);
    }
    if (owner) { const rm = el("button", "linkbtn", t("remove")); rm.type = "button"; rm.onclick = async () => { rm.disabled = true; try { await store.removePlan(x.id); await refresh(); } catch { rm.disabled = false; } }; row.append(rm); }
    li.append(row);
    list.append(li);
  });
  c.append(list);
  const all = btn(t("plan_ics_all"), "soft", () => downloadIcs(plan, "decision-plan.ics"));
  c.append(all);
  if (owner) {
    const add = el("div", "stack-sm");
    const tIn = el("input", "line"); Object.assign(tIn, { maxLength: 200, placeholder: t("plan_add_ph") }); tIn.setAttribute("aria-label", t("plan_add_ph"));
    const aSel = el("select", "line role-select"); aSel.setAttribute("aria-label", t("plan_who"));
    [["", t("plan_who")], ...S.roster.filter(p => p.role !== "observer").map(p => [p.user_id, p.name + (p.role_title ? " · " + p.role_title : "")])].forEach(([v, txt]) => { const o = el("option", null, txt); o.value = v; aSel.append(o); });
    const dIn = el("input", "line"); dIn.type = "date"; dIn.value = addDays(7); dIn.setAttribute("aria-label", t("plan_due"));
    const go = btn(t("plan_add"), "ghost", async () => {
      if (!tIn.value.trim()) { tIn.focus(); return; }
      go.disabled = true;
      try { await store.addPlan([{ kind: "action", title: tIn.value.trim(), assignee: !demo && aSel.value ? aSel.value : null, owner_label: demo && aSel.value ? aSel.selectedOptions[0].textContent : null, due_date: dIn.value || null }]); await refresh(); }
      catch { go.disabled = false; say(st, t("err_generic")); }
    });
    const r2 = el("div", "add-row"); r2.append(aSel, dIn);
    add.append(el("p", "lbl", t("plan_add_title")), tIn, r2, go);
    c.append(add);
  }
  if (owner) {
    // When to check how it went: asked here, after the decision, next to the plan.
    const rv = el("input", "line"); Object.assign(rv, { type: "date", value: S.room.review_date || "", min: new Date().toISOString().slice(0, 10) });
    rv.id = "reviewDate";
    rv.onchange = async () => {
      if (!rv.value) return;
      rv.disabled = true;
      try {
        await store.setRoom({ review_date: rv.value });
        const rev = plan.find(x => x.kind === "review");
        if (rev) await store.updatePlan(rev.id, { due_date: rv.value });
        await refresh();
      } catch { rv.disabled = false; say(st, t("err_generic")); }
    };
    const rf = el("div", "field"); const rl = el("label", "lbl", t("review_lbl")); rl.htmlFor = "reviewDate";
    rf.append(rl, el("p", "small", t("review_hint")), rv);
    c.append(rf);
  }
  c.append(el("p", "small", t("plan_reminders_note")), st);
  return c;
}

/* ---------- Your view and the call (personal report, private to each member) ---------- */
function personalCard() {
  const m = S.mine, v = S.analysis.verdict || {}, r = S.room;
  const call = S.analysis.final_option || v.call;
  const c = card("", el("h3", null, t("pr_title")), el("p", "small", t("pr_hint")));
  const top = Object.entries(m.weights || {}).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([id]) => r.criteria.find(x => x.id === id)).filter(Boolean);
  const scores = S.analysis.outcomes?.scores || {};
  const lines = [];
  lines.push(m.gut_pick === call ? t("pr_gut_same", { option: optLabel(call) }) : t("pr_gut_diff", { mine: optLabel(m.gut_pick), option: optLabel(call) }));
  if (top.length) lines.push(t("pr_weigh", { list: top.map(x => x.label).join(", ") }));
  top.forEach(cr => {
    const best = r.options.map(o => [o.id, Number(scores[o.id]?.[cr.id] ?? NaN)]).filter(([, n]) => Number.isFinite(n)).sort((a, b) => b[1] - a[1])[0];
    const mine = Number(scores[call]?.[cr.id]);
    if (Number.isFinite(mine) && best) lines.push(best[0] === call ? t("pr_score_best", { crit: cr.label, n: mine }) : t("pr_score_other", { crit: cr.label, n: mine, best: optLabel(best[0]), m: best[1] }));
  });
  const mix = S.analysis.disagreement_map?.risk || {};
  if (m.risk_appetite) lines.push(t("pr_risk", { mine: t("risk_" + m.risk_appetite), safe: mix.safe || 0, balanced: mix.balanced || 0, bold: mix.bold || 0 }));
  const ul = contentLang(el("ul", "dots")); lines.forEach(x => ul.append(el("li", null, x)));
  c.append(ul);
  if (m.concern) c.append(el("p", "small", t("pr_concern", { concern: m.concern })));
  return c;
}

// Share the result: the owner makes a read-only report link anyone can open; members open the report in the room.
function reportCard() {
  const c = card("you", el("p", "text sm", t("rep_title")));
  const roomReport = demo ? "/report.html?demo=1" : "/report.html?room=" + encodeURIComponent(roomId);
  if (S.role !== "owner") {
    const a = el("a", "btn ghost", t("rep_view")); a.href = roomReport; a.target = "_blank"; a.rel = "noopener";
    c.append(a); return c;
  }
  c.append(el("p", "small", t("rep_hint")));
  // Which reports the team gets, chosen when the report is made.
  const repSel = el("select", "line role-select"); repSel.id = "reportMode"; repSel.style.width = "100%";
  [["both", "rm_both"], ["team", "rm_team"], ["personal", "rm_personal"]].forEach(([v, k]) => { const o = el("option", null, t(k)); o.value = v; if ((S.room.report_mode || "both") === v) o.selected = true; repSel.append(o); });
  repSel.onchange = async () => { repSel.disabled = true; try { await store.setRoom({ report_mode: repSel.value }); await refresh(); } catch { repSel.disabled = false; } };
  const repL = el("label", "lbl", t("rm_lbl")); repL.htmlFor = "reportMode";
  const repF = el("div", "field"); repF.append(repL, repSel);
  c.append(repF);
  const body = el("div", "stack-sm"); c.append(body);
  const st = el("p", "status err");
  const draw = token => {
    body.replaceChildren();
    if (!token) {
      const make = btn(t("rep_create"), "", async () => { make.disabled = true; try { draw(await store.createReport()); } catch { make.disabled = false; say(st, t("err_generic")); } });
      body.append(make, st); return;
    }
    const link = demo ? `${location.origin}/report.html?demo=1` : `${location.origin}/report.html?r=${encodeURIComponent(token)}`;
    const msg = t("rep_share_msg", { question: S.room.question, link });
    const links = Rooms.shareLinks(msg, t("rep_subject", { question: S.room.question }));
    const box = el("div", "linkbox");
    const inp = el("input", "line"); inp.readOnly = true; inp.value = link; inp.setAttribute("aria-label", t("rep_title"));
    const copy = btn(t("copy"), "soft", async () => { await Rooms.copyText(link); copy.textContent = t("copied"); setTimeout(() => { copy.textContent = t("copy"); }, 1600); });
    box.append(inp, copy);
    const row = el("div", "share");
    const open = el("a", "btn ghost", t("rep_open")); open.href = link; open.target = "_blank"; open.rel = "noopener";
    const wa = el("a", "btn ghost", t("whatsapp")); wa.href = links.whatsapp; wa.target = "_blank"; wa.rel = "noopener";
    const em = el("a", "btn ghost", t("email_btn")); em.href = links.email;
    row.append(open, wa, em);
    if (navigator.share) row.append(btn(t("share"), "ghost", () => navigator.share({ text: msg }).catch(() => {})));
    const stop = el("button", "linkbtn", t("rep_stop")); stop.type = "button";
    stop.onclick = async () => { stop.disabled = true; try { await store.stopReport(token); draw(null); say(st, t("rep_stopped"), "ok"); body.append(st); } catch { stop.disabled = false; } };
    body.append(box, row, stop);
  };
  if (store.reportLink) store.reportLink().then(draw, () => draw(null)); else draw(null);
  return c;
}
function signOffCard() {
  const c = card("you", el("p", "text sm", t("so_title")));
  const counts = S.counts || {};
  const countLine = el("p", "small", t("so_counts", { agree: counts.agree || 0, commit: counts.disagree_commit || 0, object: counts.object || 0 }));
  const label = s => t({ agree: "so_agree", disagree_commit: "so_commit", object: "so_object" }[s]);
  if (S.signoff) { c.append(el("p", "status ok", t("so_done", { stance: label(S.signoff.stance) })), countLine); return c; }
  let stance = null;
  const ch = el("div", "choices");
  const draw = () => ch.replaceChildren(...["agree", "disagree_commit", "object"].map(s => choice(label(s), null, stance === s, () => { stance = s; draw(); })));
  draw();
  const note = el("input", "line"); Object.assign(note, { maxLength: 500, placeholder: t("so_note_ph") });
  note.setAttribute("aria-label", t("so_note_ph"));
  const st = el("p", "status err"); st.setAttribute("role", "status");
  const send = btn(t("so_send"), "", async () => {
    if (!stance) return say(st, t("need_pick"));
    send.disabled = true;
    try { await store.signOff(stance, note.value.trim()); await refresh(); }
    catch { send.disabled = false; say(st, t("err_generic")); }
  });
  c.append(ch, note, send, st, countLine);
  return c;
}

/* ======================= Flow ======================= */
// Ask the analyst sits in the corner once we know the room; the owner can add its sources to the room.
let helperOn = false;
function startHelper() {
  if (helperOn || !S?.room) return;
  helperOn = true;
  Rooms.helper({ page: "room", roomId: demo ? null : roomId, onAddSource: S.role === "owner" ? url => store.addLink(url) : null });
}
function render() {
  startHelper();
  clearTimeout(pollTimer);
  if (!S) return;
  if (!S.role) return notice(t("no_access"));
  document.title = (S.room.question.length > 50 ? S.room.question.slice(0, 50) + "…" : S.room.question) + " · " + t("product");
  const st = S.room.status;
  if (inputStep && st === "open" && S.role !== "observer") return vInput();
  if (st === "open") {
    if (!S.mine && S.role === "member") return startInput();   // members go straight to their answers
    vWaiting(); appendNotes(); return poll();
  }
  if (!S.analysis) { if (think && think.now.isConnected) thinkingUpdate(); else vThinking(); return poll(); }
  if (think) { clearInterval(think.tick); clearInterval(think.rot); clearInterval(think.type); think = null; }
  vVerdict(); appendNotes();
  if (st === "deciding") poll();
}
// The owner's private notepad for this room, saved as they type. Sharing a note adds it to the room's context.
function appendNotes() {
  if (S.role !== "owner") return;
  if (S.assistLog?.length) {
    const lc = card("you", el("p", "text sm", t("as_log_title")));
    const ul = el("ul", "dots");
    S.assistLog.slice(0, 12).forEach(x => ul.append(el("li", null, t("as_log_line", { who: x.who || "·", what: x.detail, at: new Date(x.at).toLocaleString(Rooms.lang === "ar" ? "ar" : "en", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) }))));
    const det = el("details", "more"); det.append(el("summary", null, t("as_log_sum", { n: S.assistLog.length })), ul); lc.append(det);
    view.append(lc);
  }
  const c = card("you", el("p", "text sm", t("rn_title")), el("p", "small", t("rn_hint")));
  const ta = el("textarea"); Object.assign(ta, { rows: 4, maxLength: 20000, placeholder: t("rn_ph"), value: S.note?.body || "" }); ta.setAttribute("aria-label", t("rn_title"));
  const st = el("p", "status"); st.setAttribute("role", "status");
  let timer = null;
  ta.oninput = () => { clearTimeout(timer); st.className = "status"; st.textContent = t("nt_saving");
    timer = setTimeout(async () => { try { S.note = await store.saveNote(ta.value); st.textContent = ""; } catch { st.className = "status err"; st.textContent = t("err_generic"); } }, 700); };
  const share = btn(t("rn_share"), "ghost", async () => {
    if (!ta.value.trim() || !confirm(t("rn_share_sure"))) return;
    share.disabled = true;
    try { await store.shareNote(ta.value); await refresh(); } catch { share.disabled = false; st.className = "status err"; st.textContent = t("err_generic"); }
  });
  const more = el("details", "more"); more.open = !!S.note?.body;
  more.append(el("summary", null, t("rn_title")), ta, share, st);
  c.replaceChildren(more, el("p", "small", t("rn_hint")));
  view.append(c);
}
// While waiting on other people (or on the analysis), check again every few seconds.
function poll() {
  if (demo) return;
  pollTimer = setTimeout(async () => {
    if (inputStep || document.hidden) return poll();
    const sig = x => JSON.stringify([x.room.status, x.roster, !!x.analysis, x.room.decide_error, x.objections, x.room.decide_stage]);
    const before = sig(S);
    try { const next = await store.load(); if (next && sig(next) !== before) { S = next; render(); return; } } catch {}
    poll();
  }, S && S.room.status === "deciding" && !S.analysis ? 2500 : 5000);
}
async function refresh() {
  try { S = await store.load(); }
  catch (err) { console.error(err); return notice(t("err_generic")); }
  if (!S) return notice(t("no_access"));
  render();
}
Rooms.langToggle(() => {
  if (S) render();
  else if (joinToken || demo === "join") vJoin();
  else if (Rooms.sb && !Rooms.hasAccount()) vSignIn();
});

async function start() {
  await Rooms.loadLang(Rooms.firstLang(demo === "ar" ? "ar" : null));
  try { MODELS = (await import("/rooms/models.js")).MODELS; } catch {}
  try { MATH = await import("/rooms/math.js"); } catch {}
  notice(t("loading"), true);
  $("demoNote").hidden = !demo;
  if (demo) return demo === "join" ? vJoin() : refresh();
  if (!roomId && !joinToken) return notice(t("no_room"));
  if (!(await Rooms.connect())) return notice(t("not_setup"));
  if (Rooms.user) {
    const p = await Rooms.profile();
    if (p?.language && !Rooms.savedLang() && p.language !== Rooms.lang) await Rooms.loadLang(p.language);
  }
  if (joinToken && !roomId) return vJoin();
  // Old guest sessions start fresh: anyone without a real account signs in first.
  if (!Rooms.hasAccount()) return vSignIn();
  refresh();
}
start();
})();
