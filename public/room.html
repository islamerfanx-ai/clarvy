<head>
<meta charset="utf-8">

<script src="/rooms/rooms.js"></script>
<script>
(() => {
const { $, el, t, choice } = Rooms;
const params = new URLSearchParams(location.search);
let roomId = params.get("room");
const joinToken = params.get("join");
const demo = params.get("demo");
const RISKS = ["safe", "balanced", "bold"];
const SCALE = [1, 2, 3, 4, 5];
let MODELS = {};   // rooms/models.js, loaded at start (framework names for the verdict)

/* ======================= Data: live (Supabase) ======================= */
const live = {
  async preview() {
    const { data, error } = await Rooms.sb.rpc("invite_preview", { invite_token: joinToken });
    return !error && data && data[0] || null;
  },
  async load() {
    const sb = Rooms.sb, me = Rooms.user.id;
    const { data: room, error } = await sb.from("rooms")
      .select("id,type,type_label,question,context,options,criteria,status,language,review_date,quorum,decide_error,model,rapid,links,org_type,org_label,roles,override_rule,override_role_id,strict_confidential,report_mode,decide_stage").eq("id", roomId).maybeSingle();
    if (error) throw error;
    if (!room) return null; // row-level security hides rooms you're not in
    const [mem, mine, roster, an, files] = await Promise.all([
      sb.from("memberships").select("role,role_id").eq("room_id", roomId).eq("user_id", me).maybeSingle(),
      sb.from("inputs").select("ratings,weights,risk_appetite,gut_pick,concern,links,role_answer,role_files").eq("room_id", roomId).eq("user_id", me).maybeSingle(),
      sb.rpc("room_roster", { rid: roomId }),
      sb.from("analyses").select("frame,outcomes,disagreement_map,verdict,confidence,owner_decision,override_reason,final_option").eq("room_id", roomId).order("created_at", { ascending: false }).limit(1).maybeSingle(),
      sb.from("attachments").select("file_name").eq("room_id", roomId).order("created_at")
    ]);
    const role = mem.data?.role;
    const out = { room, role, roleId: mem.data?.role_id || null, mine: mine.data, roster: (roster.data || []).map(r => ({ ...r, me: r.user_id === me })), analysis: an.data, files: (files.data || []).map(f => f.file_name) };
    if (role === "owner") out.invites = await this.invites(room);
    if (an.data) {
      const { data: plan } = await sb.from("plan_items").select("id,kind,title,note,assignee,owner_label,due_date,status,position").eq("room_id", roomId).order("due_date", { ascending: true, nullsFirst: false }).order("position");
      out.plan = plan || [];
    }
    if (room.rapid) {
      const { data: obj } = await sb.from("objections").select("id,user_id,reason,status,override_reason,created_at,option_id").eq("room_id", roomId).order("created_at");
      out.objections = obj || [];
    }
    if (["decided", "reviewed"].includes(room.status)) {
      const [so, counts] = await Promise.all([
        sb.from("signoffs").select("stance,note").eq("room_id", roomId).eq("user_id", me).maybeSingle(),
        sb.rpc("signoff_counts", { rid: roomId })
      ]);
      out.signoff = so.data;
      out.counts = Object.fromEntries((counts.data || []).map(c => [c.stance, Number(c.n)]));
    }
    return out;
  },
  // The owner's invite links: one per role (or one for everyone), each made fresh if it expired.
  async invites(room) {
    const sb = Rooms.sb;
    const { data } = await sb.from("invites").select("token,role_id,max_uses,uses").eq("room_id", roomId).eq("revoked", false)
      .gt("expires_at", new Date().toISOString()).order("created_at", { ascending: false });
    const roles = Array.isArray(room.roles) ? room.roles : [];
    const out = [];
    for (const r of roles.length ? roles : [null]) {
      let inv = (data || []).find(i => (i.role_id || null) === (r ? r.id : null));
      if (!inv) {
        const { data: made } = await sb.from("invites").insert({ room_id: roomId, created_by: Rooms.user.id, role_id: r ? r.id : null, max_uses: r ? r.max || null : null })
          .select("token,role_id,max_uses,uses").single();
        inv = made;
      }
      if (inv) out.push(inv);
    }
    return out;
  },
  async join(name, email, consent) {
    await Rooms.trialSignIn(name, email);
    const { data, error } = await Rooms.sb.rpc("join_room", { invite_token: joinToken, consent });
    if (error) throw error;
    return data;
  },
  async save(input) {
    const { error } = await Rooms.sb.from("inputs").upsert({ room_id: roomId, user_id: Rooms.user.id, ...input }, { onConflict: "room_id,user_id" });
    if (error) throw error;
  },
  decide: () => Rooms.decideNow(roomId),
  async settle(decision, reason, option) {
    const { error } = await Rooms.sb.rpc("decide_verdict", { rid: roomId, decision, reason: reason || null, option_id: option || null });
    if (error) throw error;
  },
  async signOff(stance, note) {
    const { error } = await Rooms.sb.from("signoffs").upsert({ room_id: roomId, user_id: Rooms.user.id, stance, note }, { onConflict: "room_id,user_id" });
    if (error) throw error;
  },
  // RAPID: the owner names roles; approvers can object, which pauses Decide now.
  async setRapidRole(uid, rapid_role) {
    const { error } = await Rooms.sb.from("memberships").update({ rapid_role }).eq("room_id", roomId).eq("user_id", uid);
    if (error) throw error;
  },
  async object(reason, option_id) {
    const { error } = await Rooms.sb.from("objections").insert({ room_id: roomId, user_id: Rooms.user.id, reason, option_id: option_id || null });
    if (error) throw error;
  },
  // Report share links (owner): the current one, a new one, or switch it off.
  async reportLink() {
    const { data } = await Rooms.sb.from("report_shares").select("token").eq("room_id", roomId).eq("revoked", false).order("created_at", { ascending: false }).limit(1).maybeSingle();
    return data?.token || null;
  },
  async createReport() {
    const { data, error } = await Rooms.sb.from("report_shares").insert({ room_id: roomId, created_by: Rooms.user.id }).select("token").single();
    if (error) throw error;
    return data.token;
  },
  // The follow-up plan: the owner writes it, an assignee moves their own items along.
  async addPlan(items) { const { error } = await Rooms.sb.from("plan_items").insert(items.map((x, i) => ({ room_id: roomId, created_by: Rooms.user.id, position: i, ...x }))); if (error) throw error; },
  async updatePlan(id, patch) { const { error } = await Rooms.sb.from("plan_items").update(patch).eq("id", id); if (error) throw error; },
  async removePlan(id) { const { error } = await Rooms.sb.from("plan_items").delete().eq("id", id); if (error) throw error; },
  async addLink(url) {
    const { data } = await Rooms.sb.from("rooms").select("links").eq("id", roomId).single();
    const links = (data?.links || []).filter(l => l?.url !== url).concat([{ url }]).slice(-10);
    const { error } = await Rooms.sb.from("rooms").update({ links }).eq("id", roomId);
    if (error) throw error;
    S.room.links = links;
  },
  async stopReport(token) { const { error } = await Rooms.sb.from("report_shares").update({ revoked: true }).eq("token", token); if (error) throw error; },
  async withdraw(oid) { const { error } = await Rooms.sb.rpc("withdraw_objection", { oid }); if (error) throw error; },
  async overrule(oid, why) { const { error } = await Rooms.sb.rpc("override_objection", { oid, why }); if (error) throw error; }
};

/* ======================= Data: demo (in this browser only) ======================= */
const DEMO_ROOMS = {
  en: {
    id: "demo", type: "business", status: "open", language: "en", review_date: "2026-12-01", quorum: 2,
    question: "Should we open a second location in Jeddah this year, or wait until next spring?",
    context: "The Riyadh shop does about 1.2M a month and has been profitable for 14 months.\nFit-out in Jeddah is roughly 4M. One landlord offers 6 months rent-free.",
    options: [{ id: "o1", label: "Open in Jeddah this year" }, { id: "o2", label: "Wait until next spring" }, { id: "o3", label: "Grow Riyadh instead" }],
    criteria: [{ id: "c1", label: "Upside" }, { id: "c2", label: "Cash risk" }, { id: "c3", label: "Execution capacity" }, { id: "c4", label: "Brand fit" }]
  },
  ar: {
    id: "demo", type: "finance", status: "open", language: "ar", review_date: "2026-12-15", quorum: 2,
    question: "هل نأخذ قرضًا بنكيًا للتوسّع، أم نطرح حصة للمستثمرين، أم نموّل أنفسنا؟",
    context: "الإيرادات السنوية 18 مليونًا وهامش الربح 14٪.\nعرض البنك بفائدة 7.5٪ لخمس سنوات، ومستثمر مهتم بحصة 20٪.",
    options: [{ id: "o1", label: "قرض بنكي" }, { id: "o2", label: "حصة للمستثمرين" }, { id: "o3", label: "تمويل ذاتي" }],
    criteria: [{ id: "c1", label: "تكلفة رأس المال" }, { id: "c2", label: "السيطرة على القرار" }, { id: "c3", label: "الحماية من الخسارة" }, { id: "c4", label: "السيولة" }]
  }
};
function demoStore(kind) {
  const room = structuredClone(DEMO_ROOMS[kind === "ar" ? "ar" : "en"]);
  room.model = params.get("model") || "wrap";
  room.rapid = params.get("rapid") === "1";
  room.links = [{ url: "https://www.example.org/jeddah-retail-report" }];
  const withRoles = params.get("roles") === "1";
  room.roles = withRoles ? [
    { id: "r1", title: "CFO", max: 1, ask: "Please add the fit-out cost, the cash runway after it, and what a 6-month delay would save.", rapid: room.rapid ? "approver" : null },
    { id: "r2", title: "Director", max: null, ask: "", rapid: null }] : [];
  room.org_type = withRoles ? "corporation" : null;
  const owner = kind === "owner";
  let role = kind === "join" ? null : owner ? "owner" : "member";
  let mine = null, analysis = null, signoff = null, myName = owner ? "Islam" : "Lina";
  const others = [
    { name: "Sara", input: { weights: { c1: 20, c2: 45, c3: 25, c4: 10 }, risk_appetite: "safe", gut_pick: "o2", concern: "Cash is thin until the Riyadh loan is paid off." } },
    { name: "Omar", input: { weights: { c1: 45, c2: 15, c3: 15, c4: 25 }, risk_appetite: "bold", gut_pick: "o1", concern: "A competitor could take the best Jeddah site first." } }
  ];
  const roles = { Sara: owner ? null : null, Omar: room.rapid ? "approver" : null };
  const objections = room.rapid ? [{ id: "x1", user_id: "omar", reason: "Legal hasn't cleared the lease terms yet.", status: "open", override_reason: null }] : [];
  const roster = () => [
    ...(role ? [{ user_id: "me", name: myName, role, rapid_role: null, submitted: !!mine, me: true, role_title: withRoles && !owner ? "CFO" : null }] : []),
    { user_id: "sara", name: "Sara", role: owner ? "member" : "owner", rapid_role: roles.Sara, submitted: true, me: false, role_title: withRoles && owner ? "CFO" : null },
    { user_id: "omar", name: "Omar", role: "member", rapid_role: roles.Omar, submitted: owner, me: false, role_title: withRoles ? "Director" : null }
  ];
  return {
    async preview() { return { room_id: "demo", type: room.type, question: room.question, language: room.language, owner_name: "Sara", named_views: false, role: "member", usable: true, role_title: withRoles ? "CFO" : null, role_ask: withRoles ? room.roles[0].ask : null, is_full: false }; },
    async load() {
      const counts = signoff ? { agree: 1, [signoff.stance]: (signoff.stance === "agree" ? 2 : 1) } : { agree: 1 };
      const invites = !owner ? null : withRoles ? [{ token: "demo-cfo", role_id: "r1", max_uses: 1, uses: 0 }, { token: "demo-dir", role_id: "r2", max_uses: null, uses: 1 }] : [{ token: "demo-invite", role_id: null }];
      room.report_mode = "both";
      return { room, role, roleId: withRoles && !owner ? "r1" : null, mine, roster: roster(), analysis, plan: this.plan, files: ["Riyadh P&L 2026.xlsx"], invites, signoff, counts, objections: room.rapid ? objections : undefined };
    },
    async join(name) { role = "member"; if (name) myName = name; return "demo"; },
    async setRapidRole(uid, r) { if (uid === "sara") roles.Sara = r; if (uid === "omar") roles.Omar = r; },
    async object(reason, option_id) { objections.push({ id: "x" + (objections.length + 1), user_id: "me", reason, option_id: option_id || null, status: "open" }); },
    async withdraw(oid) { const o = objections.find(x => x.id === oid); if (o) o.status = "withdrawn"; },
    reportToken: null,
    async reportLink() { return this.reportToken; },
    async createReport() { this.reportToken = "demo"; return "demo"; },
    async stopReport() { this.reportToken = null; },
    async overrule(oid, why) { const o = objections.find(x => x.id === oid); if (o) Object.assign(o, { status: "overridden", override_reason: why }); },
    async save(input) { mine = input; },
    plan: [],
    async addPlan(items) { items.forEach((x, i) => this.plan.push({ id: "p" + (this.plan.length + 1), status: "todo", note: "", position: i, ...x })); },
    async updatePlan(id, patch) { Object.assign(this.plan.find(x => x.id === id) || {}, patch); },
    async removePlan(id) { this.plan = this.plan.filter(x => x.id !== id); },
    async addLink(url) { room.links.push({ url }); },
    async decide() {
      room.status = "deciding";
      // Walk through the same stages the server reports, a couple of seconds each.
      const stages = ["reading", ...(room.model === "cynefin" ? ["sensemaking"] : []), "facts", "math", "judging", "writing"];
      stages.forEach((st, i) => setTimeout(() => { room.decide_stage = st; thinkingUpdate(); }, i * 2600));
      setTimeout(async () => { room.decide_stage = null; analysis = await demoAnalysis(room, [mine, ...others.map(o => o.input)].filter(Boolean)); await refresh(); }, stages.length * 2600 + 800);
    },
    async settle(decision, reason, option) {
      const final = decision === "accepted" ? analysis.verdict.call : option;
      if (objections.some(o => o.status === "open" && (!o.option_id || o.option_id === final))) throw new Error("objection_open");
      Object.assign(analysis, { owner_decision: decision, override_reason: reason, final_option: decision === "accepted" ? analysis.verdict.call : option });
      room.status = "decided";
    },
    async signOff(stance, note) { signoff = { stance, note }; }
  };
}
// The demo runs the real group math (rooms/math.js) on made-up scores, with a canned write-up.
async function demoAnalysis(room, inputs) {
  const M = await import("/rooms/math.js");
  const scores = { o1: { c1: 9, c2: 3, c3: 4, c4: 8 }, o2: { c1: 7, c2: 7, c3: 7, c4: 7 }, o3: { c1: 4, c2: 9, c3: 8, c4: 5 } };
  const outcomes = {
    o1: { best: { value: 10, odds: 25 }, likely: { value: 6, odds: 50 }, worst: { value: 1, odds: 25 } },
    o2: { best: { value: 8, odds: 30 }, likely: { value: 7, odds: 55 }, worst: { value: 4, odds: 15 } },
    o3: { best: { value: 6, odds: 30 }, likely: { value: 5, odds: 60 }, worst: { value: 4, odds: 10 } }
  };
  const m = M.roomMath({ options: room.options, criteria: room.criteria, scores, outcomes, inputs });
  const ar = room.language === "ar";
  return {
    confidence: m.capConfidence ? "Medium" : "High",
    frame: { facts: [{ text: ar ? "ارتفعت أسعار الفائدة على قروض الشركات 0.5٪ هذا العام." : "Retail rents in central Jeddah rose about 9% this year.", date: "2026-09", kind: "news", source: ar ? "تقرير مصرفي، سبتمبر 2026" : "Local property report, Sep 2026", url: null }] },
    verdict: {
      call: m.call, call_label: room.options.find(o => o.id === m.call).label,
      headline: ar ? "خذوا الخيار الأوسط الآن، وأعيدوا التقييم بعد ستة أشهر." : "Wait until spring, and use the time to lock in the rent-free lease.",
      reasons: ar ? ["يحمي السيولة في أصعب الأشهر.", "يبقي خيار التوسّع مفتوحًا.", "يحظى بأوسع قبول في المجموعة."] : ["It protects cash through the tightest months.", "It keeps the Jeddah option open at low cost.", "It has the broadest support in the group."],
      risks: ar ? ["قد يرتفع العرض المنافس."] : ["A competitor could take the best site first.", "The rent-free offer may not last until spring."],
      check_first: ar ? null : "Ask the landlord if the 6 months rent-free still applies for a March start.",
      disappoints: ar ? null : "Members who weigh upside most, who would rather move this year.",
      bring_on_board: ar ? null : "A signed option on the site now, so waiting doesn't mean losing it.",
      split: m.split,
      leaned: m.gutMismatch ? { option: m.gutMismatch.gut, label: room.options.find(o => o.id === m.gutMismatch.gut).label, count: m.gutMismatch.leaning, members: m.members } : null,
      role_points: ar ? [] : [{ point: "The fit-out would leave less than six months of cash.", response: "accept", detail: "Waiting until spring keeps cash above six months; a pop-up costs about a tenth of the fit-out." }],
      objections: room.rapid && !ar ? [{ objection: "Legal hasn't cleared the lease terms yet.", meets: true, how: "Waiting until spring leaves time to clear the lease before anything is signed." }] : [],
      ...demoExtras(room.model, ar)
    },
    disagreement_map: {
      weights: m.weightSpread, winners: m.winners, gut: m.gut, risk: m.riskMix, members: m.members, dissent: m.dissent,
      themes: ar ? [] : [{ theme: "Cash runway", kind: "facts", count: 2 }, { theme: "Moving before competitors", kind: "values", count: 1 }]
    },
    owner_decision: null, override_reason: null, final_option: null
  };
}

// What each thinking model adds to the verdict, canned for the demo (the server writes the real ones).
function demoExtras(model, ar) {
  const x = {
    model,
    tripwires: ar ? [{ signal: "تراجع السيولة إلى أقل من ستة أشهر", when: "كل شهر" }] : [
      { signal: "The landlord withdraws the rent-free offer for a spring start", when: "Before the end of this month" },
      { signal: "Monthly revenue in Riyadh falls below 1M for two months in a row", when: "Monthly" }]
  };
  if (model === "quick") Object.assign(x, { undo: "Sign a short lease with a break clause, so walking back costs one quarter's rent.", look_again: "In three months, or sooner if a tripwire is hit." });
  if (model === "wrap") Object.assign(x, { widened_option: "Open a small pop-up in Jeddah for three months before committing to the full fit-out.", small_test: "Run weekend sales in a Jeddah mall for six weeks and compare takings with Riyadh's first months.", distance: "We'd tell another team to protect their cash runway first and keep the site option open." });
  if (model === "cynefin") Object.assign(x, { domain: { domain: "complicated", why: "The numbers and the market can be worked out with analysis and local advice.", shift_signal: "If a major competitor opens nearby, the situation becomes much harder to predict." } });
  if (model === "mece") Object.assign(x, { governing_question: "Will a Jeddah branch this year earn more than it puts at risk, compared with waiting until spring?", tree: [
    { branch: "Demand", hypothesis: "Jeddah has enough demand for a second branch.", finding: "Footfall and rents suggest strong demand.", verdict: "holds" },
    { branch: "Cash", hypothesis: "We can fund the fit-out without stress.", finding: "4M fit-out would take cash below six months of runway.", verdict: "fails" },
    { branch: "Team", hypothesis: "We can run two branches well.", finding: "No manager is ready yet.", verdict: "unclear" }] });
  return x;
}

const store = demo ? demoStore(demo) : live;

/* ======================= Screens ======================= */
let S = null;                 // what load() returned
let inputStep = 0;            // 0 = not answering; 1-4 = input steps
let draft = null;             // answers in progress
let pollTimer = null;
const view = $("view");
const optLabel = id => S.room.options.find(o => o.id === id)?.label || id;
const say = (node, msg, kind = "err") => { node.textContent = msg; node.className = "status " + kind; };
function card(cls, ...kids) { const c = el("article", "msg " + cls); c.append(...kids.filter(Boolean)); return c; }
function meta(left, right) { const m = el("div", "meta"); m.append(el("span", null, left), el("span", null, right || "")); return m; }
function btn(label, cls, onClick) { const b = el("button", "btn " + (cls || ""), label); b.type = "button"; if (onClick) b.onclick = onClick; return b; }
function show(...cards) { view.replaceChildren(...cards); }
function notice(msg, thinking) { const p = el("p", "text" + (thinking ? " thinking" : ""), msg); show(card("", p)); }
const contentLang = node => { node.lang = S.room.language; node.dir = S.room.language === "ar" ? "rtl" : "ltr"; return node; };

// The question, with what everyone should know tucked away.
function questionCard() {
  const r = S.room;
  const q = contentLang(el("p", "text", r.question));
  const c = card("active", meta(Rooms.typeName(r), r.review_date ? t("review_on", { date: Rooms.fmtDate(r.review_date) }) : ""), q);
  const links = (Array.isArray(r.links) ? r.links : []).map(l => l?.url).filter(Boolean);
  if (r.context || S.files?.length || links.length) {
    const more = el("details", "more");
    const sum = el("summary", null, t("nr_ctx_title").replace(/[?؟]$/, "")); sum.style.color = "#fff";
    more.append(sum);
    if (r.context) { const b = contentLang(el("p", "body", r.context)); b.style.marginTop = "10px"; more.append(b); }
    if (S.files?.length) { const ul = el("ul", "plain"); ul.style.marginTop = "12px"; S.files.forEach(n => ul.append(el("li", "file", n))); more.append(ul); }
    if (links.length) {
      const ul = el("ul", "plain"); ul.style.marginTop = "12px";
      links.forEach(u => { const li = el("li", "file"); const a = el("a", "nm", u); a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer"; a.style.color = "#fff"; li.append(a); ul.append(li); });
      more.append(ul);
    }
    c.append(more);
  }
  return c;
}

/* ---------- Join (invite link) ---------- */
async function vJoin() {
  const p = await store.preview();
  if (!p) return notice(t("invite_not_found"));
  if (p.is_full) return notice(t("role_full"));

/* ---------- My answers, one step at a time ---------- */
function startInput() {
  const ids = S.room.criteria.map(c => c.id);
  const m = S.mine;
  draft = {
    ratings: Object.fromEntries(ids.map(id => [id, m?.ratings?.[id] ?? 3])),
    risk: m?.risk_appetite || null, gut: m?.gut_pick || null, concern: m?.concern || "", links: [...(m?.links || [])],
    roleAnswer: m?.role_answer || "", roleFiles: [...(m?.role_files || [])]
  };
  inputStep = 1;
  render();
}
// The ask written for this member's role, if there is one: it becomes a fifth step.
const myRole = () => (Array.isArray(S.room.roles) ? S.room.roles : []).find(r => r.id === S.roleId) || null;
const myAsk = () => (myRole()?.ask || "").trim() ? myRole() : null;
function vInput() {
  if (!draft) return startInput();
  const total = myAsk() ? 5 : 4;
  const prog = el("div", "progress"); for (let i = 1; i <= total; i++) prog.append(el("i", i <= inputStep ? "on" : ""));
  const f = el("form", "stack-sm"); f.noValidate = true; f.style.gap = "16px";
  const m = el("div", "meta"); m.append(el("span", null, t("step", { n: inputStep, total })));
  f.append(prog, m);
  const st = el("p", "status err"); st.setAttribute("role", "status");
  const row = el("div", "actions");
  if (inputStep > 1) row.append(btn(t("back"), "ghost", () => { inputStep--; render(); }));
  else if (S.mine || S.role === "owner") row.append(btn(t("back"), "ghost", () => { inputStep = 0; draft = null; render(); }));
  const next = el("button", "btn", inputStep === total ? t("send") : t("next")); next.type = "submit";
  row.append(next);

  if (inputStep === 1) {
    const note = el("p", "note"); note.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
    note.append(el("span", null, t("privacy")));
    const list = el("div");
    S.room.criteria.forEach(c => {
      const r = el("div", "rate"); r.setAttribute("role", "group");
      const nm = contentLang(el("span", "rate-name", c.label)); nm.id = "rn-" + c.id; r.setAttribute("aria-labelledby", nm.id);
      const sc = el("div", "scale");
      const draw = () => sc.replaceChildren(...SCALE.map(v => {

        b.onclick = () => { draft.ratings[c.id] = v; draw(); };

  }
  f.append(st, row);
  f.onsubmit = async e => {
    e.preventDefault();
    if (inputStep === 2 && !draft.risk) return say(st, t("need_pick"));
    if (inputStep === 3 && !draft.gut) return say(st, t("need_pick"));
    if (inputStep < total) { inputStep++; render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    next.disabled = true; next.textContent = t("sending");
    const ids = S.room.criteria.map(c => c.id);
    try {
      const input = { ratings: draft.ratings, weights: Rooms.apportion(ids, draft.ratings, 100), risk_appetite: draft.risk, gut_pick: draft.gut, concern: draft.concern.trim(), links: draft.links.filter(Rooms.validUrl).slice(0, 3) };
      if (myAsk()) Object.assign(input, { role_answer: draft.roleAnswer.trim().slice(0, 4000), role_files: draft.roleFiles.slice(0, 3) });

/* ---------- Waiting: who has answered, and Decide now ---------- */
const RAPID_KEYS = { recommender: "rr_recommender", approver: "rr_approver", performer: "rr_performer" };
const rapidLabel = p => t(p.role === "owner" ? "rr_decides" : RAPID_KEYS[p.rapid_role] || "rr_input");

function vWaiting() {
  const r = S.room, owner = S.role === "owner";
  const answering = S.roster.filter(p => p.role !== "observer");
  const done = answering.filter(p => p.submitted).length;
  const head = el("p", "text sm", owner ? t("wait_title_owner") : S.mine ? t("wait_title_member") : t("observer"));
  const meter = el("div", "meter"); const fill = el("i"); fill.style.width = (answering.length ? done / answering.length * 100 : 0) + "%"; meter.append(fill);
  const list = el("ul", "roster");
  answering.forEach(p => {
    const li = el("li");
    const who = el("span", "who", p.name || "·"); if (p.me) who.append(el("span", "me", " (" + t("you") + ")"));
    if (p.role_title) who.append(el("span", "tag title", p.role_title));
    if (r.rapid) who.append(el("span", "tag", rapidLabel(p)));
    li.append(who, el("span", "st" + (p.submitted ? " done" : ""), p.submitted ? t("answered") : t("not_yet")));

  }
  const blocked = r.rapid && openObjections().length > 0;
  if (owner) {
    const st = el("p", "status err"); st.setAttribute("role", "status");
    if (r.decide_error) say(st, t(r.decide_error === "rooms_not_configured" ? "rooms_not_configured" : "decide_failed"));
    const ready = done >= r.quorum;
    const d = btn(t("decide_now"), "", async () => {
      d.disabled = true; say(st, "");
      try { await store.decide(); S.room.status = "deciding"; render(); }
      catch (err) { d.disabled = false; say(st, t(["need_more_inputs", "rooms_not_configured", "room_not_open", "objection_open", "quota"].includes(err.message) ? err.message : "err_generic", { need: r.quorum })); }
    });
    d.disabled = !ready;
    main.append(d);
    if (done < r.quorum) main.append(el("p", "small", t("decide_need", { need: r.quorum })));
    else if (blocked) main.append(el("p", "small", t("obj_open_note")));
    main.append(st);
  } else if (S.mine) {
    main.append(el("p", "small", t(blocked ? "obj_open_note" : "wait_hint_member")));
  }
  if (params.get("files") === "failed") main.append(el("p", "status err", t("files_failed")));
  const cards = [questionCard()];
  if (r.rapid && (S.objections || []).length) cards.push(objectionsCard());
  cards.push(main);
  if (r.rapid && S.roster.find(p => p.me)?.rapid_role === "approver" && r.status === "open") cards.push(approverCard());
  if (owner && r.rapid) cards.push(rolesCard());
  // A brand-new room puts the invite first; after that it sits under the progress.
  if (owner && S.invites?.length) cards.splice(params.get("new") && !done ? 1 : cards.indexOf(main) + 1, 0, shareCard(done < answering.length));
  show(...cards);
}

/* ---------- Thinking ---------- */
// While the room decides, show its thinking stage by stage: done steps get a tick, the current one
// shows what it is doing right now, later ones wait. The stage comes from the server (rooms.decide_stage);
// with no stage yet (queued, or an older server), it estimates from the time since Decide now.
const STAGES = ["reading", "sensemaking", "facts", "math", "judging", "writing"];
const STAGE_EST = { reading: 0, sensemaking: 4, facts: 10, math: 50, judging: 55, writing: 85 };   // seconds, for the estimate
let think = null;   // the live thinking screen, kept between polls so the animation doesn't restart
function stageList() { return STAGES.filter(s2 => s2 !== "sensemaking" || S.room.model === "cynefin"); }
function vThinking() {
  // One live line (a spark, the current stage, a timer), a typed commentary under it, finished stages
  // collected below with ticks, and a thin bar with one segment per stage.
  const spark = el("span", "spark"); spark.setAttribute("aria-hidden", "true");
  spark.innerHTML = '<svg viewBox="0 0 24 24" width="22" height="22"><g fill="currentColor">' +
    [0, 45, 90, 135].map(r => `<g transform="rotate(${r} 12 12)"><rect x="11" y="2" width="2" height="20" rx="1"/></g>`).join("") + "</g></svg>";
  const now = el("span", "live-label");
  const clock = el("span", "think-clock", "0:00");
  const line = el("div", "live-line"); line.append(spark, now, clock);
  const sub = el("p", "live-sub"); sub.setAttribute("aria-live", "polite");
  const bar = el("div", "live-bar"); bar.setAttribute("aria-hidden", "true");
  const done = el("ul", "live-done");

    if (owner) { const rm = el("button", "linkbtn", t("remove")); rm.type = "button"; rm.onclick = async () => { rm.disabled = true; try { await store.removePlan(x.id); await refresh(); } catch { rm.disabled = false; } }; row.append(rm); }
    li.append(row);
    list.append(li);
  });
  c.append(list);
  const all = btn(t("plan_ics_all"), "soft", () => downloadIcs(plan, "decision-plan.ics"));
  c.append(all);
  if (owner) {
    const add = el("div", "stack-sm");
    const tIn = el("input", "line"); Object.assign(tIn, { maxLength: 200, placeholder: t("plan_add_ph") }); tIn.setAttribute("aria-label", t("plan_add_ph"));
    const aSel = el("select", "line role-select"); aSel.setAttribute("aria-label", t("plan_who"));
    [["", t("plan_who")], ...S.roster.filter(p => p.role !== "observer").map(p => [p.user_id, p.name + (p.role_title ? " · " + p.role_title : "")])].forEach(([v, txt]) => { const o = el("option", null, txt); o.value = v; aSel.append(o); });
    const dIn = el("input", "line"); dIn.type = "date"; dIn.value = addDays(7); dIn.setAttribute("aria-label", t("plan_due"));
    const go = btn(t("plan_add"), "ghost", async () => {
      if (!tIn.value.trim()) { tIn.focus(); return; }
      go.disabled = true;
      try { await store.addPlan([{ kind: "action", title: tIn.value.trim(), assignee: !demo && aSel.value ? aSel.value : null, owner_label: demo && aSel.value ? aSel.selectedOptions[0].textContent : null, due_date: dIn.value || null }]); await refresh(); }
      catch { go.disabled = false; say(st, t("err_generic")); }
    });
    const r2 = el("div", "add-row"); r2.append(aSel, dIn);
    add.append(el("p", "lbl", t("plan_add_title")), tIn, r2, go);
    c.append(add);
  }
  c.append(el("p", "small", t("plan_reminders_note")), st);
  return c;
}

/* ---------- Your view and the call (personal report, private to each member) ---------- */
function personalCard() {
  const m = S.mine, v = S.analysis.verdict || {}, r = S.room;
  const call = S.analysis.final_option || v.call;
  const c = card("", el("h3", null, t("pr_title")), el("p", "small", t("pr_hint")));
  const top = Object.entries(m.weights || {}).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([id]) => r.criteria.find(x => x.id === id)).filter(Boolean);
  const scores = S.analysis.outcomes?.scores || {};
  const lines = [];
  lines.push(m.gut_pick === call ? t("pr_gut_same", { option: optLabel(call) }) : t("pr_gut_diff", { mine: optLabel(m.gut_pick), option: optLabel(call) }));
  if (top.length) lines.push(t("pr_weigh", { list: top.map(x => x.label).join(", ") }));
  top.forEach(cr => {
    const best = r.options.map(o => [o.id, Number(scores[o.id]?.[cr.id] ?? NaN)]).filter(([, n]) => Number.isFinite(n)).sort((a, b) => b[1] - a[1])[0];
    const mine = Number(scores[call]?.[cr.id]);
    if (Number.isFinite(mine) && best) lines.push(best[0] === call ? t("pr_score_best", { crit: cr.label, n: mine }) : t("pr_score_other", { crit: cr.label, n: mine, best: optLabel(best[0]), m: best[1] }));
  });
  const mix = S.analysis.disagreement_map?.risk || {};
  if (m.risk_appetite) lines.push(t("pr_risk", { mine: t("risk_" + m.risk_appetite), safe: mix.safe || 0, balanced: mix.balanced || 0, bold: mix.bold || 0 }));
  const ul = contentLang(el("ul", "dots")); lines.forEach(x => ul.append(el("li", null, x)));
  c.append(ul);
  if (m.concern) c.append(el("p", "small", t("pr_concern", { concern: m.concern })));
  return c;
}

// Share the result: the owner makes a read-only report link anyone can open; members open the report in the room.
function reportCard() {
  const c = card("you", el("p", "text sm", t("rep_title")));
  const roomReport = demo ? "/report.html?demo=1" : "/report.html?room=" + encodeURIComponent(roomId);
  if (S.role !== "owner") {
    const a = el("a", "btn ghost", t("rep_view")); a.href = roomReport; a.target = "_blank"; a.rel = "noopener";
    c.append(a); return c;
  }
  c.append(el("p", "small", t("rep_hint")));
  const body = el("div", "stack-sm"); c.append(body);
  const st = el("p", "status err");
  const draw = token => {
    body.replaceChildren();
    if (!token) {
      const make = btn(t("rep_create"), "", async () => { make.disabled = true; try { draw(await store.createReport()); } catch { make.disabled = false; say(st, t("err_generic")); } });
      body.append(make, st); return;
    }
    const link = demo ? `${location.origin}/report.html?demo=1` : `${location.origin}/report.html?r=${encodeURIComponent(token)}`;
    const msg = t("rep_share_msg", { question: S.room.question, link });
    const links = Rooms.shareLinks(msg, t("rep_subject", { question: S.room.question }));
    const box = el("div", "linkbox");
    const inp = el("input", "line"); inp.readOnly = true; inp.value = link; inp.setAttribute("aria-label", t("rep_title"));
    const copy = btn(t("copy"), "soft", async () => { await Rooms.copyText(link); copy.textContent = t("copied"); setTimeout(() => { copy.textContent = t("copy"); }, 1600); });
    box.append(inp, copy);
    const row = el("div", "share");
    const open = el("a", "btn ghost", t("rep_open")); open.href = link; open.target = "_blank"; open.rel = "noopener";
    const wa = el("a", "btn ghost", t("whatsapp")); wa.href = links.whatsapp; wa.target = "_blank"; wa.rel = "noopener";
    const em = el("a", "btn ghost", t("email_btn")); em.href = links.email;
    row.append(open, wa, em);
    if (navigator.share) row.append(btn(t("share"), "ghost", () => navigator.share({ text: msg }).catch(() => {})));
    const stop = el("button", "linkbtn", t("rep_stop")); stop.type = "button";
    stop.onclick = async () => { stop.disabled = true; try { await store.stopReport(token); draw(null); say(st, t("rep_stopped"), "ok"); body.append(st); } catch { stop.disabled = false; } };
    body.append(box, row, stop);
  };
  if (store.reportLink) store.reportLink().then(draw, () => draw(null)); else draw(null);
  return c;
}
function signOffCard() {
  const c = card("you", el("p", "text sm", t("so_title")));
  const counts = S.counts || {};
  const countLine = el("p", "small", t("so_counts", { agree: counts.agree || 0, commit: counts.disagree_commit || 0, object: counts.object || 0 }));
  const label = s => t({ agree: "so_agree", disagree_commit: "so_commit", object: "so_object" }[s]);
  if (S.signoff) { c.append(el("p", "status ok", t("so_done", { stance: label(S.signoff.stance) })), countLine); return c; }
  let stance = null;
  const ch = el("div", "choices");
  const draw = () => ch.replaceChildren(...["agree", "disagree_commit", "object"].map(s => choice(label(s), null, stance === s, () => { stance = s; draw(); })));
  draw();
  const note = el("input", "line"); Object.assign(note, { maxLength: 500, placeholder: t("so_note_ph") });
  note.setAttribute("aria-label", t("so_note_ph"));
  const st = el("p", "status err"); st.setAttribute("role", "status");
  const send = btn(t("so_send"), "", async () => {
    if (!stance) return say(st, t("need_pick"));
    send.disabled = true;
    try { await store.signOff(stance, note.value.trim()); await refresh(); }
    catch { send.disabled = false; say(st, t("err_generic")); }
  });
  c.append(ch, note, send, st, countLine);
  return c;
}

/* ======================= Flow ======================= */
// Ask the analyst sits in the corner once we know the room; the owner can add its sources to the room.
let helperOn = false;
function startHelper() {
  if (helperOn || !S?.room) return;
  helperOn = true;
  Rooms.helper({ page: "room", roomId: demo ? null : roomId, onAddSource: S.role === "owner" ? url => store.addLink(url) : null });
}
function render() {
  startHelper();
  clearTimeout(pollTimer);
  if (!S) return;
  if (!S.role) return notice(t("no_access"));
  document.title = (S.room.question.length > 50 ? S.room.question.slice(0, 50) + "…" : S.room.question) + " · " + t("product");
  const st = S.room.status;
  if (inputStep && st === "open" && S.role !== "observer") return vInput();
  if (st === "open") {
    if (!S.mine && S.role === "member") return startInput();   // members go straight to their answers
    vWaiting(); return poll();
  }
  if (!S.analysis) { if (think && think.now.isConnected) thinkingUpdate(); else vThinking(); return poll(); }
  if (think) { clearInterval(think.tick); clearInterval(think.rot); clearInterval(think.type); think = null; }
  vVerdict();
  if (st === "deciding") poll();
}
// While waiting on other people (or on the analysis), check again every few seconds.
function poll() {
  if (demo) return;
  pollTimer = setTimeout(async () => {
    if (inputStep || document.hidden) return poll();
    const sig = x => JSON.stringify([x.room.status, x.roster, !!x.analysis, x.room.decide_error, x.objections, x.room.decide_stage]);
    const before = sig(S);
    try { const next = await store.load(); if (next && sig(next) !== before) { S = next; render(); return; } } catch {}
    poll();
  }, S && S.room.status === "deciding" && !S.analysis ? 2500 : 5000);
}
async function refresh() {
  try { S = await store.load(); }
  catch (err) { console.error(err); return notice(t("err_generic")); }
  if (!S) return notice(t("no_access"));
  render();
}
Rooms.langToggle(() => {
  if (S) render();
  else if (joinToken || demo === "join") vJoin();
  else if (Rooms.sb && !Rooms.user) vSignIn();
});

async function start() {
  await Rooms.loadLang(Rooms.firstLang(demo === "ar" ? "ar" : null));
  try { MODELS = (await import("/rooms/models.js")).MODELS; } catch {}
  notice(t("loading"), true);
  $("demoNote").hidden = !demo;
  if (demo) return demo === "join" ? vJoin() : refresh();
  if (!roomId && !joinToken) return notice(t("no_room"));
  if (!(await Rooms.connect())) return notice(t("not_setup"));
  if (Rooms.user) {
    const p = await Rooms.profile();
    if (p?.language && !Rooms.savedLang() && p.language !== Rooms.lang) await Rooms.loadLang(p.language);
  }
  if (joinToken && !roomId) return vJoin();
  if (!Rooms.user) return vSignIn();
  refresh();
}
start();
})();
