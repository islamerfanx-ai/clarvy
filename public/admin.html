<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin · Decision Rooms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,300..600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/rooms/rooms.css">
<style>
/* The operator's admin page: numbers on top, sign-ups and AI cost, then everyone who signed up. */
main{--content:1120px}
.ad-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:8px 0 28px}
.ad-stat{background:#fff;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.ad-stat .n{font-size:36px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ad-stat .l{font-size:13px;color:var(--dim)}
.ad-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:28px}
.ad-box{background:#fff;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ad-box h2{margin:0;font-size:16px;font-weight:500}
.ad-bars{display:flex;align-items:flex-end;gap:3px;height:90px}
.ad-bars i{flex:1;background:var(--accent);min-height:2px}
.ad-kind{display:flex;justify-content:space-between;font-size:14px;border-top:1px solid var(--line);padding-top:6px;font-variant-numeric:tabular-nums}
.ad-tools{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.ad-tools input{flex:1;min-width:200px}
.ad-tools .btn{width:auto;padding:10px 16px}
.ad-table{overflow-x:auto;background:#fff}
.ad-table table{border-collapse:collapse;width:100%;min-width:980px;font-size:13px}
.ad-table th,.ad-table td{text-align:start;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.ad-table th{font-weight:500;color:var(--dim);font-size:12px}
.ad-table td.num{font-variant-numeric:tabular-nums;text-align:end}
.ad-table .no{color:var(--dim)}
</style>
</head>
<body>
<main>
  <header class="top">
    <a class="wm" href="/">Decision Rooms</a>
    <div class="top-acts"><a class="navlink" href="/dashboard.html" data-t="my_rooms">Your rooms</a><button class="lang" type="button" id="langBtn"></button></div>
  </header>
  <div id="view" aria-live="polite"><article class="msg"><p class="text thinking" data-t="loading">One moment</p></article></div>
</main>

<script src="/rooms/rooms.js"></script>
<script>
(() => {
const { $, el, t } = Rooms;
const view = $("view");
let data = null, query = "";

const fmt = d => d ? Rooms.fmtDate(String(d).slice(0, 10)) : "·";
const money = n => "$" + Number(n || 0).toFixed(2);
function csv(rows) {
  const cols = ["name", "email", "organisation", "job_title", "country", "sector", "org_size", "phone", "news", "signed_up", "last_seen", "rooms_owned", "rooms_in", "ai_cost"];
  const q = v => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return [cols.join(","), ...rows.map(r => cols.map(c => q(r[c])).join(","))].join("\n");
}
function render() {
  document.title = t("ad_title") + " · " + t("product");
  const d = data;
  const stat = (n, l) => { const c = el("div", "ad-stat"); c.append(el("span", "n", String(n)), el("span", "l", l)); return c; };
  const stats = el("div", "ad-stats");
  stats.append(stat(d.accounts, t("ad_accounts")), stat(d.profiles_complete, t("ad_complete")), stat(d.rooms, t("ad_rooms")),
    stat(d.decided, t("ad_decided")), stat(d.reviewed, t("ad_reviewed")), stat(money(d.cost_30d), t("ad_cost30")));
  // Sign-ups over the last 30 days
  const days = []; for (let i = 29; i >= 0; i--) { const x = new Date(); x.setDate(x.getDate() - i); days.push(x.toISOString().slice(0, 10)); }
  const per = Object.fromEntries((d.signups_by_day || []).map(x => [String(x.day).slice(0, 10), x.n]));
  const max = Math.max(1, ...days.map(x => per[x] || 0));
  const bars = el("div", "ad-bars");
  days.forEach(x => { const i = el("i"); i.style.height = ((per[x] || 0) / max * 100) + "%"; i.title = x + ": " + (per[x] || 0); bars.append(i); });
  const b1 = el("div", "ad-box"); b1.append(el("h2", null, t("ad_signups")), bars, el("p", "small", t("ad_signups_hint", { n: days.reduce((s, x) => s + (per[x] || 0), 0) })));
  const b2 = el("div", "ad-box"); b2.append(el("h2", null, t("ad_cost_kind")));
  const kinds = Object.entries(d.cost_by_kind || {}).sort((a, b) => b[1] - a[1]);
  if (!kinds.length) b2.append(el("p", "small", t("ad_no_cost")));
  kinds.forEach(([k, v]) => { const r = el("div", "ad-kind"); r.append(el("span", null, k), el("span", null, money(v))); b2.append(r); });
  const two = el("div", "ad-two"); two.append(b1, b2);
  // People
  const search = el("input", "line"); Object.assign(search, { type: "search", placeholder: t("ad_search"), value: query });
  search.setAttribute("aria-label", t("ad_search"));
  const exp = el("button", "btn soft", t("ad_csv")); exp.type = "button";
  const tools = el("div", "ad-tools"); tools.append(search, exp);
  const wrap = el("div", "ad-table");
  const shown = () => (d.people || []).filter(p => !query || [p.name, p.email, p.organisation, p.job_title, p.country, p.sector].filter(Boolean).some(x => String(x).toLowerCase().includes(query)));
  const drawTable = () => {
    const table = el("table");
    const head = el("tr"); ["ad_c_name", "ad_c_org", "ad_c_title", "ad_c_country", "ad_c_sector", "ad_c_signed", "ad_c_seen", "ad_c_rooms", "ad_c_in", "ad_c_cost"].forEach(k => head.append(el("th", null, t(k))));
    const thead = el("thead"); thead.append(head); table.append(thead);
    const body = el("tbody");
    shown().forEach(p => {
      const tr = el("tr");
      const nm = el("td"); nm.append(el("div", null, p.name || "·"), el("div", "small", p.email || ""));
      if (!p.complete) nm.append(el("div", "small no", t("ad_incomplete")));
      tr.append(nm, el("td", null, p.organisation || "·"), el("td", null, p.job_title || "·"), el("td", null, p.country || "·"), el("td", null, p.sector ? t("sector_" + p.sector) : "·"),
        el("td", null, fmt(p.signed_up)), el("td", null, fmt(p.last_seen)), el("td", "num", String(p.rooms_owned)), el("td", "num", String(p.rooms_in)), el("td", "num", money(p.ai_cost)));
      body.append(tr);
    });
    table.append(body);
    wrap.replaceChildren(table);
  };
  search.oninput = () => { query = search.value.trim().toLowerCase(); drawTable(); };
  exp.onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv(shown())], { type: "text/csv" }));
    a.download = "decision-rooms-people-" + new Date().toISOString().slice(0, 10) + ".csv"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  drawTable();
  view.replaceChildren(el("h1", "db-title", t("ad_title")), stats, two, el("h2", "sec-h", t("ad_people", { n: (d.people || []).length })), tools, wrap,
    el("p", "small", t("ad_note")));
}
async function load() {
  try { data = await Rooms.post("/api/admin/overview", {}); render(); }
  catch (e) { const c = el("article", "msg"); c.append(el("p", "text", t(e.message === "not_operator" ? "ad_not_operator" : "err_generic"))); view.replaceChildren(c); }
}
Rooms.langToggle(() => { if (data) render(); });
(async () => {
  await Rooms.loadLang(Rooms.firstLang());
  if (!(await Rooms.connect())) { view.replaceChildren(el("p", "text", t("not_setup"))); return; }
  if (!Rooms.hasAccount()) {
    const box = el("div", "stack-sm"), c = el("article", "msg you");
    c.append(el("p", "text sm", t("si_title")), box); view.replaceChildren(c);
    return Rooms.ensureAccount(box, { onDone: load });
  }
  load();
})();
})();
</script>
</body>
</html>
