<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin · Decision Rooms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,300..600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/rooms/rooms.css">
<style>
/* The operator's admin page: numbers on top, sign-ups and AI cost, then everyone who signed up. */
main{--content:1120px}
.ad-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:8px 0 28px}
.ad-stat{background:#fff;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.ad-stat .n{font-size:36px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ad-stat .l{font-size:13px;color:var(--dim)}
.ad-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:28px}
.ad-box{background:#fff;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ad-box h2{margin:0;font-size:16px;font-weight:500}
.ad-bars{display:flex;align-items:flex-end;gap:3px;height:90px}
.ad-bars i{flex:1;background:var(--accent);min-height:2px}
.ad-kind{display:flex;justify-content:space-between;font-size:14px;border-top:1px solid var(--line);padding-top:6px;font-variant-numeric:tabular-nums}
.ad-tools{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.ad-tools input{flex:1;min-width:200px}
.ad-tools .btn{width:auto;padding:10px 16px}
.ad-table{overflow-x:auto;background:#fff}
.ad-table table{border-collapse:collapse;width:100%;min-width:980px;font-size:13px}
.ad-table th,.ad-table td{text-align:start;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.ad-table th{font-weight:500;color:var(--dim);font-size:12px}
.ad-table td.num{font-variant-numeric:tabular-nums;text-align:end}
.ad-table .no{color:var(--dim)}
/* Growth: tabs, the north star, funnels, cohorts. */
.gr-tabs{position:sticky;top:0;z-index:5;background:var(--ink);display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin-bottom:22px;border-bottom:1px solid var(--line)}
.gr-tabs button{font:inherit;font-size:13px;white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 12px;border-radius:40px;cursor:pointer}
.gr-tabs button[aria-selected=true]{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.gr-q{color:var(--dim);font-size:14px;margin:-6px 0 16px}
.ad-stat .how{font-size:12px;color:var(--dim);border-top:1px solid var(--line);padding-top:6px;margin-top:auto}
.ad-stat .d{font-size:12px;font-family:var(--mono);color:var(--dim)}
.ad-stat.north{background:var(--accent);color:var(--ink)}
.ad-stat.north .l,.ad-stat.north .how,.ad-stat.north .d{color:var(--ink);opacity:.8;border-color:rgba(255,255,255,.2)}
.ad-stat.north .n{font-size:52px}
.gr-weeks{display:flex;align-items:flex-end;gap:4px;height:120px}
.gr-weeks div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;font-size:10px;font-family:var(--mono);color:var(--dim)}
.gr-weeks i{display:block;width:100%;background:var(--accent);min-height:2px}
.gr-weeks div.now i{background:var(--yellow);outline:1px solid var(--accent)}
.gr-funnel{display:flex;flex-direction:column;gap:8px}
.gr-frow{display:grid;grid-template-columns:minmax(120px,220px) 1fr 120px;gap:10px;align-items:center;font-size:14px}
.gr-fbar{height:22px;background:var(--accent-soft)}
.gr-fbar i{display:block;height:100%;background:var(--accent)}
.gr-fnum{font-variant-numeric:tabular-nums;text-align:end;font-family:var(--mono);font-size:12px}
@media (max-width:560px){.gr-frow{grid-template-columns:1fr 100px}.gr-frow .gr-fbar{grid-column:1/-1;grid-row:2}}
.gr-cohort td,.gr-cohort th{text-align:center}
.gr-cohort td:first-child,.gr-cohort th:first-child{text-align:start;white-space:nowrap}
.gr-pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:12px;font-family:var(--mono);background:var(--accent-soft)}
.gr-pill.bad{background:rgba(198,47,69,.12);color:var(--err)}
.gr-empty{color:var(--dim);font-size:14px}
/* Revenue and Ask */
.rv-table{overflow-x:auto;background:var(--card)}
.rv-table table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.rv-table th,.rv-table td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:end;white-space:nowrap}
.rv-table th{font-weight:500;color:var(--dim);font-size:12px}
.rv-table th:first-child,.rv-table td:first-child{text-align:start}
.rv-table .neg{color:var(--err)}
.rv-row{display:flex;justify-content:space-between;align-items:center;gap:8px 14px;flex-wrap:wrap;border-top:1px solid var(--line);padding:8px 0;font-size:14px}
.rv-row .acts{display:flex;gap:6px}
.rv-row .acts .btn{width:auto;padding:6px 12px;font-size:13px}
.rv-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-top:10px}
.rv-form .btn{width:auto}
.ask-log{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.ask-msg{background:var(--card);padding:12px 16px;max-width:820px;white-space:pre-wrap;font-size:15px}
.ask-msg.me{background:var(--accent-soft);align-self:flex-end}
.ask-msg .rv-table{margin-top:10px;background:transparent}
.ask-form{display:flex;gap:8px;position:sticky;bottom:0;background:var(--ink);padding:10px 0}
.ask-form input{flex:1}
.ask-form .btn{width:auto;padding:10px 18px}
.ask-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.ask-chips button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 12px;border-radius:40px;cursor:pointer}
.ad-version{display:inline-flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--yellow);padding:8px 14px;font-size:14px;margin:-4px 0 12px}
.ad-version b{font-weight:500;font-family:var(--mono);font-size:13px}
</style>
</head>
<body>
<main>
  <header class="top">
    <a class="wm" href="/">Decision Rooms</a>
    <div class="top-acts"><a class="navlink" href="/dashboard.html" data-t="my_rooms">Your rooms</a><button class="lang" type="button" id="langBtn"></button></div>
  </header>
  <div id="view" aria-live="polite"><article class="msg"><p class="text thinking" data-t="loading">One moment</p></article></div>
</main>

<script src="/rooms/rooms.js"></script>
<script>
(() => {
const { $, el, t } = Rooms;
const view = $("view");
let data = null, query = "";

const fmt = d => d ? Rooms.fmtDate(String(d).slice(0, 10)) : "·";
const money = n => "$" + Number(n || 0).toFixed(2);
function csv(rows) {
  const cols = ["name", "email", "organisation", "job_title", "country", "sector", "org_size", "phone", "news", "signed_up", "last_seen", "rooms_owned", "rooms_in", "ai_cost"];
  const q = v => { const s = v == null ? "" : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return [cols.join(","), ...rows.map(r => cols.map(c => q(r[c])).join(","))].join("\n");
}
/* ---------- Growth (2026-10-22): one tab per growth question, from admin_growth() ---------- */
const TABS = ["overview", "ask", "revenue", "acquisition", "activation", "loop", "rooms", "retention", "quality", "money", "orgs", "health", "people"];
let tab = (() => { try { const x = localStorage.getItem("dr-admin-tab"); return TABS.includes(x) ? x : "overview"; } catch { return "overview"; } })();
let growth = null, revenue = null;
const num = n => n == null ? "·" : Number(n).toLocaleString(Rooms.lang === "ar" ? "ar" : "en");
const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "·";
function stat(n, l, how, cls) {
  const c = el("div", "ad-stat" + (cls ? " " + cls : ""));
  c.append(el("span", "l", l), el("span", "n", String(n)));
  if (how) c.append(el("span", "how", how));
  return c;
}
function box(title, ...kids) { const b = el("div", "ad-box"); b.append(el("h2", null, title), ...kids); return b; }
function grid(cls, ...kids) { const g = el("div", cls); g.append(...kids); return g; }
function funnel(rows) {
  const f = el("div", "gr-funnel"), top = Math.max(1, rows[0]?.[1] || 0);
  rows.forEach(([label, n], i) => {
    const r = el("div", "gr-frow"), bar = el("div", "gr-fbar"), fill = el("i");
    fill.style.width = (100 * (n || 0) / top) + "%"; bar.append(fill);
    r.append(el("span", null, label), bar, el("span", "gr-fnum", num(n) + (i ? "  " + pct(n, rows[0][1]) : "")));
    f.append(r);
  });
  return f;
}
function list(items, show = x => x.k, val = x => num(x.n)) {
  if (!items?.length) return el("p", "gr-empty", t("gr_none"));
  const w = el("div");
  items.forEach(x => { const r = el("div", "ad-kind"); r.append(el("span", null, show(x)), el("span", null, val(x))); w.append(r); });
  return w;
}
function weeksChart(weeks, key) {
  const w = el("div", "gr-weeks"), max = Math.max(1, ...weeks.map(x => x[key] || 0));
  weeks.forEach((x, i) => {
    const c = el("div", i === weeks.length - 1 ? "now" : null), bar = el("i");
    bar.style.height = (100 * (x[key] || 0) / max) + "%"; c.title = fmt(x.week) + ": " + (x[key] || 0);
    c.append(el("span", null, String(x[key] || 0)), bar, el("span", null, String(x.week).slice(5, 10)));
    w.append(c);
  });
  return w;
}
const delta = (now, before) => before ? (now >= before ? "▲ " : "▼ ") + Math.abs(Math.round(100 * (now - before) / before)) + "% " + t("gr_vs_last") : t("gr_first_week");
let regions; const country = c => { try { regions = regions || new Intl.DisplayNames([Rooms.lang === "ar" ? "ar" : "en"], { type: "region" }); return regions.of(c) || c; } catch { return c; } };
const source = k => ["room_invite", "org_invite", "org_link", "direct", "unknown"].includes(k) ? t("gr_src_" + k) : k;

const panels = {
  overview(g) {
    const w = g.weeks || [], now = w[w.length - 1] || {}, last = w[w.length - 2] || {};
    const north = stat(num(now.decisions), t("gr_north"), t("gr_north_how"), "north");
    north.insertBefore(el("span", "d", delta(now.decisions || 0, last.decisions || 0)), north.lastChild);
    const perDecision = now.decisions ? "$" + (now.ai_cost / now.decisions).toFixed(2) : "·";
    return [grid("ad-stats", north, stat(num(now.active_owners), t("gr_active"), t("gr_active_how")), stat(num(now.new_accounts), t("gr_new"), t("gr_new_how")), stat(perDecision, t("gr_cost_dec"), t("gr_cost_dec_how"))),
      grid("ad-two", box(t("gr_dec_weeks"), weeksChart(w, "decisions")), box(t("gr_open_weeks"), weeksChart(w, "opened"))),
      grid("ad-two", box(t("gr_acc_weeks"), weeksChart(w, "new_accounts")), box(t("gr_owner_weeks"), weeksChart(w, "active_owners")))];
  },
  acquisition(g) {
    const a = g.acquisition || {};
    return [grid("ad-stats", stat(num(a.accounts), t("gr_acc_84")), stat(pct(a.profiles_done, a.accounts), t("gr_profiles_done"), t("gr_profiles_how", { n: num(a.profiles_done) }))),
      grid("ad-two", box(t("gr_sources"), list(a.sources, x => source(x.k))), box(t("gr_countries"), list(a.countries, x => country(x.k))), box(t("gr_sectors"), list(a.sectors, x => t("sector_" + x.k)))),
      el("p", "small", t("gr_visitors_note"))];
  },
  activation(g) {
    const a = g.activation || {};
    return [box(t("gr_act_title"), funnel([[t("gr_f_signed"), a.signed_up], [t("gr_f_profile"), a.profile], [t("gr_f_opened"), a.opened], [t("gr_f_answered"), a.answered], [t("gr_f_decided"), a.decided]])),
      grid("ad-stats", stat(a.days_first_room ?? "·", t("gr_days_room")), stat(a.days_first_decision ?? "·", t("gr_days_dec")))];
  },
  loop(g) {
    const l = g.loop || {};
    return [box(t("gr_loop_title"), funnel([[t("gr_l_invited"), l.invited], [t("gr_l_joined"), l.joined], [t("gr_l_answered"), l.answered], [t("gr_l_signed"), l.signed], [t("gr_l_own"), l.own_room]])),
      grid("ad-stats", stat(l.per_room ?? "·", t("gr_per_room")), stat(l.viral ?? "·", t("gr_viral"), t("gr_viral_how")))];
  },
  rooms(g) {
    const r = g.rooms || {};
    return [box(t("gr_rooms_title"), funnel([[t("gr_r_opened"), r.opened], [t("gr_r_invited"), r.invited], [t("gr_r_enough"), r.enough], [t("gr_r_decide"), r.decide], [t("gr_r_settled"), r.settled], [t("gr_r_planned"), r.planned], [t("gr_r_reviewed"), r.reviewed]]))];
  },
  retention(g) {
    const rows = g.cohorts || [];
    if (!rows.length) return [el("p", "gr-empty", t("gr_none"))];
    const tb = el("table"), head = el("tr");
    head.append(el("th", null, t("gr_cohort")), el("th", null, t("gr_owners")));
    for (let k = 0; k < 9; k++) head.append(el("th", null, t("gr_week_n", { n: k })));
    const th = el("thead"); th.append(head); tb.append(th);
    const body = el("tbody");
    rows.forEach(c => {
      const tr = el("tr"); tr.append(el("td", null, fmt(c.week)), el("td", null, num(c.owners)));
      for (let k = 0; k < 9; k++) {
        const v = (c.pct || [])[k], td = el("td", null, v == null ? "" : v + "%");
        if (v != null) td.style.background = `color-mix(in srgb, var(--accent) ${Math.round(v * .6)}%, transparent)`;
        if (v > 75) td.style.color = "var(--ink)";
        tr.append(td);
      }
      body.append(tr);
    });
    tb.append(body);
    const w = el("div", "ad-table gr-cohort"); w.append(tb); tb.style.minWidth = "640px";
    return [box(t("gr_ret_title"), w, el("p", "small", t("gr_ret_how")))];
  },
  quality(g) {
    const q = g.quality || {}, so = q.signoffs || {}, signed = (so.agree || 0) + (so.disagree_commit || 0) + (so.object || 0);
    return [grid("ad-stats", stat(pct(q.accepted, (q.accepted || 0) + (q.overridden || 0)), t("gr_accepted"), t("gr_accepted_how", { a: num(q.accepted), o: num(q.overridden) })),
        stat(pct(q.held_up, q.reviews), t("gr_held"), t("gr_held_how", { n: num(q.reviews) })), stat(q.days_to_decide ?? "·", t("gr_days_decide"))),
      grid("ad-two", box(t("gr_signoffs"), list(["agree", "disagree_commit", "object"].map(k => ({ k, n: so[k] || 0 })), x => t("gr_so_" + x.k), x => num(x.n) + "  " + pct(x.n, signed))),
        box(t("gr_calib"), list(q.by_confidence, x => t("gr_conf", { k: x.k }), x => pct(x.held, x.reviews) + "  (" + num(x.reviews) + ")"), el("p", "small", t("gr_calib_how"))))];
  },
  money(g) {
    const m = g.money || {}, perOwner = m.active_owners_30d ? m.cost_30d / m.active_owners_30d : null;
    return [grid("ad-stats", stat(money(m.cost_month), t("gr_cost_month")), stat(money(m.cost_30d), t("ad_cost30")), stat(m.cost_per_room == null ? "·" : money(m.cost_per_room), t("gr_cost_room")),
        stat(perOwner == null ? "·" : money(perOwner), t("gr_cost_owner"), perOwner == null ? null : t("gr_margin", { p: Math.round(100 - perOwner / 99 * 100) }))),
      grid("ad-two", box(t("ad_cost_kind"), list(m.by_kind, x => x.k, x => money(x.cost))),
        box(t("gr_upgrade"), list(m.upgrade, x => [x.name, x.organisation].filter(Boolean).join(" · "), x => t("gr_upgrade_row", { p: x.max_people, r: x.rooms_30d })), el("p", "small", t("gr_upgrade_how"))))];
  },
  orgs(g) {
    const rows = g.orgs || [];
    if (!rows.length) return [el("p", "gr-empty", t("gr_no_orgs")), orgsBox()];
    const tb = el("table"), head = el("tr");
    ["gr_o_name", "gr_o_people", "gr_o_active", "gr_o_rooms", "gr_o_dec", "gr_o_memory"].forEach(k => head.append(el("th", null, t(k))));
    const th = el("thead"); th.append(head); tb.append(th);
    const body = el("tbody");
    rows.forEach(o => { const tr = el("tr"); tr.append(el("td", null, o.name), el("td", "num", num(o.people)), el("td", "num", num(o.active_30d) + "  " + pct(o.active_30d, o.people)), el("td", "num", num(o.rooms_30d)), el("td", "num", num(o.decisions)), el("td", null, t(o.memory ? "gr_on" : "gr_off"))); body.append(tr); });
    tb.append(body); tb.style.minWidth = "640px";
    const w = el("div", "ad-table"); w.append(tb);
    return [w, orgsBox()];
  },
  health(g) {
    const h = g.health || {};
    const pill = (ok, txt) => el("span", "gr-pill" + (ok ? "" : " bad"), txt);
    const card = (n, l, ok, how) => { const c = stat(n ?? "·", l, how); c.append(pill(ok, t(ok ? "gr_ok" : "gr_look"))); return c; };
    return [grid("ad-stats",
      card(num(h.failed_now ?? 0), t("gr_h_failed"), !h.failed_now, t("gr_h_failed_how")),
      card(h.decide_seconds == null ? "·" : h.decide_seconds + "s", t("gr_h_time"), !(h.decide_seconds > 180), t("gr_h_time_how", { max: h.decide_seconds_max ?? "·" })),
      card(num(h.analyses_7d ?? 0), t("gr_h_runs"), true),
      card(num(h.decide_limit_hits_7d ?? 0), t("gr_h_limit"), !h.decide_limit_hits_7d, t("gr_h_limit_how")),
      card(num(h.stuck_open ?? 0), t("gr_h_stuck"), !h.stuck_open, t("gr_h_stuck_how")))];
  }
};
/* ---------- Revenue (2026-10-23): recorded by hand on this tab, Stripe later ---------- */
const usd = n => n == null ? "·" : (n < 0 ? "-$" : "$") + Math.abs(Number(n)).toLocaleString("en", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const pctv = v => v == null ? "·" : v + "%";
const monthLabel = m => new Date(m + "T00:00:00").toLocaleDateString(Rooms.lang === "ar" ? "ar" : "en", { month: "short", year: "2-digit" });
function table(cols, rows, minW = 640) {
  const t = el("table"), h = el("tr"); t.style.minWidth = minW + "px";
  cols.forEach(c => h.append(el("th", null, c)));
  const th = el("thead"); th.append(h); t.append(th);
  const b = el("tbody");
  rows.forEach(r => { const tr = el("tr"); r.forEach(c => { const td = el("td"); if (c instanceof Node) td.append(c); else td.textContent = c ?? "·"; tr.append(td); }); b.append(tr); });
  t.append(b);
  const w = el("div", "rv-table"); w.append(t); return w;
}
function monthsChart(months, key) {
  const w = el("div", "gr-weeks"), max = Math.max(1, ...months.map(x => x[key] || 0));
  months.forEach((x, i) => {
    const c = el("div", i === months.length - 1 ? "now" : null), bar = el("i");
    bar.style.height = (100 * (x[key] || 0) / max) + "%";
    c.append(el("span", null, x[key] ? Math.round(x[key]).toLocaleString("en") : "0"), bar, el("span", null, monthLabel(x.month)));
    w.append(c);
  });
  return w;
}
const plan = k => t("rv_plan_" + k);
const kind = k => t("rv_kind_" + k);
const margin = (mrr, cost) => mrr > 0 ? Math.round(100 * (mrr - cost) / mrr) + "%" : "·";
async function revenueDo(body, st) {
  try { await Rooms.post("/api/admin/revenue", body); revenue = await Rooms.post("/api/admin/revenue", { action: "summary" }); render(); }
  catch (e) { if (st) { st.className = "status err"; st.textContent = t(["no_account", "need_customer", "duplicate"].includes(e.message) ? "rv_err_" + e.message : "err_generic"); } }
}
// Who pays: an organisation, an account by email, or a name.
function customerFields() {
  const who = el("select", "line role-select"); who.setAttribute("aria-label", t("rv_customer"));
  [["email", t("rv_by_email")], ["name", t("rv_by_name")], ...orgs.map(o => ["org:" + o.id, o.name])].forEach(([v, l]) => { const op = el("option", null, l); op.value = v; who.append(op); });
  const email = el("input", "line"); Object.assign(email, { type: "email", placeholder: t("rv_email_ph") });
  const name = el("input", "line"); Object.assign(name, { placeholder: t("rv_name_ph"), maxLength: 160 });
  const sync = () => { email.hidden = who.value !== "email"; };
  who.onchange = sync; sync();
  return { nodes: [who, email, name], value: () => ({ email: who.value === "email" ? email.value.trim() : "", workspace_id: who.value.startsWith("org:") ? who.value.slice(4) : "", customer_name: name.value.trim() }) };
}
const field = (type, ph, val) => { const i = el("input", "line"); Object.assign(i, { type, placeholder: ph, value: val || "" }); i.setAttribute("aria-label", ph); return i; };

// Not an admin: say so, and offer to ask (or show that the request is waiting).
async function noAccess() {
  const c = el("article", "msg"), st = el("p", "status"); st.setAttribute("role", "status");
  const draw = status => {
    c.replaceChildren(el("p", "text", t(status === "pending" ? "ac_waiting" : status === "declined" ? "ac_declined" : "ac_no_access")));
    if (status !== "pending") {
      const ask = el("button", "btn", t("ac_ask")); ask.type = "button"; ask.style.width = "auto"; ask.style.alignSelf = "flex-start";
      ask.onclick = async () => {
        ask.disabled = true;
        try { draw((await Rooms.post("/api/admin/access", { action: "request" })).status); }
        catch (e) { st.className = "status err"; st.textContent = t(e.message === "profile_first" ? "ac_profile_first" : "err_generic"); ask.disabled = false; }
      };
      c.append(ask);
    }
    c.append(st);
  };
  let status = "none"; try { status = (await Rooms.post("/api/admin/access", { action: "status" })).status; } catch {}
  draw(status); view.replaceChildren(c);
}
async function load() {
  try {
    data = await Rooms.post("/api/admin/overview", {});
    [growth, revenue] = await Promise.all([Rooms.post("/api/admin/growth", {}).catch(() => null), Rooms.post("/api/admin/revenue", { action: "summary" }).catch(() => null), loadOrgs(), loadAccess()]);
    render();
  }
  catch (e) {
    if (e.message === "not_operator") return noAccess();
    const c = el("article", "msg"); c.append(el("p", "text", t("err_generic"))); view.replaceChildren(c);
  }
}
Rooms.langToggle(() => { regions = null; if (data) render(); });
(async () => {
  await Rooms.loadLang(Rooms.firstLang());
  if (!(await Rooms.connect())) { view.replaceChildren(el("p", "text", t("not_setup"))); return; }
  if (!Rooms.hasAccount()) {
    const box = el("div", "stack-sm"), c = el("article", "msg you");
    c.append(el("p", "text sm", t("si_title")), box); view.replaceChildren(c);
    return Rooms.ensureAccount(box, { onDone: load });
  }
  load();
})();
})();
</script>
